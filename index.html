Modules.define('LogView', ['UI', 'Log', 'Util', 'SelfTest'], (UI, Log, Util, SelfTest) => {
  const { html, options } = UI;
  const filtri = { livello: '', testo: '', da: '' };
  function filtrati() {
    const q = filtri.testo.toLowerCase();
    return Log.list().reverse().filter(e =>
      (!filtri.livello || e.level === filtri.livello) &&
      (!filtri.da || e.ts.slice(0, 10) >= filtri.da) &&
      (!q || (e.message + ' ' + e.detail + ' ' + e.module + ' ' + e.user).toLowerCase().includes(q)));
  }
  function render(el, ctx) {
    const draw = () => {
      const rows = filtrati();
      el.querySelector('#log-count').textContent = `${rows.length} voci`;
      el.querySelector('#log-table').innerHTML = UI.str(rows.length ? html`<div class="table-wrap"><table><thead><tr><th>Data/ora</th><th>Livello</th><th>Modulo</th><th>Messaggio</th><th>Utente</th></tr></thead><tbody>
        ${rows.map(e => html`<tr><td style="white-space:nowrap">${new Date(e.ts).toLocaleString('it-IT')}</td><td><span class="tag ${e.level}">${e.level}</span></td><td>${e.module}</td>
          <td>${e.message}${e.detail ? html`<details><summary class="muted">dettagli</summary><div class="log-detail">${e.detail}</div></details>` : ''}</td><td>${e.user}<div class="muted" style="font-size:11px">v${e.version}</div></td></tr>`)}
      </tbody></table></div>` : html`<div class="empty">Registro vuoto per i filtri selezionati.</div>`);
    };
    el.innerHTML = UI.str(html`
      <h1>Registro errori <span class="muted" id="log-count" style="font-size:13px;font-weight:400"></span></h1>
      <p class="muted">Il registro è conservato in questo browser (ultime 1000 voci). In caso di problemi copia il contenuto e invialo a chi gestisce l'applicazione.</p>
      <div class="toolbar">
        <select id="l-livello">${options([{ v: 'error', l: 'Errori' }, { v: 'warn', l: 'Avvisi' }, { v: 'info', l: 'Informazioni' }], filtri.livello, { empty: 'Tutti i livelli' })}</select>
        <label class="check">dal <input type="date" id="l-da" value="${filtri.da}" style="width:auto"></label>
        <input type="search" class="grow" id="l-testo" placeholder="Cerca nel registro…" value="${filtri.testo}">
        <button class="btn" id="l-copy">Copia</button>
        <button class="btn" id="l-download">Scarica .txt</button>
        <button class="btn danger" id="l-clear">Svuota</button>
        <button class="btn" id="l-test" title="Verifica calcoli di date, codici fiscali e riconoscimento testi">Esegui autodiagnosi</button>
      </div>
      <div id="test-out"></div>
      <div id="log-table"></div>`);
    const bindF = (id, key, ev = 'change') => el.querySelector(id).addEventListener(ev, (e) => { filtri[key] = e.target.value; draw(); });
    bindF('#l-livello', 'livello'); bindF('#l-da', 'da'); bindF('#l-testo', 'testo', 'input');
    el.querySelector('#l-copy').addEventListener('click', () => UI.guard('LogView', 'Copia registro', async () => {
      const rows = filtrati();
      await Util.copyText(Log.format(rows.slice().reverse()) || '(registro vuoto)');
      UI.toast(`${rows.length} voci copiate negli appunti`);
    }));
    el.querySelector('#l-download').addEventListener('click', () => Util.download(`registro-errori_${Util.todayISO()}.txt`, Log.format(filtrati().reverse()), 'text/plain;charset=utf-8'));
    el.querySelector('#l-clear').addEventListener('click', () => UI.guard('LogView', 'Svuotamento registro', async () => {
      if (!(await UI.confirmDialog('Svuotare il registro errori di questa postazione?', { ok: 'Svuota', danger: true }))) return;
      Log.clear(); ctx.refresh();
    }));
    el.querySelector('#l-test').addEventListener('click', () => {
      const res = SelfTest.run();
      const ko = res.filter(r => !r.ok);
      el.querySelector('#test-out').innerHTML = UI.str(html`<div class="alert ${ko.length ? 'danger' : 'ok'}"><strong>Autodiagnosi: ${res.length - ko.length}/${res.length} controlli superati.</strong>${ko.length ? html`<ul>${ko.map(r => html`<li>${r.name}: ${r.detail}</li>`)}</ul>` : ''}</div>`);
      draw();
    });
    draw();
  }
  return { title: 'Registro errori', render };
});

/* ---------------------------------------------------------------------
   SelfTest — controlli automatici sulle funzioni critiche (date,
   validazioni, parser, scadenze). Gli esiti negativi finiscono nel log.
   --------------------------------------------------------------------- */
Modules.define('SelfTest', ['Util', 'Dominio', 'Parser', 'Scadenzario', 'Log'], (Util, Dominio, Parser, Scadenzario, Log) => {
  const TESTO_1 = `CONTRATTO DI LOCAZIONE AD USO ABITATIVO (ai sensi dell'art. 2, comma 1, della legge 9 dicembre 1998 n. 431)
Il Sig. Mario Rossi, nato a Roma il 01/01/1980, residente in Padova, Via Roma 1, C.F. RSSMRA80A01H501U, di seguito denominato locatore, concede in locazione alla Sig.ra Giulia Bianchi, nata a Venezia il 01/08/1985, C.F. BNCGLI85M41L736Y, di seguito denominata conduttrice, l'unità immobiliare sita in Padova (PD), Via Garibaldi n. 12, piano secondo, censita al catasto fabbricati al foglio 45, particella 210, sub. 8, categoria A/2.
Il contratto è stipulato per la durata di anni 4 (quattro), dal 1° febbraio 2024 al 31 gennaio 2028, e si rinnova automaticamente per ulteriori 4 anni.
Il canone annuo è convenuto in euro 9.600,00 da corrispondere in rate mensili. Il locatore dichiara di optare per il regime della cedolare secca.
Letto, confermato e sottoscritto. Padova, lì 15/01/2024`;
  const TESTO_2 = `SCRITTURA PRIVATA DI LOCAZIONE COMMERCIALE
LOCATORE: IMMOBILIARE ALFA S.R.L., con sede in Treviso, P.IVA 01234567897, in persona del legale rappresentante sig. Mario Rossi, C.F. RSSMRA80A01H501U
CONDUTTORE: Beta Logistica S.p.A., C.F. e P.IVA 09876543217
Oggetto: immobile ad uso commerciale sito in Treviso, Via dell'Industria 8, categoria catastale D/7. Durata: sei anni (6+6) con decorrenza dal 01/03/2025. Canone annuo euro 24.000,00 oltre IVA.`;

  function run() {
    const results = [];
    const eq = (name, actual, expected) => {
      const ok = JSON.stringify(actual) === JSON.stringify(expected);
      results.push({ name, ok, detail: ok ? '' : `atteso ${JSON.stringify(expected)}, ottenuto ${JSON.stringify(actual)}` });
    };
    const safe = (name, fn) => { try { fn(); } catch (e) { results.push({ name, ok: false, detail: 'eccezione: ' + e.message }); } };
    safe('Date', () => {
      eq('31/01 + 1 mese (anno non bisestile)', Util.addMonths('2023-01-31', 1), '2023-02-28');
      eq('31/01 + 1 mese (anno bisestile)', Util.addMonths('2024-01-31', 1), '2024-02-29');
      eq('Scadenza 4 anni dal 01/01/2024', Dominio.calcolaScadenza('2024-01-01', 48), '2027-12-31');
      eq('Rinnovo 4 anni dopo 31/12/2027', Dominio.scadenzaDopoRinnovo('2027-12-31', 48), '2031-12-31');
      eq('Termine disdetta 6 mesi', Dominio.terminDisdetta('2027-12-31', 6), '2027-06-30');
      eq('Parsing data italiana', Util.parseDate('5/3/24'), '2024-03-05');
      eq('Data non valida', Util.parseDate('31/02/2024'), null);
    });
    safe('Numeri e CSV', () => {
      eq('Importo italiano', Util.parseNumber('1.234,56'), 1234.56);
      eq('Migliaia senza decimali', Util.parseNumber('9.600'), 9600);
      eq('CSV con virgolette', Util.parseCSV('a;b\n"x;1";"di ""qui"""'), [{ a: 'x;1', b: 'di "qui"' }]);
    });
    safe('Codici fiscali', () => {
      eq('CF valido', Parser.cfValido('RSSMRA80A01H501U'), true);
      eq('CF errato', Parser.cfValido('RSSMRA80A01H501X'), false);
      eq('P.IVA valida', Parser.pivaValida('01234567897'), true);
      eq('P.IVA errata', Parser.pivaValida('01234567890'), false);
    });
    safe('Dominio', () => {
      eq('A/10 è non abitativo', Dominio.categoriaDaCatastale('A/10'), 'non_abitativo');
      eq('C/6 è pertinenza', Dominio.categoriaDaCatastale('C/6'), 'pertinenza');
      eq('Cedolare con soggetto IVA segnalata', Dominio.verificaCoerenza({ regime_fiscale: 'cedolare_21', soggetto_iva: 1, tipologia: '4+4' }, 'abitativo').length > 0, true);
    });
    safe('Parser contratto abitativo', () => {
      const r = Parser.parse(TESTO_1);
      const loc = r.parti.find(p => p.ruolo === 'locatore') || {}, con = r.parti.find(p => p.ruolo === 'conduttore') || {};
      eq('Locatore', [loc.denominazione, loc.codice_fiscale], ['Mario Rossi', 'RSSMRA80A01H501U']);
      eq('Conduttore', [con.denominazione, con.codice_fiscale], ['Giulia Bianchi', 'BNCGLI85M41L736Y']);
      eq('Tipologia', r.contratto.tipologia, '4+4');
      eq('Regime', r.contratto.regime_fiscale, 'cedolare_21');
      eq('Date inizio/scadenza', [r.contratto.data_inizio, r.contratto.data_scadenza], ['2024-02-01', '2028-01-31']);
      eq('Data stipula', r.contratto.data_stipula, '2024-01-15');
      eq('Canone annuo', r.contratto.canone_annuo, 9600);
      eq('Immobile', [r.immobile.comune, r.immobile.provincia, r.immobile.indirizzo, r.immobile.categoria_catastale, r.immobile.categoria_fiscale, r.immobile.foglio, r.immobile.particella, r.immobile.subalterno], ['Padova', 'PD', 'Via Garibaldi n. 12', 'A/2', 'abitativo', '45', '210', '8']);
    });
    safe('Parser contratto commerciale', () => {
      const r = Parser.parse(TESTO_2);
      eq('Numero parti (legale rappresentante escluso)', r.parti.length, 2);
      const loc = r.parti.find(p => p.ruolo === 'locatore') || {}, con = r.parti.find(p => p.ruolo === 'conduttore') || {};
      eq('Locatore società', [loc.denominazione, loc.partita_iva, loc.tipo], ['IMMOBILIARE ALFA S.R.L.', '01234567897', 'PG']);
      eq('Conduttore società', [con.denominazione, con.partita_iva], ['Beta Logistica S.p.A.', '09876543217']);
      eq('Tipologia e regime', [r.contratto.tipologia, r.contratto.regime_fiscale, r.contratto.soggetto_iva], ['6+6', 'iva_imponibile', 1]);
      eq('Inizio e scadenza calcolata', [r.contratto.data_inizio, r.contratto.data_scadenza], ['2025-03-01', '2031-02-28']);
      eq('Categoria', [r.immobile.categoria_catastale, r.immobile.categoria_fiscale], ['D/7', 'strumentale']);
      eq('Indirizzo', [r.immobile.comune, r.immobile.indirizzo], ['Treviso', "Via dell'Industria 8"]);
    });
    safe('Scadenzario', () => {
      const base = { data_inizio: '2024-01-01', data_scadenza: '2027-12-31', data_stipula: '2023-12-20', preavviso_mesi: 6, stato: 'attivo', periodo: 1, canone_annuo: 12000, tipologia: '4+4', aggiornamento_istat: 1 };
      const ord = Scadenzario.genera({ ...base, regime_fiscale: 'ordinaria' }, 'abitativo', '2024-01-01');
      eq('Ordinaria: 3 annualità di registro', ord.filter(s => s.tipo === 'imposta_registro').length, 3);
      eq('Ordinaria: importo stimato 2%', ord.find(s => s.tipo === 'imposta_registro').importo, 240);
      eq('Registrazione entro 30 gg dalla stipula', ord.find(s => s.tipo === 'registrazione').data, '2024-01-19');
      const ced = Scadenzario.genera({ ...base, regime_fiscale: 'cedolare_21' }, 'abitativo', '2024-01-01');
      eq('Cedolare: niente registro annuale né ISTAT', ced.filter(s => s.tipo === 'imposta_registro' || s.tipo === 'istat').length, 0);
      eq('Termine disdetta', ced.find(s => s.tipo === 'disdetta').data, '2027-06-30');
    });
    const ko = results.filter(r => !r.ok);
    if (ko.length) Log.error('SelfTest', `${ko.length} controlli falliti su ${results.length}`, ko.map(r => r.name + ': ' + r.detail).join('\n'));
    else Log.info('SelfTest', `Autodiagnosi superata (${results.length} controlli)`);
    return results;
  }
  return { run };
});

/* ---------------------------------------------------------------------
   App — avvio, navigazione, barra di stato, sincronizzazione periodica.
   --------------------------------------------------------------------- */
Modules.define('App', ['Config', 'Log', 'Db', 'Seed', 'Prefs', 'UI', 'DashboardView', 'ContrattiView', 'ScadenzarioView', 'ImportaView', 'DatiView', 'ImpostazioniView', 'LogView'],
  (Config, Log, Db, Seed, Prefs, UI, DashboardView, ContrattiView, ScadenzarioView, ImportaView, DatiView, ImpostazioniView, LogView) => {
  const VIEWS = { dashboard: DashboardView, contratti: ContrattiView, scadenzario: ScadenzarioView, importa: ImportaView, dati: DatiView, impostazioni: ImpostazioniView, log: LogView };
  let current = 'dashboard';
  let pendingRefresh = false;
  const container = () => document.getElementById('view');

  function applyTheme() {
    const t = Prefs.get('tema');
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }
  function routeFromHash() {
    const name = (location.hash.replace(/^#\/?/, '').split('/')[0]) || 'dashboard';
    return VIEWS[name] ? name : 'dashboard';
  }
  const ctx = { refresh: () => render(), navigate: (n) => { location.hash = '#/' + n; }, applyTheme };
  function render() {
    current = routeFromHash();
    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === current));
    const view = VIEWS[current];
    document.title = `${view.title} – Contratti di locazione v${Config.APP_VERSION}`;
    try { view.render(container(), ctx); }
    catch (e) {
      Log.fromError('App', e, 'Visualizzazione ' + current);
      container().innerHTML = UI.str(UI.html`<div class="alert danger">Errore nella visualizzazione: ${e.message}. Dettagli nel <a href="#/log">registro errori</a>.</div>`);
    }
    updateStatus();
  }
  function updateStatus() {
    const st = Db.state();
    const pill = document.getElementById('db-status');
    const t = st.lastSync ? ' · ' + st.lastSync.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) : '';
    const map = {
      condiviso: ['ok', `● Condiviso: ${st.fileName}${t}`, 'Archivio condiviso collegato'],
      locale: ['warn', '● Archivio locale (solo questo browser)', 'I dati non sono condivisi: collega il file del server in Impostazioni'],
      attesa: ['danger', `● Ricollega ${st.folderName || st.fileName}`, 'Clicca per riconfermare l\'accesso al file condiviso'],
      memoria: st.dirty
        ? ['danger', `● ${st.fileName || 'Archivio'}: modifiche da salvare`, 'Salva l\'archivio (scarica il file) e rimettilo nella cartella del server']
        : ['info', `● ${st.fileName ? 'Aperto: ' + st.fileName : 'Nessun archivio aperto'}`, 'Archivio in memoria: apri e salva il file da Impostazioni']
    }[st.mode];
    pill.className = 'pill ' + map[0]; pill.textContent = map[1]; pill.title = map[2];
    pill.style.cursor = 'pointer';
    document.getElementById('user-badge').textContent = Prefs.get('utente') || 'utente non impostato';
    const n = Log.countErrors();
    const badge = document.getElementById('log-badge');
    badge.hidden = !n; badge.textContent = n;
  }

  async function start() {
    applyTheme();
    document.getElementById('app-version').textContent = 'v' + Config.APP_VERSION;
    document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => ctx.navigate(b.dataset.view)));
    window.addEventListener('hashchange', render);
    Log.onChange(updateStatus);
    document.getElementById('db-status').addEventListener('click', () => {
      if (Db.state().mode === 'attesa') UI.guard('App', 'Ricollegamento archivio', async () => { await Db.reconnect(); UI.toast('Archivio ricollegato'); render(); });
      else ctx.navigate('impostazioni');
    });
    if (!window.initSqlJs) throw new Error('Libreria SQLite non caricata: verificare la connessione a Internet (cdn.jsdelivr.net)');
    const r = await Db.start();
    if (r.isNew && Db.state().mode === 'locale') {
      await Seed.carica();
      Log.info('App', 'Primo avvio: creato il database e caricati i dati di esempio');
      UI.toast('Primo avvio: database creato con alcuni contratti di esempio (eliminabili da Impostazioni)', 'ok', 8000);
    }
    // Aggiornamenti dei colleghi: si ridisegna subito, o alla chiusura della finestra aperta.
    Db.onChange((reason) => {
      if (reason === 'esterno' || reason === 'archivio') {
        if (UI.isModalOpen() || ImportaView.isBusy()) pendingRefresh = true; else render();
      } else updateStatus();
    });
    UI.onModalClosed(() => { if (pendingRefresh) { pendingRefresh = false; render(); } });
    setInterval(() => { Db.poll().then(updateStatus); }, Config.POLL_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) Db.poll(); });
    // Modalità memoria: chiudere la pagina con modifiche non scaricate le perderebbe.
    window.addEventListener('beforeunload', (e) => { if (Db.state().mode === 'memoria' && Db.state().dirty) { e.preventDefault(); e.returnValue = ''; } });
    if (Db.state().mode === 'attesa') UI.toast('Clicca su "Ricollega" in alto per riaprire l\'archivio condiviso', 'warn', 10000);
    render();
  }
  return { start, render };
});

/* --- Avvio --- */
(function boot() {
  const Log = Modules.get('Log');
  Log.installGlobalHandlers();
  Modules.get('App').start().catch((e) => {
    Log.fromError('App', e, 'Avvio');
    const el = document.getElementById('view');
    el.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'alert danger';
    box.textContent = 'Impossibile avviare l\'applicazione: ' + e.message;
    el.appendChild(box);
    document.getElementById('db-status').textContent = 'Errore';
  });
})();
</script>
</body>
</html>
