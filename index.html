<script>
'use strict';
/* =====================================================================
   Gestione Contratti di Locazione — applicazione single-file.
   Architettura: moduli registrati con Modules.define(nome, dipendenze, factory).
   Ogni modulo riceve SOLO le dipendenze dichiarate: l'ordine di
   inizializzazione è risolto dal registro e le dipendenze circolari
   vengono segnalate come errore.
   ===================================================================== */
const Modules = (() => {
  const definitions = new Map();
  const instances = new Map();
  const resolving = new Set();
  function define(name, deps, factory) {
    if (definitions.has(name)) throw new Error('Modulo già definito: ' + name);
    definitions.set(name, { deps, factory });
  }
  function get(name) {
    if (instances.has(name)) return instances.get(name);
    const def = definitions.get(name);
    if (!def) throw new Error('Modulo non definito: ' + name);
    if (resolving.has(name)) throw new Error('Dipendenza circolare su: ' + name);
    resolving.add(name);
    const api = def.factory(...def.deps.map(get));
    resolving.delete(name);
    instances.set(name, api);
    return api;
  }
  return { define, get, list: () => [...definitions.keys()] };
})();

/* ---------------------------------------------------------------------
   Config — costanti dell'applicazione e URL delle librerie esterne.
   --------------------------------------------------------------------- */
Modules.define('Config', [], () => Object.freeze({
  APP_NAME: 'Gestione Contratti di Locazione',
  APP_VERSION: '1.2.0',
  IDB_NAME: 'contratti-locazione',
  LOG_KEY: 'cl.registroErrori',
  LOG_MAX: 1000,
  POLL_MS: 15000,
  CDN: {
    sqlWasmDir: 'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/',
    pdfjs: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
    pdfWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
    mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js',
    tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js'
  },
  FILE_SUPPORTATI: ['pdf', 'docx', 'txt', 'jpg', 'jpeg', 'png', 'bmp', 'webp', 'gif']
}));

/* ---------------------------------------------------------------------
   Log — registro errori persistente (localStorage, per postazione).
   Funziona anche se il database non si apre, per questo non dipende da Db.
   --------------------------------------------------------------------- */
Modules.define('Log', ['Config'], (Config) => {
  const listeners = new Set();
  let entries = load();

  function load() {
    try { return JSON.parse(localStorage.getItem(Config.LOG_KEY)) || []; } catch (e) { return []; }
  }
  function persist() {
    try { localStorage.setItem(Config.LOG_KEY, JSON.stringify(entries)); } catch (e) { /* storage pieno o bloccato: il log resta in memoria */ }
  }
  function notify() { listeners.forEach(fn => { try { fn(); } catch (e) { /* un listener rotto non deve bloccare il log */ } }); }
  function currentUser() { try { return localStorage.getItem('cl.utente') || ''; } catch (e) { return ''; } }

  function add(level, module, message, detail) {
    const entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      ts: new Date().toISOString(),
      level, module: module || 'app',
      message: String(message == null ? '' : message),
      detail: detail ? String(detail) : '',
      version: Config.APP_VERSION,
      user: currentUser()
    };
    entries.push(entry);
    if (entries.length > Config.LOG_MAX) entries = entries.slice(-Config.LOG_MAX);
    persist();
    if (level === 'error') console.error('[' + entry.module + ']', entry.message, entry.detail);
    notify();
    return entry;
  }
  function fromError(module, err, context) {
    const msg = (err && err.message) ? err.message : String(err);
    return add('error', module, (context ? context + ': ' : '') + msg, err && err.stack ? err.stack : '');
  }
  function installGlobalHandlers() {
    window.addEventListener('error', (e) => {
      add('error', 'globale', e.message || 'Errore non gestito', (e.error && e.error.stack) || (e.filename ? e.filename + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', (e) => fromError('globale', e.reason, 'Promessa non gestita'));
  }
  function format(list) {
    return list.map(e => `[${e.ts}] ${e.level.toUpperCase()} ${e.module} (v${e.version}${e.user ? ', ' + e.user : ''}): ${e.message}${e.detail ? '\n    ' + e.detail.replace(/\n/g, '\n    ') : ''}`).join('\n');
  }
  return {
    error: (m, msg, d) => add('error', m, msg, d),
    warn: (m, msg, d) => add('warn', m, msg, d),
    info: (m, msg, d) => add('info', m, msg, d),
    fromError, installGlobalHandlers, format,
    list: () => entries.slice(),
    countErrors: () => entries.filter(e => e.level === 'error').length,
    clear() { entries = []; persist(); notify(); },
    onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  };
});

/* ---------------------------------------------------------------------
   Util — date, numeri, CSV, hash, download, clipboard. Nessuno stato.
   Le date sono sempre stringhe ISO 'AAAA-MM-GG' (niente fusi orari).
   --------------------------------------------------------------------- */
Modules.define('Util', [], () => {
  const pad = (n) => String(n).padStart(2, '0');
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function isISODate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function nowStamp() { const d = new Date(); return `${todayISO()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
  function parts(iso) { const [y, m, d] = iso.split('-').map(Number); return { y, m, d }; }
  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function fromUTC(dt) { return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`; }
  function addDays(iso, n) { const { y, m, d } = parts(iso); return fromUTC(new Date(Date.UTC(y, m - 1, d + n))); }
  /** Somma mesi mantenendo il giorno; se il mese di arrivo è più corto si ferma all'ultimo giorno (31/01 + 1 mese = 28/02). */
  function addMonths(iso, n) {
    const { y, m, d } = parts(iso);
    const total = (y * 12 + (m - 1)) + n;
    const ny = Math.floor(total / 12), nm = (total % 12) + 1;
    return `${ny}-${pad(nm)}-${pad(Math.min(d, daysInMonth(ny, nm)))}`;
  }
  function diffDays(a, b) { const pa = parts(a), pb = parts(b); return Math.round((Date.UTC(pb.y, pb.m - 1, pb.d) - Date.UTC(pa.y, pa.m - 1, pa.d)) / 86400000); }
  function minDate(a, b) { if (!a) return b; if (!b) return a; return a < b ? a : b; }
  function fmtDate(iso) { if (!isISODate(iso)) return iso || ''; const { y, m, d } = parts(iso); return `${pad(d)}/${pad(m)}/${y}`; }
  /** Accetta 'AAAA-MM-GG', 'GG/MM/AAAA', 'GG-MM-AA', 'GG.MM.AAAA'. Restituisce ISO valida o null. */
  function parseDate(s) {
    if (s == null) return null;
    s = String(s).trim();
    if (!s) return null;
    let y, m, d, r;
    if ((r = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +r[1]; m = +r[2]; d = +r[3]; }
    else if ((r = s.match(/^(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})$/))) {
      d = +r[1]; m = +r[2]; y = +r[3];
      if (y < 100) y += y >= 70 ? 1900 : 2000;
    } else return null;
    if (m < 1 || m > 12 || d < 1 || d > daysInMonth(y, m) || y < 1900 || y > 2200) return null;
    return `${y}-${pad(m)}-${pad(d)}`;
  }
  /** '1.234,56' → 1234.56 ; '1234.56' → 1234.56 ; '1.234' → 1234 */
  function parseNumber(s) {
    if (s == null || s === '') return null;
    if (typeof s === 'number') return isFinite(s) ? s : null;
    let t = String(s).replace(/[€\s]/g, '').replace(/euro/i, '');
    if (!t) return null;
    if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    const n = Number(t);
    return isFinite(n) ? n : null;
  }
  function fmtEuro(n) { return n == null || n === '' ? '' : Number(n).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' }); }
  function fmtNumberIT(n) { return n == null || n === '' ? '' : Number(n).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: false }); }
  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
  function titleCase(s) { return String(s || '').toLowerCase().replace(/(^|[\s'’\-])([a-zà-ÿ])/g, (m, p, c) => p + c.toUpperCase()); }

  function download(filename, content, mime) {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try { await navigator.clipboard.writeText(text); return; } catch (e) { /* bloccato (es. iframe del sito): uso il metodo classico */ }
    }
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if (!ok) throw new Error('Copia negli appunti non consentita dal browser');
  }
  /** Impronta SHA-256 del contenuto, usata per riconoscere i documenti già importati. */
  async function sha256Hex(buffer) {
    if (window.crypto && crypto.subtle) {
      const h = await crypto.subtle.digest('SHA-256', buffer);
      return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    // Fallback (contesto non sicuro): FNV-1a a 32 bit + lunghezza. Meno robusto ma sufficiente a evitare doppioni.
    const bytes = new Uint8Array(buffer); let h = 0x811c9dc5;
    for (let i = 0; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, 0x01000193) >>> 0; }
    return 'fnv-' + h.toString(16) + '-' + bytes.length;
  }

  /* --- CSV (separatore ';' per Excel italiano, BOM UTF-8) --- */
  function toCSV(rows, columns, sep = ';') {
    const q = (v) => {
      const s = v == null ? '' : String(v);
      return /[";\n\r,]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lines = [columns.map(c => q(c.header || c.key)).join(sep)];
    for (const r of rows) lines.push(columns.map(c => q(c.get ? c.get(r) : r[c.key])).join(sep));
    return '﻿' + lines.join('\r\n');
  }
  /** Parser CSV con virgolette, a capo nei campi e rilevamento automatico del separatore (; , tab). */
  function parseCSV(text) {
    text = String(text).replace(/^﻿/, '');
    const firstLine = text.split(/\r?\n/, 1)[0] || '';
    const count = (ch) => firstLine.split(ch).length - 1;
    const sep = [';', ',', '\t'].sort((a, b) => count(b) - count(a))[0];
    const rows = []; let row = []; let field = ''; let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === sep) { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some(v => v !== '')) rows.push(row);
        row = [];
      } else field += c;
    }
    row.push(field);
    if (row.some(v => v !== '')) rows.push(row);
    if (!rows.length) return [];
    const header = rows[0].map(h => h.trim());
    return rows.slice(1).map(r => Object.fromEntries(header.map((h, i) => [h, (r[i] || '').trim()])));
  }

  return { esc, isISODate, todayISO, nowStamp, addDays, addMonths, diffDays, minDate, fmtDate, parseDate, parseNumber, fmtEuro, fmtNumberIT, debounce, titleCase, download, copyText, sha256Hex, toCSV, parseCSV };
});

/* ---------------------------------------------------------------------
   Ambiente — cosa consente il contesto in cui gira la pagina.
   Dentro un iframe "sandbox" senza allow-same-origin (es. area applicativi
   del sito) l'origine è opaca: niente IndexedDB/localStorage e niente
   selettori di file o cartelle con scrittura (File System Access API).
   --------------------------------------------------------------------- */
Modules.define('Ambiente', [], () => {
  const sandboxed = self.origin === 'null';
  let incorniciata = false;
  try { incorniciata = window.top !== window.self; } catch (e) { incorniciata = true; }
  return Object.freeze({
    sandboxed,
    incorniciata,
    /** Scrittura diretta di file e cartelle: Chrome/Edge, pagina non isolata e non incorniciata da un altro sito. */
    fileAccess: !sandboxed && typeof window.showOpenFilePicker === 'function',
    dirAccess: !sandboxed && typeof window.showDirectoryPicker === 'function'
  });
});

/* ---------------------------------------------------------------------
   Store — piccolo archivio chiave/valore su IndexedDB.
   Conserva la copia di lavoro del database e gli "handle" di file e
   cartelle (Chrome/Edge permettono di salvarli e riaprirli).
   Se IndexedDB non è disponibile (sandbox, navigazione privata) usa la
   memoria: available() lo segnala e Db passa alla modalità 'memoria'.
   --------------------------------------------------------------------- */
Modules.define('Store', ['Config'], (Config) => {
  let dbPromise = null;
  const memory = new Map();
  let useMemory = false;
  function open() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(Config.IDB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore('kv');
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbPromise;
  }
  /** true se i dati sopravvivono alla chiusura della pagina. */
  async function available() {
    try { await open(); return true; } catch (e) { useMemory = true; return false; }
  }
  function tx(mode, op) {
    if (useMemory) {
      const fake = { get: (k) => ({ result: memory.get(k) }), put: (v, k) => { memory.set(k, v); return {}; }, delete: (k) => { memory.delete(k); return {}; } };
      return Promise.resolve(op(fake)).then(r => r && r.result);
    }
    return open().then(db => new Promise((resolve, reject) => {
      const t = db.transaction('kv', mode);
      const req = op(t.objectStore('kv'));
      t.oncomplete = () => resolve(req && req.result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('Transazione IndexedDB annullata'));
    }));
  }
  return {
    available,
    get: (key) => tx('readonly', s => s.get(key)),
    set: (key, value) => tx('readwrite', s => s.put(value, key)),
    del: (key) => tx('readwrite', s => s.delete(key))
  };
});

/* ---------------------------------------------------------------------
   Prefs — preferenze della singola postazione (localStorage).
   I dati condivisi stanno nel database, non qui.
   --------------------------------------------------------------------- */
Modules.define('Prefs', [], () => {
  const DEFAULTS = { utente: '', ocrAttivo: true, ocrMaxPagine: 8, giorniAvviso: 60, tema: 'auto' };
  const KEYS = { utente: 'cl.utente', ocrAttivo: 'cl.ocrAttivo', ocrMaxPagine: 'cl.ocrMaxPagine', giorniAvviso: 'cl.giorniAvviso', tema: 'cl.tema' };
  function get(name) {
    try {
      const raw = localStorage.getItem(KEYS[name]);
      if (raw == null) return DEFAULTS[name];
      return typeof DEFAULTS[name] === 'string' ? raw : JSON.parse(raw);
    } catch (e) { return DEFAULTS[name]; }
  }
  function set(name, value) {
    try { localStorage.setItem(KEYS[name], typeof DEFAULTS[name] === 'string' ? String(value) : JSON.stringify(value)); } catch (e) { /* storage non disponibile */ }
  }
  return { get, set };
});

/* ---------------------------------------------------------------------

Modules.define('Migrations', [], () => {
  const MIGRATIONS = [
    {
      version: 1, name: 'Schema iniziale: soggetti, immobili, contratti, scadenze, rinnovi',

        CREATE TABLE soggetti (

          tipologia TEXT NOT NULL,

          soggetto_iva INTEGER NOT NULL DEFAULT 0 CHECK (soggetto_iva IN (0,1)),
          data_stipula TEXT,
          data_inizio TEXT NOT NULL,
          data_scadenza TEXT NOT NULL,
          durata_mesi INTEGER,
          durata_rinnovo_mesi INTEGER,
          preavviso_mesi INTEGER,
          canone_annuo REAL,
          deposito_cauzionale REAL,
          aggiornamento_istat INTEGER NOT NULL DEFAULT 0,
          data_registrazione TEXT,
          estremi_registrazione TEXT,
          stato TEXT NOT NULL DEFAULT 'attivo' CHECK (stato IN ('attivo','disdettato','cessato')),
          data_cessazione TEXT,
          periodo INTEGER NOT NULL DEFAULT 1,
          note TEXT,
          created_at TEXT NOT NULL DEFAULT (datetime('now','localtime')),
          updated_at TEXT NOT NULL DEFAULT (datetime('now','localtime'))
        );
        CREATE INDEX idx_contratti_scadenza ON contratti(data_scadenza);

        CREATE TABLE contratto_parti (
          contratto_id INTEGER NOT NULL REFERENCES contratti(id) ON DELETE CASCADE,
          soggetto_id INTEGER NOT NULL REFERENCES soggetti(id),
          ruolo TEXT NOT NULL CHECK (ruolo IN ('locatore','conduttore')),
          quota REAL,
          PRIMARY KEY (contratto_id, soggetto_id, ruolo)
        );

        CREATE TABLE scadenze (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          contratto_id INTEGER REFERENCES contratti(id) ON DELETE CASCADE,
          tipo TEXT NOT NULL,
          data TEXT NOT NULL,
          descrizione TEXT,
          importo REAL,
          automatica INTEGER NOT NULL DEFAULT 0,
          completata INTEGER NOT NULL DEFAULT 0,
          data_completamento TEXT,
          note TEXT,
          created_at TEXT NOT NULL DEFAULT (datetime('now','localtime'))
        );
        CREATE INDEX idx_scadenze_data ON scadenze(data);
        CREATE INDEX idx_scadenze_contratto ON scadenze(contratto_id);

        CREATE TABLE rinnovi (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          contratto_id INTEGER NOT NULL REFERENCES contratti(id) ON DELETE CASCADE,
          tipo TEXT NOT NULL,
          data_evento TEXT NOT NULL,
          scadenza_precedente TEXT,
          nuova_scadenza TEXT,
          canone_precedente REAL,
          nuovo_canone REAL,
          note TEXT,
          created_at TEXT NOT NULL DEFAULT (datetime('now','localtime'))
        );`
    },
    {
      version: 2, name: 'Documenti importati da cartella e impostazioni condivise',
      sql: `
        CREATE TABLE documenti (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          nome_file TEXT NOT NULL,
          percorso TEXT,
          dimensione INTEGER,
          ultima_modifica TEXT,
          impronta TEXT,
          testo_estratto TEXT,
          metodo_estrazione TEXT,
          dati_estratti TEXT,
          stato TEXT NOT NULL DEFAULT 'da_verificare' CHECK (stato IN ('da_verificare','importato','ignorato','errore')),
          messaggio TEXT,
          contratto_id INTEGER REFERENCES contratti(id) ON DELETE SET NULL,
          created_at TEXT NOT NULL DEFAULT (datetime('now','localtime')),
          updated_at TEXT NOT NULL DEFAULT (datetime('now','localtime'))
        );
        CREATE UNIQUE INDEX idx_documenti_impronta ON documenti(impronta);
        CREATE TABLE impostazioni (chiave TEXT PRIMARY KEY, valore TEXT);`
    },
    {
      version: 3, name: 'Tracciamento utente che modifica (uso condiviso tra più postazioni)',
      sql: `
        ALTER TABLE contratti ADD COLUMN modificato_da TEXT;
        ALTER TABLE scadenze ADD COLUMN completata_da TEXT;
        ALTER TABLE rinnovi ADD COLUMN registrato_da TEXT;`
    }
  ];

  function currentVersion(db) {
    db.run('CREATE TABLE IF NOT EXISTS schema_version (version INTEGER PRIMARY KEY, name TEXT, applied_at TEXT NOT NULL)');
    const res = db.exec('SELECT COALESCE(MAX(version), 0) FROM schema_version');
    return res.length ? res[0].values[0][0] : 0;
  }
  /** Applica le migrazioni mancanti. Restituisce l'elenco di quelle applicate. */
  function apply(db) {
    const from = currentVersion(db);
    const applied = [];
    for (const m of MIGRATIONS) {
      if (m.version <= from) continue;
      db.run('BEGIN');
      try {
        db.exec(m.sql);
        db.run("INSERT INTO schema_version (version, name, applied_at) VALUES (?, ?, datetime('now','localtime'))", [m.version, m.name]);
        db.run('COMMIT');
        applied.push(m);
      } catch (e) {
        db.run('ROLLBACK');
        throw new Error(`Migrazione ${m.version} (${m.name}) fallita: ${e.message}`);
      }

  }

});

/* ---------------------------------------------------------------------
   Db — database SQLite (sql.js) in memoria + persistenza.
   Modalità:
     'locale'     copia nel browser (IndexedDB) della singola postazione;
     'condiviso'  file .sqlite in una cartella del server scelta
                  dall'utente, letto/scritto con la File System Access API
                  (Chrome/Edge). Prima di ogni scrittura il file viene
                  ricaricato se un collega l'ha modificato, poi viene
                  riscritto subito: la finestra di conflitto si riduce a
                  pochi millisecondi. Una volta al giorno ne viene salvata
                  una copia nella sottocartella "backup".
     'attesa'     esiste un archivio condiviso ma il browser chiede di
                  riconfermare il permesso: si consulta la copia locale in
                  sola lettura finché l'utente non ricollega.
     'memoria'    il browser non consente di conservare dati (es. app
                  allegata al sito, che gira in sandbox): l'archivio si apre
                  da file e si salva scaricandolo.
   --------------------------------------------------------------------- */
Modules.define('Db', ['Config', 'Log', 'Store', 'Migrations', 'Ambiente'], (Config, Log, Store, Migrations, Ambiente) => {
  const NOME_ARCHIVIO = 'contratti-locazione.sqlite';
  const CARTELLA_BACKUP = 'backup';
  const BACKUP_DA_TENERE = 30;
  let SQL = null;
  let db = null;
  const state = { mode: 'locale', fileHandle: null, dirHandle: null, fileName: '', folderName: '', lastModified: null, lastSync: null, schema: null, dirty: false, backupDay: null };
  const listeners = new Set();
  let writeChain = Promise.resolve();

  const supportsFileAccess = () => Ambiente.fileAccess;
  const supportsFolder = () => Ambiente.dirAccess;
  const oggi = () => new Date().toISOString().slice(0, 10);
  function notify(reason) { listeners.forEach(fn => { try { fn(reason); } catch (e) { Log.fromError('Db', e, 'listener'); } }); }
  function clean(params) { return (params || []).map(v => v === undefined ? null : (typeof v === 'boolean' ? (v ? 1 : 0) : v)); }

  function openBytes(bytes) {
    const next = bytes ? new SQL.Database(bytes) : new SQL.Database();
    next.run('PRAGMA foreign_keys = ON');
    let info;
    try { info = Migrations.apply(next); } catch (e) { next.close(); throw e; }
    if (db) db.close();
    db = next;
    state.schema = info;
    if (info.newerThanApp) Log.warn('Db', `Il database è alla versione di schema ${info.from}, più recente di questa app (${Migrations.latest()}). Aggiornare l'app.`);
    if (info.applied.length) Log.info('Db', 'Migrazioni applicate: ' + info.applied.map(m => m.version).join(', '));
    return info;
  }
  /** db.export() di sql.js riapre il database e azzera i PRAGMA: li ripristiniamo. */
  function exportBytes() { const bytes = db.export(); db.run('PRAGMA foreign_keys = ON'); return bytes; }

  async function loadLocal() {
    const bytes = await Store.get('db.bytes');
    const info = openBytes(bytes ? new Uint8Array(bytes) : null);
    if (!bytes || info.applied.length) await Store.set('db.bytes', exportBytes());
    return { isNew: !bytes };
  }
  async function loadFromHandle(handle, dirHandle) {
    const file = await handle.getFile();
    const bytes = file.size ? new Uint8Array(await file.arrayBuffer()) : null;
    const info = openBytes(bytes);
    Object.assign(state, { mode: 'condiviso', fileHandle: handle, dirHandle: dirHandle || null, fileName: handle.name, folderName: dirHandle ? dirHandle.name : '', lastModified: file.lastModified, lastSync: new Date() });
    if (!bytes || info.applied.length) await writeToHandle(); // file nuovo o schema aggiornato: lo riscriviamo subito
    await Store.set('db.bytes', exportBytes());
  }
  async function writeToHandle() {
    const bytes = exportBytes();
    const w = await state.fileHandle.createWritable();
    await w.write(bytes);
    await w.close();
    const f = await state.fileHandle.getFile();
    state.lastModified = f.lastModified; state.lastSync = new Date();
    await backupGiornaliero(bytes);
  }
  /** Prima scrittura del giorno: copia in <cartella>/backup/ e conserva solo gli ultimi BACKUP_DA_TENERE. */
  async function backupGiornaliero(bytes) {
    if (!state.dirHandle || state.backupDay === oggi()) return;
    try {
      const dir = await state.dirHandle.getDirectoryHandle(CARTELLA_BACKUP, { create: true });
      const nome = state.fileName.replace(/\.[^.]+$/, '') + '_' + oggi() + '.sqlite';
      let esiste = true;
      try { await dir.getFileHandle(nome); } catch (e) { esiste = false; }
      if (!esiste) {
        const w = await (await dir.getFileHandle(nome, { create: true })).createWritable();
        await w.write(bytes); await w.close();
        const copie = [];
        for await (const [n, h] of dir.entries()) if (h.kind === 'file' && /_\d{4}-\d{2}-\d{2}\.sqlite$/.test(n)) copie.push(n);
        copie.sort();
        for (const vecchio of copie.slice(0, Math.max(0, copie.length - BACKUP_DA_TENERE))) await dir.removeEntry(vecchio);
        Log.info('Db', `Backup giornaliero ${CARTELLA_BACKUP}/${nome}`);
      }
      state.backupDay = oggi();
    } catch (e) {
      state.backupDay = oggi(); // un backup fallito non deve bloccare i salvataggi né ripetersi a ogni scrittura
      Log.fromError('Db', e, 'Backup giornaliero');
    }
  }
  async function persist() {
    if (state.mode === 'memoria') { state.dirty = true; notify('salvato'); return; }
    if (state.mode === 'condiviso') await writeToHandle();
    await Store.set('db.bytes', exportBytes());
    notify('salvato');
  }
  /** Ricarica il file condiviso se modificato da un'altra postazione. */
  async function refreshIfChanged() {
    if (state.mode !== 'condiviso') return false;
    const f = await state.fileHandle.getFile();
    if (f.lastModified === state.lastModified) { state.lastSync = new Date(); return false; }
    openBytes(new Uint8Array(await f.arrayBuffer()));
    state.lastModified = f.lastModified; state.lastSync = new Date();
    await Store.set('db.bytes', exportBytes());
    notify('esterno');
    return true;
  }

  async function start() {
    SQL = await window.initSqlJs({ locateFile: (f) => Config.CDN.sqlWasmDir + f });
    if (!(await Store.available())) {
      openBytes(null);
      state.mode = 'memoria';
      Log.info('Db', Ambiente.sandboxed ? 'Pagina in sandbox (es. allegata al sito): archivio in memoria, da aprire e salvare come file' : 'IndexedDB non disponibile: archivio in memoria');
      return { isNew: true };
    }
    const dirHandle = supportsFolder() ? await Store.get('db.dirHandle') : null;
    const handle = supportsFileAccess() ? await Store.get('db.fileHandle') : null;
    if (handle) {
      Object.assign(state, { fileHandle: handle, dirHandle: dirHandle || null, fileName: handle.name, folderName: dirHandle ? dirHandle.name : '' });
      let perm = 'prompt';
      try { perm = await (dirHandle || handle).queryPermission({ mode: 'readwrite' }); } catch (e) { Log.fromError('Db', e, 'Verifica permesso archivio'); }
      if (perm === 'granted') {
        try { await loadFromHandle(handle, dirHandle); return { isNew: false }; }
        catch (e) { Log.fromError('Db', e, 'Apertura archivio condiviso ' + handle.name); }
      }
      await loadLocal();
      state.mode = 'attesa';
      return { isNew: false };
    }
    const r = await loadLocal();
    state.mode = 'locale';
    return r;
  }

  /* --- query --- */
  function all(sql, params) {
    const stmt = db.prepare(sql);
    try {
      stmt.bind(clean(params));
      const rows = [];
      while (stmt.step()) rows.push(stmt.getAsObject());
      return rows;
    } finally { stmt.free(); }
  }
  function one(sql, params) { return all(sql, params)[0] || null; }
  function run(sql, params) {
    db.run(sql, clean(params));
    const changes = db.getRowsModified();
    const lastId = db.exec('SELECT last_insert_rowid()')[0].values[0][0];
    return { lastId, changes };
  }
  /** Esegue fn (sincrona) in transazione, poi salva. Le scritture sono serializzate. */
  function write(fn) {
    const job = writeChain.then(async () => {
      if (state.mode === 'attesa') throw new Error("Archivio condiviso non collegato: premi \"Ricollega\" in alto prima di modificare i dati.");
      await refreshIfChanged();
      db.run('BEGIN');
      let result;
      try { result = fn(); db.run('COMMIT'); }
      catch (e) { try { db.run('ROLLBACK'); } catch (e2) { /* transazione già chiusa */ } throw e; }
      await persist();
      return result;
    });
    writeChain = job.catch(() => {});
    return job;
  }
  /** Controllo periodico delle modifiche dei colleghi (accodato alle scritture). */
  function poll() {
    if (state.mode !== 'condiviso' || document.hidden) return Promise.resolve(false);
    const job = writeChain.then(() => refreshIfChanged());
    writeChain = job.catch(() => {});
    return job.catch(e => { Log.fromError('Db', e, 'Sincronizzazione archivio condiviso'); return false; });
  }

  /* --- gestione archivio --- */
  async function ensurePermission(handle) {
    if ((await handle.queryPermission({ mode: 'readwrite' })) === 'granted') return;
    if ((await handle.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('Permesso di scrittura negato');
  }
  async function memorizza() {
    await Store.set('db.fileHandle', state.fileHandle);
    if (state.dirHandle) await Store.set('db.dirHandle', state.dirHandle); else await Store.del('db.dirHandle');
  }
  /**
   * Fa scegliere la cartella del server in cui tenere l'archivio (va chiamata da un click).
   * Restituisce la cartella e se contiene già un archivio (contratti-locazione.sqlite).
   */
  async function pickFolder() {
    const dirHandle = await window.showDirectoryPicker({ id: 'archivio-contratti', mode: 'readwrite' });
    await ensurePermission(dirHandle);
    let esistente = null;
    try { esistente = await dirHandle.getFileHandle(NOME_ARCHIVIO); } catch (e) { if (e.name !== 'NotFoundError' && e.name !== 'TypeMismatchError') throw e; }
    return { dirHandle, esiste: !!esistente, nomeFile: NOME_ARCHIVIO };
  }
  /**
   * Collega la cartella scelta: se l'archivio esiste lo apre (i dati locali vengono sostituiti),
   * altrimenti lo crea con i dati attuali.
   */
  async function useFolder(dirHandle) {
    await writeChain;
    let handle = null;
    try { handle = await dirHandle.getFileHandle(NOME_ARCHIVIO); } catch (e) { handle = null; }
    if (handle) {
      await loadFromHandle(handle, dirHandle);
      Log.info('Db', `Aperto archivio ${NOME_ARCHIVIO} nella cartella ${dirHandle.name}`);
    } else {
      handle = await dirHandle.getFileHandle(NOME_ARCHIVIO, { create: true });
      Object.assign(state, { mode: 'condiviso', fileHandle: handle, dirHandle, fileName: handle.name, folderName: dirHandle.name, backupDay: null });
      await writeToHandle();
      await Store.set('db.bytes', exportBytes());
      Log.info('Db', `Creato archivio ${NOME_ARCHIVIO} nella cartella ${dirHandle.name}`);
    }
    await memorizza();
    notify('archivio');
  }
  /** Alternativa: collega un file .sqlite specifico (anche con un nome diverso). Senza cartella non si fanno backup. */
  async function connectShared() {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: 'Database SQLite', accept: { 'application/x-sqlite3': ['.sqlite', '.db', '.sqlite3'] } }],
      excludeAcceptAllOption: false, multiple: false
    });
    await ensurePermission(handle);
    await writeChain;
    await loadFromHandle(handle, null);
    await memorizza();
    Log.info('Db', 'Collegato archivio condiviso ' + handle.name);
    notify('archivio');
  }
  async function reconnect() {
    if (!state.fileHandle) throw new Error('Nessun archivio condiviso memorizzato');
    await ensurePermission(state.dirHandle || state.fileHandle);
    await loadFromHandle(state.fileHandle, state.dirHandle);
    notify('archivio');
  }
  async function disconnect() {
    await writeChain;
    await Store.del('db.fileHandle');
    await Store.del('db.dirHandle');
    Object.assign(state, { mode: 'locale', fileHandle: null, dirHandle: null, fileName: '', folderName: '', lastModified: null });
    await Store.set('db.bytes', exportBytes());
    Log.info('Db', 'Archivio condiviso scollegato: si lavora sulla copia locale');
    notify('archivio');
  }
  /** Sostituisce il database corrente con un file .sqlite (usato anche in modalità memoria e su Firefox/Safari). */
  async function replaceWithBytes(bytes, fileName) {
    await writeChain;
    if (state.mode === 'attesa') throw new Error('Ricollega prima l\'archivio condiviso');
    openBytes(new Uint8Array(bytes));
    if (state.mode === 'memoria') { state.fileName = fileName || state.fileName; state.dirty = false; notify('archivio'); return; }
    await persist();
    notify('archivio');
  }
  const TIPI_SQLITE = [{ description: 'Database SQLite', accept: { 'application/x-sqlite3': ['.sqlite', '.db', '.sqlite3'] } }];
  /**
   * Crea un nuovo archivio scegliendo cartella e nome del file ("Salva con nome") e vi copia i dati attuali.
   * Senza la cartella non si possono fare i backup giornalieri: per quelli si usa pickFolder/useFolder.
   */
  async function createAt() {
    const handle = await window.showSaveFilePicker({ id: 'archivio-contratti', suggestedName: NOME_ARCHIVIO, types: TIPI_SQLITE });
    await ensurePermission(handle);
    await writeChain;
    Object.assign(state, { mode: 'condiviso', fileHandle: handle, dirHandle: null, fileName: handle.name, folderName: '', backupDay: null });
    await writeToHandle();
    await Store.set('db.bytes', exportBytes());
    await memorizza();
    Log.info('Db', 'Creato archivio ' + handle.name + ' nel percorso scelto');
    notify('archivio');
    return handle.name;
  }
  /**
   * Salva una copia del database. Dove il browser lo consente apre "Salva con nome" (cartella e nome a scelta);
   * altrimenti (sito in sandbox, Firefox, Safari) la scarica nella cartella Download.
   * In modalità memoria la copia salvata azzera le "modifiche da salvare".
   * @returns {Promise<{name:string, sceltoPercorso:boolean}>}
   */
  async function saveCopy({ suggestedName } = {}) {
    const name = suggestedName || state.fileName || NOME_ARCHIVIO;
    await writeChain;
    const bytes = exportBytes();
    let esito;
    if (Ambiente.fileAccess && typeof window.showSaveFilePicker === 'function') {
      const handle = await window.showSaveFilePicker({ id: 'copie-contratti', suggestedName: name, types: TIPI_SQLITE });
      if (state.fileHandle && (await handle.isSameEntry(state.fileHandle))) throw new Error("Hai scelto il file dell'archivio in uso: per una copia scegli un altro nome o un'altra cartella");
      const w = await handle.createWritable();
      await w.write(bytes); await w.close();
      esito = { name: handle.name, sceltoPercorso: true };
    } else {
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/x-sqlite3' }));
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      esito = { name, sceltoPercorso: false };
    }
    if (state.mode === 'memoria') { state.dirty = false; notify('salvato'); }
    Log.info('Db', 'Copia dell\'archivio salvata: ' + esito.name);
    return esito;
  }
  async function resetEmpty() {
    await writeChain;
    if (state.mode === 'attesa') throw new Error('Ricollega prima l\'archivio condiviso');
    openBytes(null);
    await persist();
    notify('archivio');
  }

  return {
    start, all, one, run, write, poll, exportBytes, pickFolder, useFolder, connectShared, reconnect, disconnect, replaceWithBytes, createAt, saveCopy, resetEmpty,
    supportsFileAccess, supportsFolder, NOME_ARCHIVIO, state: () => ({ ...state }),
    onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    tableColumns: (table) => all(`PRAGMA table_info(${table})`).map(r => r.name)
  };
});
</script>
<script>
'use strict';
/* ---------------------------------------------------------------------
   Dominio — tabelle di riferimento (tipologie, regimi, categorie) e
   regole fiscali/civilistiche usate per calcoli e controlli di coerenza.
   Funzioni pure, senza accesso al database.
   --------------------------------------------------------------------- */
Modules.define('Dominio', ['Util'], (Util) => {
  const CATEGORIE_FISCALI = [
    { v: 'abitativo', l: 'Abitativo' },
    { v: 'non_abitativo', l: 'Non abitativo (negozi, uffici, laboratori)' },
    { v: 'strumentale', l: 'Strumentale per natura (cat. B, D, E)' },
    { v: 'pertinenza', l: 'Pertinenza (box, cantina, posto auto)' },
    { v: 'terreno_agricolo', l: 'Terreno agricolo' },
    { v: 'terreno_non_agricolo', l: 'Terreno non agricolo / edificabile' },
    { v: 'altro', l: 'Altro' }
  ];
  /** durata e rinnovo in mesi; preavviso = mesi di anticipo per la disdetta alla scadenza. */
  const TIPOLOGIE = [
    { v: '4+4', l: 'Abitativo libero 4+4 (L. 431/98, art. 2 c. 1)', durata: 48, rinnovo: 48, preavviso: 6 },
    { v: '3+2', l: 'Canone concordato 3+2 (L. 431/98, art. 2 c. 3)', durata: 36, rinnovo: 24, preavviso: 6 },
    { v: 'transitorio', l: 'Transitorio 1–18 mesi (L. 431/98, art. 5 c. 1)', durata: 12, rinnovo: 0, preavviso: 0, min: 1, max: 18 },
    { v: 'studenti', l: 'Studenti universitari 6–36 mesi (art. 5 c. 2)', durata: 12, rinnovo: 12, preavviso: 3, min: 6, max: 36 },
    { v: '6+6', l: 'Non abitativo 6+6 (L. 392/78, art. 27)', durata: 72, rinnovo: 72, preavviso: 12 },
    { v: '9+9', l: 'Alberghiero / teatrale 9+9 (L. 392/78, art. 27)', durata: 108, rinnovo: 108, preavviso: 18 },
    { v: 'libero', l: 'Durata libera / altro (es. terreni, posti auto)', durata: 12, rinnovo: 12, preavviso: 3 }
  ];
  const REGIMI = [
    { v: 'ordinaria', l: 'Tassazione ordinaria (IRPEF/IRES + imposta di registro)' },
    { v: 'cedolare_21', l: 'Cedolare secca 21%' },
    { v: 'cedolare_10', l: 'Cedolare secca 10% (canone concordato)' },
    { v: 'iva_imponibile', l: 'Soggetto IVA – locazione imponibile' },
    { v: 'iva_esente', l: 'Soggetto IVA – locazione esente (art. 10 DPR 633/72)' },
    { v: 'altro', l: 'Altro regime' }
  ];
  const STATI = [
    { v: 'attivo', l: 'Attivo' },
    { v: 'disdettato', l: 'Disdetta inviata (cessa alla scadenza)' },
    { v: 'cessato', l: 'Cessato' }
  ];
  const TIPI_SCADENZA = [
    { v: 'registrazione', l: 'Registrazione contratto (mod. RLI)' },
    { v: 'imposta_registro', l: 'Imposta di registro annualità successiva' },
    { v: 'istat', l: 'Aggiornamento ISTAT del canone' },
    { v: 'disdetta', l: 'Termine ultimo per inviare disdetta' },
    { v: 'scadenza', l: 'Scadenza del contratto' },
    { v: 'comunicazione_rli', l: 'Comunicazione proroga/cessazione (RLI)' },
    { v: 'altro', l: 'Altro adempimento' }
  ];
  const TIPI_RINNOVO = [
    { v: 'rinnovo_tacito', l: 'Rinnovo alla scadenza (stesse condizioni)', prolunga: true },
    { v: 'rinnovo_nuove_condizioni', l: 'Rinnovo con nuove condizioni', prolunga: true },
    { v: 'proroga', l: 'Proroga a una data concordata', prolunga: true },
    { v: 'disdetta', l: 'Disdetta: il contratto cessa alla scadenza', prolunga: false },
    { v: 'risoluzione', l: 'Risoluzione anticipata / recesso', prolunga: false }
  ];

  const label = (list, v) => (list.find(x => x.v === v) || { l: v || '' }).l;
  const tipologia = (v) => TIPOLOGIE.find(t => t.v === v) || TIPOLOGIE[TIPOLOGIE.length - 1];
  const isCedolare = (r) => r === 'cedolare_21' || r === 'cedolare_10';

  /** Fine periodo: inizio + mesi − 1 giorno (dal 01/01/2024 per 48 mesi → 31/12/2027). */
  function calcolaScadenza(inizio, mesi) {
    if (!Util.isISODate(inizio) || !mesi) return null;
    return Util.addDays(Util.addMonths(inizio, Number(mesi)), -1);
  }
  /** Nuova scadenza dopo un rinnovo di `mesi` mesi a partire dal giorno dopo la scadenza attuale. */
  function scadenzaDopoRinnovo(scadenzaAttuale, mesi) {
    if (!Util.isISODate(scadenzaAttuale) || !mesi) return null;
    return calcolaScadenza(Util.addDays(scadenzaAttuale, 1), mesi);
  }
  /** Ultimo giorno utile per la disdetta: scadenza − preavviso. */
  function terminDisdetta(scadenza, preavvisoMesi) {
    if (!Util.isISODate(scadenza) || !preavvisoMesi) return null;
    return Util.addDays(Util.addMonths(Util.addDays(scadenza, 1), -Number(preavvisoMesi)), -1);
  }
  /** Mappa la categoria catastale (es. 'A/10', 'C/1') sulla categoria fiscale. */
  function categoriaDaCatastale(cat) {
    const m = String(cat || '').toUpperCase().replace(/\s/g, '').match(/^([A-F])\/?(\d{1,2})$/);
    if (!m) return null;
    const [, gruppo, n] = m; const num = Number(n);
    if (gruppo === 'A') return num === 10 ? 'non_abitativo' : 'abitativo';
    if (gruppo === 'C') return [2, 6, 7].includes(num) ? 'pertinenza' : 'non_abitativo';
    if (gruppo === 'B' || gruppo === 'D' || gruppo === 'E') return 'strumentale';
    return 'altro';
  }
  /**
   * Stima dell'imposta di registro annuale (regime non cedolare).
   * Aliquote: 2% abitativo e non abitativo ordinario; 1% fabbricati strumentali
   * locati da soggetti IVA; 0,5% terreni agricoli. Canone concordato:
   * base imponibile ridotta al 70%. È una STIMA: il calcolo esatto resta
   * all'operatore (minimo di 67 € solo sulla prima annualità).
   */
  function stimaImpostaRegistro(contratto, categoriaFiscale) {
    const canone = Number(contratto.canone_annuo) || 0;
    if (!canone || isCedolare(contratto.regime_fiscale)) return null;
    let aliquota = 0.02;
    if (categoriaFiscale === 'terreno_agricolo') aliquota = 0.005;
    else if (contratto.soggetto_iva && ['strumentale', 'non_abitativo'].includes(categoriaFiscale)) aliquota = 0.01;
    const base = contratto.tipologia === '3+2' ? canone * 0.7 : canone;
    return Math.round(base * aliquota * 100) / 100;
  }
  /** Controlli di coerenza: restituisce avvisi leggibili, non blocca il salvataggio. */
  function verificaCoerenza(c, categoriaFiscale) {
    const avvisi = [];
    if (isCedolare(c.regime_fiscale) && Number(c.soggetto_iva)) avvisi.push('La cedolare secca non è applicabile da locatori che agiscono nell\'esercizio di impresa o professione (soggetti IVA).');
    if (isCedolare(c.regime_fiscale) && !['abitativo', 'pertinenza'].includes(categoriaFiscale)) avvisi.push('La cedolare secca è ammessa, in via generale, per immobili abitativi e relative pertinenze: verificare.');
    if (c.regime_fiscale === 'cedolare_10' && !['3+2', 'transitorio', 'studenti'].includes(c.tipologia)) avvisi.push('L\'aliquota del 10% spetta ai contratti a canone concordato (3+2, transitori e studenti concordati).');
    if ((c.regime_fiscale === 'iva_imponibile' || c.regime_fiscale === 'iva_esente') && !Number(c.soggetto_iva)) avvisi.push('Regime IVA selezionato ma "Soggetto IVA" impostato su No.');
    if (['4+4', '3+2', 'transitorio', 'studenti'].includes(c.tipologia) && categoriaFiscale && !['abitativo', 'pertinenza'].includes(categoriaFiscale)) avvisi.push('Tipologia contrattuale abitativa su immobile non abitativo.');
    if (['6+6', '9+9'].includes(c.tipologia) && categoriaFiscale === 'abitativo') avvisi.push('Tipologia 6+6/9+9 su immobile abitativo.');
    const t = tipologia(c.tipologia);
    if (t.min && c.durata_mesi && (c.durata_mesi < t.min || c.durata_mesi > t.max)) avvisi.push(`Durata di ${c.durata_mesi} mesi fuori dai limiti della tipologia (${t.min}–${t.max} mesi).`);
    if (Util.isISODate(c.data_inizio) && Util.isISODate(c.data_scadenza) && c.data_scadenza <= c.data_inizio) avvisi.push('La data di scadenza è precedente o uguale alla data di inizio.');
    if (isCedolare(c.regime_fiscale) && Number(c.aggiornamento_istat)) avvisi.push('Con la cedolare secca il locatore rinuncia all\'aggiornamento ISTAT del canone.');
    return avvisi;
  }
  /** Accetta sia il codice ('4+4') sia l'etichetta, senza distinzione di maiuscole (usato negli import CSV). */
  function normalizza(list, value) {
    const s = String(value || '').trim().toLowerCase();
    if (!s) return null;
    const found = list.find(x => x.v.toLowerCase() === s || x.l.toLowerCase() === s) || list.find(x => x.l.toLowerCase().startsWith(s));
    return found ? found.v : null;
  }

  return {
    CATEGORIE_FISCALI, TIPOLOGIE, REGIMI, STATI, TIPI_SCADENZA, TIPI_RINNOVO,
    label, tipologia, isCedolare, calcolaScadenza, scadenzaDopoRinnovo, terminDisdetta,
    categoriaDaCatastale, stimaImpostaRegistro, verificaCoerenza, normalizza
  };
});

/* ---------------------------------------------------------------------
   Scadenzario — genera e gestisce le scadenze dei contratti.
   Le scadenze "automatiche" vengono ricalcolate a ogni salvataggio del
   contratto per il periodo contrattuale in corso; quelle completate e
   quelle inserite a mano non vengono mai toccate.
   --------------------------------------------------------------------- */
Modules.define('Scadenzario', ['Db', 'Util', 'Dominio', 'Prefs'], (Db, Util, Dominio, Prefs) => {
  /** Inizio del periodo in corso: giorno successivo all'ultima scadenza superata da un rinnovo. */
  function inizioPeriodo(contrattoId, dataInizio) {
    const r = Db.one("SELECT scadenza_precedente FROM rinnovi WHERE contratto_id = ? AND tipo IN ('rinnovo_tacito','rinnovo_nuove_condizioni','proroga') AND scadenza_precedente IS NOT NULL ORDER BY scadenza_precedente DESC LIMIT 1", [contrattoId]);
    return r ? Util.addDays(r.scadenza_precedente, 1) : dataInizio;
  }

  /** Funzione pura: calcola le scadenze automatiche per il periodo [periodStart, data_scadenza]. */
  function genera(c, categoriaFiscale, periodStart) {
    const out = [];
    if (!Util.isISODate(c.data_inizio) || !Util.isISODate(c.data_scadenza)) return out;
    const fine = c.stato === 'cessato' && Util.isISODate(c.data_cessazione) ? c.data_cessazione : c.data_scadenza;
    const ced = Dominio.isCedolare(c.regime_fiscale);

    if (!c.data_registrazione && Number(c.periodo || 1) === 1) {
      const base = Util.minDate(c.data_stipula, c.data_inizio);
      out.push({ tipo: 'registrazione', data: Util.addDays(base, 30), descrizione: 'Registrazione entro 30 giorni dalla stipula o dalla decorrenza, se anteriore' + (ced ? ' (con opzione cedolare secca)' : '') });
    }
    // Anniversari: annualità successive dell'imposta di registro e aggiornamento ISTAT.
    const importo = Dominio.stimaImpostaRegistro(c, categoriaFiscale);
    for (let k = 1; k < 100; k++) {
      const anniv = Util.addMonths(c.data_inizio, 12 * k);
      if (anniv > fine) break;
      if (anniv < periodStart) continue;
      // Prima annualità di un periodo rinnovato: l'imposta si versa con la comunicazione di proroga (RLI), già in scadenzario.
      if (!ced && c.regime_fiscale !== 'altro' && !(Number(c.periodo || 1) > 1 && anniv === periodStart)) {
        out.push({ tipo: 'imposta_registro', data: Util.addDays(anniv, 30), importo, descrizione: `Imposta di registro ${k + 1}ª annualità (decorrenza ${Util.fmtDate(anniv)})` + (importo != null ? ' – importo stimato' : '') });
      }
      if (!ced && Number(c.aggiornamento_istat)) {
        out.push({ tipo: 'istat', data: anniv, descrizione: `Aggiornamento ISTAT canone dal ${Util.fmtDate(anniv)}` });
      }
    }
    if (c.stato === 'attivo') {
      const td = Dominio.terminDisdetta(c.data_scadenza, c.preavviso_mesi);
      if (td && td >= periodStart) out.push({ tipo: 'disdetta', data: td, descrizione: `Ultimo giorno per inviare disdetta (preavviso ${c.preavviso_mesi} mesi)` });
    }
    if (c.stato !== 'cessato') out.push({ tipo: 'scadenza', data: c.data_scadenza, descrizione: c.stato === 'disdettato' ? 'Fine contratto (disdetta inviata): riconsegna immobile' : 'Scadenza periodo contrattuale: valutare rinnovo, proroga o disdetta' });
    return out;
  }

  /**
   * Rigenera le scadenze automatiche di un contratto (da chiamare dentro Db.write).
   * presumiPassate=true solo alla creazione: gli adempimenti già trascorsi
   * vengono registrati come completati, per non riempire lo scadenzario di
   * arretrati fittizi quando si importano contratti vecchi.
   */
  function rigenera(contrattoId, { presumiPassate = false } = {}) {
    const c = Db.one('SELECT * FROM contratti WHERE id = ?', [contrattoId]);
    if (!c) return;
    const imm = c.immobile_id ? Db.one('SELECT categoria_fiscale FROM immobili WHERE id = ?', [c.immobile_id]) : null;
    const periodStart = inizioPeriodo(contrattoId, c.data_inizio);
    // Nel primo periodo si ricalcola tutto (le date del contratto possono essere state corrette);
    // nei periodi successivi si lasciano intatti gli arretrati dei periodi precedenti.
    if (Number(c.periodo || 1) === 1) Db.run('DELETE FROM scadenze WHERE contratto_id = ? AND automatica = 1 AND completata = 0', [contrattoId]);
    else Db.run('DELETE FROM scadenze WHERE contratto_id = ? AND automatica = 1 AND completata = 0 AND data >= ?', [contrattoId, periodStart]);
    const oggi = Util.todayISO();
    const utente = Prefs.get('utente');
    for (const s of genera(c, imm && imm.categoria_fiscale, periodStart)) {
      const exists = Db.one('SELECT id FROM scadenze WHERE contratto_id = ? AND tipo = ? AND data = ?', [contrattoId, s.tipo, s.data]);
      if (exists) continue;
      const done = presumiPassate && s.data < oggi;
      Db.run('INSERT INTO scadenze (contratto_id, tipo, data, descrizione, importo, automatica, completata, data_completamento, completata_da, note) VALUES (?,?,?,?,?,1,?,?,?,?)',
        [contrattoId, s.tipo, s.data, s.descrizione, s.importo == null ? null : s.importo, done ? 1 : 0, done ? oggi : null, done ? utente : null, done ? 'Presunta già eseguita: data anteriore all\'inserimento del contratto' : null]);
    }
  }

  function list() {
    return Db.all(`
      SELECT s.*, c.codice, c.stato AS stato_contratto, c.tipologia, i.indirizzo, i.comune,
        (SELECT group_concat(so.denominazione, ', ') FROM contratto_parti p JOIN soggetti so ON so.id = p.soggetto_id WHERE p.contratto_id = c.id AND p.ruolo = 'locatore') AS locatori,
        (SELECT group_concat(so.denominazione, ', ') FROM contratto_parti p JOIN soggetti so ON so.id = p.soggetto_id WHERE p.contratto_id = c.id AND p.ruolo = 'conduttore') AS conduttori
      FROM scadenze s
      LEFT JOIN contratti c ON c.id = s.contratto_id
      LEFT JOIN immobili i ON i.id = c.immobile_id
      ORDER BY s.data, s.id`);
  }
  function filtra(rows, { periodo = '90', tipo = '', stato = 'aperte', testo = '' } = {}) {
    const oggi = Util.todayISO();
    const q = testo.trim().toLowerCase();
    return rows.filter(s => {
      if (stato === 'aperte' && s.completata) return false;
      if (stato === 'completate' && !s.completata) return false;
      if (tipo && s.tipo !== tipo) return false;
      if (periodo === 'scadute' && !(s.data < oggi && !s.completata)) return false;
      if (/^\d+$/.test(periodo) && !(s.data <= Util.addDays(oggi, Number(periodo)) && (s.data >= oggi || !s.completata))) return false;
      if (q && ![s.codice, s.descrizione, s.locatori, s.conduttori, s.indirizzo, s.comune, s.note].some(v => String(v || '').toLowerCase().includes(q))) return false;
      return true;
    });
  }
  function setCompletata(id, completata) {
    return Db.write(() => Db.run('UPDATE scadenze SET completata = ?, data_completamento = ?, completata_da = ? WHERE id = ?',
      [completata ? 1 : 0, completata ? Util.todayISO() : null, completata ? Prefs.get('utente') : null, id]));
  }
  function salvaManuale(s) {
    return Db.write(() => {
      if (s.id) Db.run('UPDATE scadenze SET contratto_id = ?, tipo = ?, data = ?, descrizione = ?, importo = ?, note = ? WHERE id = ?', [s.contratto_id || null, s.tipo, s.data, s.descrizione, s.importo, s.note, s.id]);
      else Db.run('INSERT INTO scadenze (contratto_id, tipo, data, descrizione, importo, automatica, note) VALUES (?,?,?,?,?,0,?)', [s.contratto_id || null, s.tipo, s.data, s.descrizione, s.importo, s.note]);
    });
  }
  function elimina(id) { return Db.write(() => Db.run('DELETE FROM scadenze WHERE id = ?', [id])); }

  /** Calendario .ics (Outlook, Google Calendar) con promemoria a 7 giorni. */
  function toICS(rows) {
    const escICS = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Gestione Contratti Locazione//IT', 'CALSCALE:GREGORIAN'];
    for (const s of rows) {
      const d = s.data.replace(/-/g, '');
      const end = Util.addDays(s.data, 1).replace(/-/g, '');
      lines.push('BEGIN:VEVENT', `UID:scadenza-${s.id}@contratti-locazione`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${end}`,
        `SUMMARY:${escICS(Dominio.label(Dominio.TIPI_SCADENZA, s.tipo) + (s.codice ? ' – ' + s.codice : ''))}`,
        `DESCRIPTION:${escICS([s.descrizione, s.locatori && 'Locatore: ' + s.locatori, s.conduttori && 'Conduttore: ' + s.conduttori, s.indirizzo].filter(Boolean).join('\n'))}`,
        'BEGIN:VALARM', 'TRIGGER:-P7D', 'ACTION:DISPLAY', 'DESCRIPTION:Promemoria scadenza', 'END:VALARM', 'END:VEVENT');
    }
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }

  return { genera, rigenera, list, filtra, setCompletata, salvaManuale, elimina, toICS, inizioPeriodo };
});

/* ---------------------------------------------------------------------
   Repo — accesso ai dati di contratti, parti, immobili e documenti.
   Le funzioni *Tx sono sincrone e vanno chiamate dentro Db.write: così
   l'import massivo usa un'unica transazione.
   --------------------------------------------------------------------- */
Modules.define('Repo', ['Db', 'Util', 'Dominio', 'Scadenzario', 'Prefs'], (Db, Util, Dominio, Scadenzario, Prefs) => {
  class ConflictError extends Error {
    constructor(by, at) { super(`Il contratto è stato modificato da ${by || 'un altro utente'} il ${at} mentre lo stavi modificando.`); this.name = 'ConflictError'; }
  }
  const PARTI_SQL = (ruolo) => `(SELECT group_concat(s.denominazione, ' | ') FROM contratto_parti p JOIN soggetti s ON s.id = p.soggetto_id WHERE p.contratto_id = c.id AND p.ruolo = '${ruolo}')`;

  function listContratti() {
    return Db.all(`
      SELECT c.*, i.indirizzo, i.comune, i.provincia, i.categoria_fiscale, i.categoria_catastale,
        ${PARTI_SQL('locatore')} AS locatori, ${PARTI_SQL('conduttore')} AS conduttori,
        (SELECT MIN(data) FROM scadenze s WHERE s.contratto_id = c.id AND s.completata = 0) AS prossima_scadenza
      FROM contratti c LEFT JOIN immobili i ON i.id = c.immobile_id
      ORDER BY c.data_scadenza`);
  }
  function getContratto(id) {
    const c = Db.one('SELECT * FROM contratti WHERE id = ?', [id]);
    if (!c) return null;
    return {
      contratto: c,
      immobile: c.immobile_id ? Db.one('SELECT * FROM immobili WHERE id = ?', [c.immobile_id]) : {},
      parti: Db.all('SELECT p.ruolo, p.quota, s.* FROM contratto_parti p JOIN soggetti s ON s.id = p.soggetto_id WHERE p.contratto_id = ? ORDER BY p.ruolo DESC, s.denominazione', [id]),
      scadenze: Db.all('SELECT * FROM scadenze WHERE contratto_id = ? ORDER BY data', [id]),
      rinnovi: Db.all('SELECT * FROM rinnovi WHERE contratto_id = ? ORDER BY data_evento, id', [id]),
      documenti: Db.all('SELECT id, nome_file, percorso, stato, metodo_estrazione FROM documenti WHERE contratto_id = ?', [id])
    };
  }
  /** Trova un soggetto per CF, poi P.IVA, poi nome esatto (solo se senza codici); altrimenti lo crea. */
  function upsertSoggettoTx(p) {
    const cf = (p.codice_fiscale || '').toUpperCase().replace(/\s/g, '') || null;
    const piva = (p.partita_iva || '').replace(/\D/g, '') || null;
    let row = null;
    if (cf) row = Db.one('SELECT id FROM soggetti WHERE upper(codice_fiscale) = ?', [cf]);
    if (!row && piva) row = Db.one('SELECT id FROM soggetti WHERE partita_iva = ?', [piva]);
    if (!row && !cf && !piva) row = Db.one('SELECT id FROM soggetti WHERE lower(denominazione) = lower(?) AND codice_fiscale IS NULL AND partita_iva IS NULL', [p.denominazione]);
    const tipo = p.tipo === 'PG' || (!cf && piva) || (cf && /^\d{11}$/.test(cf)) ? 'PG' : 'PF';
    const vals = [tipo, p.denominazione.trim(), cf, piva, p.indirizzo || null, p.email || null, p.telefono || null];
    if (row) {
      Db.run("UPDATE soggetti SET tipo = ?, denominazione = ?, codice_fiscale = ?, partita_iva = ?, indirizzo = ?, email = ?, telefono = ?, updated_at = datetime('now','localtime') WHERE id = ?", [...vals, row.id]);
      return row.id;
    }
    return Db.run('INSERT INTO soggetti (tipo, denominazione, codice_fiscale, partita_iva, indirizzo, email, telefono) VALUES (?,?,?,?,?,?,?)', vals).lastId;
  }

  const CAMPI_CONTRATTO = ['codice', 'tipologia', 'regime_fiscale', 'soggetto_iva', 'data_stipula', 'data_inizio', 'data_scadenza', 'durata_mesi', 'durata_rinnovo_mesi', 'preavviso_mesi', 'canone_annuo', 'deposito_cauzionale', 'aggiornamento_istat', 'data_registrazione', 'estremi_registrazione', 'stato', 'data_cessazione', 'note'];
  const CAMPI_IMMOBILE = ['indirizzo', 'comune', 'provincia', 'categoria_fiscale', 'categoria_catastale', 'foglio', 'particella', 'subalterno', 'rendita', 'note'];

  function validaContratto(data) {
    const c = data.contratto, errori = [];
    if (!Util.isISODate(c.data_inizio)) errori.push('Data di inizio mancante o non valida');
    if (!Util.isISODate(c.data_scadenza)) errori.push('Data di scadenza mancante o non valida');
    if (!c.tipologia) errori.push('Tipologia contratto mancante');
    if (!c.regime_fiscale) errori.push('Regime fiscale mancante');
    const parti = (data.parti || []).filter(p => p.denominazione && p.denominazione.trim());
    if (!parti.some(p => p.ruolo === 'locatore')) errori.push('Indicare almeno un locatore');
    if (!parti.some(p => p.ruolo === 'conduttore')) errori.push('Indicare almeno un conduttore');
    return errori;
  }

  /**
   * Salva contratto + immobile + parti e rigenera le scadenze.
   * data = { contratto:{id?,...}, immobile:{...}, parti:[{ruolo,denominazione,...}], expectedUpdatedAt?, force? }
   */
  function saveContrattoTx(data) {
    const errori = validaContratto(data);
    if (errori.length) throw new Error(errori.join('; '));
    const c = { ...data.contratto };
    const isNew = !c.id;
    if (!isNew) {
      const cur = Db.one('SELECT updated_at, modificato_da FROM contratti WHERE id = ?', [c.id]);
      if (!cur) throw new Error('Contratto non trovato (eliminato da un altro utente?)');
      if (data.expectedUpdatedAt && cur.updated_at !== data.expectedUpdatedAt && !data.force) throw new ConflictError(cur.modificato_da, cur.updated_at);
    }
    // Immobile
    const imm = { ...(data.immobile || {}) };
    imm.categoria_fiscale = imm.categoria_fiscale || 'abitativo';
    let immobileId = isNew ? null : (Db.one('SELECT immobile_id FROM contratti WHERE id = ?', [c.id]) || {}).immobile_id;
    const immVals = CAMPI_IMMOBILE.map(k => imm[k] === '' ? null : imm[k]);
    if (immobileId) Db.run(`UPDATE immobili SET ${CAMPI_IMMOBILE.map(k => k + ' = ?').join(', ')}, updated_at = datetime('now','localtime') WHERE id = ?`, [...immVals, immobileId]);
    else immobileId = Db.run(`INSERT INTO immobili (${CAMPI_IMMOBILE.join(', ')}) VALUES (${CAMPI_IMMOBILE.map(() => '?').join(', ')})`, immVals).lastId;
    // Contratto
    c.stato = c.stato || 'attivo';
    c.soggetto_iva = Number(c.soggetto_iva) ? 1 : 0;
    c.aggiornamento_istat = Number(c.aggiornamento_istat) ? 1 : 0;
    const vals = CAMPI_CONTRATTO.map(k => c[k] === '' ? null : c[k]);
    const stamp = Util.nowStamp();
    let id = c.id;
    if (isNew) id = Db.run(`INSERT INTO contratti (${CAMPI_CONTRATTO.join(', ')}, immobile_id, modificato_da, created_at, updated_at) VALUES (${CAMPI_CONTRATTO.map(() => '?').join(', ')}, ?, ?, ?, ?)`, [...vals, immobileId, Prefs.get('utente'), stamp, stamp]).lastId;
    else Db.run(`UPDATE contratti SET ${CAMPI_CONTRATTO.map(k => k + ' = ?').join(', ')}, immobile_id = ?, modificato_da = ?, updated_at = ? WHERE id = ?`, [...vals, immobileId, Prefs.get('utente'), stamp, id]);
    if (!c.codice) Db.run("UPDATE contratti SET codice = printf('LOC-%04d', id) WHERE id = ?", [id]);
    // Parti
    Db.run('DELETE FROM contratto_parti WHERE contratto_id = ?', [id]);
    for (const p of data.parti.filter(p => p.denominazione && p.denominazione.trim())) {
      const sid = upsertSoggettoTx(p);
      Db.run('INSERT OR IGNORE INTO contratto_parti (contratto_id, soggetto_id, ruolo, quota) VALUES (?,?,?,?)', [id, sid, p.ruolo, p.quota === '' || p.quota == null ? null : Number(p.quota)]);
    }
    Scadenzario.rigenera(id, { presumiPassate: isNew && !data.nonPresumere });
    return id;
  }
  const saveContratto = (data) => Db.write(() => saveContrattoTx(data));
  function deleteContratto(id) {
    return Db.write(() => {
      const c = Db.one('SELECT immobile_id FROM contratti WHERE id = ?', [id]);
      Db.run("UPDATE documenti SET contratto_id = NULL, stato = 'da_verificare' WHERE contratto_id = ?", [id]);
      Db.run('DELETE FROM contratti WHERE id = ?', [id]);
      if (c && c.immobile_id) Db.run('DELETE FROM immobili WHERE id = ? AND NOT EXISTS (SELECT 1 FROM contratti WHERE immobile_id = ?)', [c.immobile_id, c.immobile_id]);
      Db.run('DELETE FROM soggetti WHERE id NOT IN (SELECT soggetto_id FROM contratto_parti)');
    });
  }
  function listSoggetti() { return Db.all('SELECT * FROM soggetti ORDER BY denominazione'); }

  /* --- documenti --- */
  function documentoByImpronta(impronta) { return Db.one('SELECT id, nome_file, stato, contratto_id FROM documenti WHERE impronta = ?', [impronta]); }
  function getDocumento(id) { return Db.one('SELECT * FROM documenti WHERE id = ?', [id]); }
  function listDocumenti() { return Db.all('SELECT d.id, d.nome_file, d.percorso, d.dimensione, d.metodo_estrazione, d.stato, d.messaggio, d.contratto_id, d.updated_at, c.codice FROM documenti d LEFT JOIN contratti c ON c.id = d.contratto_id ORDER BY d.stato, d.percorso, d.nome_file'); }
  function salvaDocumento(d) {
    return Db.write(() => {
      const cols = ['nome_file', 'percorso', 'dimensione', 'ultima_modifica', 'impronta', 'testo_estratto', 'metodo_estrazione', 'dati_estratti', 'stato', 'messaggio'];
      const existing = d.impronta ? Db.one('SELECT id FROM documenti WHERE impronta = ?', [d.impronta]) : null;
      if (existing) { Db.run(`UPDATE documenti SET ${cols.map(k => k + ' = ?').join(', ')}, updated_at = datetime('now','localtime') WHERE id = ?`, [...cols.map(k => d[k]), existing.id]); return existing.id; }
      return Db.run(`INSERT INTO documenti (${cols.join(', ')}) VALUES (${cols.map(() => '?').join(', ')})`, cols.map(k => d[k])).lastId;
    });
  }
  function setStatoDocumento(id, stato, contrattoId) {
    return Db.write(() => Db.run("UPDATE documenti SET stato = ?, contratto_id = COALESCE(?, contratto_id), updated_at = datetime('now','localtime') WHERE id = ?", [stato, contrattoId || null, id]));
  }
  /** Salva il contratto e collega il documento sorgente nella stessa transazione. */
  function saveContrattoDaDocumento(data, documentoId) {
    return Db.write(() => {
      const id = saveContrattoTx(data);
      Db.run("UPDATE documenti SET stato = 'importato', contratto_id = ?, updated_at = datetime('now','localtime') WHERE id = ?", [id, documentoId]);
      return id;
    });
  }
  function eliminaDocumento(id) { return Db.write(() => Db.run('DELETE FROM documenti WHERE id = ?', [id])); }

  function statistiche() {
    const oggi = Util.todayISO();
    const entro = Util.addDays(oggi, Number(Prefs.get('giorniAvviso')) || 60);
    const v = (sql, p) => (Db.one(sql, p) || { n: 0 }).n;
    return {
      attivi: v("SELECT COUNT(*) AS n FROM contratti WHERE stato <> 'cessato'"),
      inScadenza: v("SELECT COUNT(*) AS n FROM contratti WHERE stato <> 'cessato' AND data_scadenza BETWEEN ? AND ?", [oggi, entro]),
      scaduteAperte: v('SELECT COUNT(*) AS n FROM scadenze WHERE completata = 0 AND data < ?', [oggi]),
      prossime: v('SELECT COUNT(*) AS n FROM scadenze WHERE completata = 0 AND data BETWEEN ? AND ?', [oggi, entro]),
      daVerificare: v("SELECT COUNT(*) AS n FROM documenti WHERE stato IN ('da_verificare','errore')"),
      canoneTotale: (Db.one("SELECT COALESCE(SUM(canone_annuo),0) AS n FROM contratti WHERE stato <> 'cessato'") || { n: 0 }).n,
      entro
    };
  }

  return { ConflictError, listContratti, getContratto, saveContratto, saveContrattoTx, deleteContratto, validaContratto, listSoggetti, upsertSoggettoTx,
    documentoByImpronta, getDocumento, listDocumenti, salvaDocumento, setStatoDocumento, saveContrattoDaDocumento, eliminaDocumento, statistiche, CAMPI_CONTRATTO, CAMPI_IMMOBILE };
});

/* ---------------------------------------------------------------------
   Rinnovi — rinnovi, proroghe, disdette e risoluzioni con storico.
   Ogni evento aggiorna il contratto, chiude le scadenze del periodo
   superato e crea l'adempimento di comunicazione all'Agenzia (RLI).
   --------------------------------------------------------------------- */
Modules.define('Rinnovi', ['Db', 'Util', 'Dominio', 'Scadenzario', 'Prefs'], (Db, Util, Dominio, Scadenzario, Prefs) => {
  /** Nota apposta alle scadenze chiuse da un rinnovo/disdetta: permette di riaprirle se l'evento viene annullato. */
  const MARCA_EVENTO = 'Chiusa da evento contrattuale.';
  /** Proposta di default per il dialogo di rinnovo. */
  function proponi(c, tipo) {
    const t = Dominio.tipologia(c.tipologia);
    const mesi = Number(c.durata_rinnovo_mesi) || t.rinnovo || Number(c.durata_mesi) || 12;
    const prolunga = (Dominio.TIPI_RINNOVO.find(x => x.v === tipo) || {}).prolunga;
    return {
      tipo,
      data_evento: tipo === 'risoluzione' ? Util.todayISO() : (prolunga ? Util.addDays(c.data_scadenza, 1) : c.data_scadenza),
      nuova_scadenza: prolunga ? Dominio.scadenzaDopoRinnovo(c.data_scadenza, mesi) : null,
      nuovo_canone: c.canone_annuo,
      mesi,
      avviso: c.tipologia === 'transitorio' && prolunga ? 'I contratti transitori non sono rinnovabili: alla scadenza vanno sostituiti da un nuovo contratto (salvo proroga per esigenze documentate).' : ''
    };
  }

  function registra(contrattoId, ev) {
    return Db.write(() => {
      const c = Db.one('SELECT * FROM contratti WHERE id = ?', [contrattoId]);
      if (!c) throw new Error('Contratto non trovato');
      const tipo = Dominio.TIPI_RINNOVO.find(x => x.v === ev.tipo);
      if (!tipo) throw new Error('Tipo di evento non valido');
      if (!Util.isISODate(ev.data_evento)) throw new Error('Data evento non valida');
      const utente = Prefs.get('utente');
      const oggi = Util.todayISO();
      const nuovoCanone = ev.nuovo_canone === '' || ev.nuovo_canone == null ? null : Number(ev.nuovo_canone);
      const ced = Dominio.isCedolare(c.regime_fiscale);

      if (tipo.prolunga) {
        if (!Util.isISODate(ev.nuova_scadenza) || ev.nuova_scadenza <= c.data_scadenza) throw new Error('La nuova scadenza deve essere successiva a quella attuale (' + Util.fmtDate(c.data_scadenza) + ')');
        Db.run('INSERT INTO rinnovi (contratto_id, tipo, data_evento, scadenza_precedente, nuova_scadenza, canone_precedente, nuovo_canone, note, registrato_da) VALUES (?,?,?,?,?,?,?,?,?)',
          [contrattoId, ev.tipo, ev.data_evento, c.data_scadenza, ev.nuova_scadenza, c.canone_annuo, nuovoCanone, ev.note || null, utente]);
        // Le scadenze di fine periodo superate dal rinnovo si considerano evase.
        Db.run(`UPDATE scadenze SET completata = 1, data_completamento = ?, completata_da = ?, note = COALESCE(note || ' ', '') || '${MARCA_EVENTO}' WHERE contratto_id = ? AND completata = 0 AND tipo IN ('scadenza','disdetta') AND data <= ?`, [oggi, utente, contrattoId, c.data_scadenza]);
        Db.run("UPDATE contratti SET data_scadenza = ?, canone_annuo = COALESCE(?, canone_annuo), periodo = periodo + 1, stato = 'attivo', data_cessazione = NULL, modificato_da = ?, updated_at = ? WHERE id = ?",
          [ev.nuova_scadenza, nuovoCanone, utente, Util.nowStamp(), contrattoId]);
        Db.run('INSERT INTO scadenze (contratto_id, tipo, data, descrizione, automatica) VALUES (?,?,?,?,0)',
          [contrattoId, 'comunicazione_rli', Util.addDays(c.data_scadenza, 30), ced ? 'Comunicazione proroga (RLI) con conferma opzione cedolare secca' : 'Comunicazione proroga (RLI) e versamento imposta di registro']);
        if (ev.tipo === 'rinnovo_nuove_condizioni') {
          Db.run('INSERT INTO scadenze (contratto_id, tipo, data, descrizione, automatica) VALUES (?,?,?,?,0)', [contrattoId, 'registrazione', Util.addDays(ev.data_evento, 30), 'Registrazione nuovo accordo / nuove condizioni (verificare se costituisce nuovo contratto)']);
        }
      } else if (ev.tipo === 'disdetta') {
        Db.run('INSERT INTO rinnovi (contratto_id, tipo, data_evento, scadenza_precedente, nuova_scadenza, canone_precedente, note, registrato_da) VALUES (?,?,?,?,?,?,?,?)',
          [contrattoId, ev.tipo, ev.data_evento, c.data_scadenza, c.data_scadenza, c.canone_annuo, ev.note || null, utente]);
        Db.run(`UPDATE scadenze SET completata = 1, data_completamento = ?, completata_da = ?, note = COALESCE(note || ' ', '') || '${MARCA_EVENTO}' WHERE contratto_id = ? AND completata = 0 AND tipo = 'disdetta'`, [oggi, utente, contrattoId]);
        Db.run("UPDATE contratti SET stato = 'disdettato', data_cessazione = data_scadenza, modificato_da = ?, updated_at = ? WHERE id = ?", [utente, Util.nowStamp(), contrattoId]);
        Db.run('INSERT INTO scadenze (contratto_id, tipo, data, descrizione, automatica) VALUES (?,?,?,?,0)',
          [contrattoId, 'comunicazione_rli', Util.addDays(c.data_scadenza, 30), 'Comunicazione cessazione (RLI)' + (ced ? '' : ' e versamento imposta di 67 € se dovuta')]);
      } else {
        const fine = ev.data_evento;
        Db.run('INSERT INTO rinnovi (contratto_id, tipo, data_evento, scadenza_precedente, nuova_scadenza, canone_precedente, note, registrato_da) VALUES (?,?,?,?,?,?,?,?)',
          [contrattoId, ev.tipo, fine, c.data_scadenza, fine, c.canone_annuo, ev.note || null, utente]);
        Db.run('DELETE FROM scadenze WHERE contratto_id = ? AND automatica = 1 AND completata = 0 AND data > ?', [contrattoId, fine]);
        Db.run("UPDATE contratti SET stato = 'cessato', data_cessazione = ?, modificato_da = ?, updated_at = ? WHERE id = ?", [fine, utente, Util.nowStamp(), contrattoId]);
        Db.run('INSERT INTO scadenze (contratto_id, tipo, data, descrizione, automatica) VALUES (?,?,?,?,0)',
          [contrattoId, 'comunicazione_rli', Util.addDays(fine, 30), 'Comunicazione risoluzione anticipata (RLI)' + (ced ? '' : ' e versamento imposta di 67 €')]);
      }
      Scadenzario.rigenera(contrattoId);
    });
  }
  /** Annulla l'ultimo evento solo se è l'ultimo registrato: ripristina scadenza, canone e stato precedenti. */
  function annullaUltimo(contrattoId) {
    return Db.write(() => {
      const r = Db.one('SELECT * FROM rinnovi WHERE contratto_id = ? ORDER BY id DESC LIMIT 1', [contrattoId]);
      if (!r) throw new Error('Nessun evento da annullare');
      const prolunga = (Dominio.TIPI_RINNOVO.find(x => x.v === r.tipo) || {}).prolunga;
      Db.run("UPDATE contratti SET data_scadenza = ?, canone_annuo = COALESCE(?, canone_annuo), periodo = MAX(1, periodo - ?), stato = 'attivo', data_cessazione = NULL, updated_at = ? WHERE id = ?",
        [r.scadenza_precedente, r.canone_precedente, prolunga ? 1 : 0, Util.nowStamp(), contrattoId]);
      Db.run("DELETE FROM scadenze WHERE contratto_id = ? AND automatica = 0 AND tipo IN ('comunicazione_rli','registrazione') AND created_at >= ? AND completata = 0", [contrattoId, r.created_at]);
      Db.run('DELETE FROM rinnovi WHERE id = ?', [r.id]);
      // Riapre solo le scadenze chiuse da questo evento: quelle marcate e appartenenti al periodo ripristinato.
      const ps = Scadenzario.inizioPeriodo(contrattoId, Db.one('SELECT data_inizio FROM contratti WHERE id = ?', [contrattoId]).data_inizio);
      Db.run(`UPDATE scadenze SET completata = 0, data_completamento = NULL, completata_da = NULL, note = NULLIF(TRIM(REPLACE(note, '${MARCA_EVENTO}', '')), '') WHERE contratto_id = ? AND tipo IN ('scadenza','disdetta') AND note LIKE '%${MARCA_EVENTO}%' AND data >= ? AND data <= ?`,
        [contrattoId, ps, r.scadenza_precedente]);
      Scadenzario.rigenera(contrattoId);
    });
  }
  return { proponi, registra, annullaUltimo };
});

/* ---------------------------------------------------------------------
   Seed — dati di esempio caricati al primo avvio (eliminabili).
   Date relative a oggi per avere scadenze visibili subito.

Modules.define('Seed', ['Db', 'Repo', 'Util'], (Db, Repo, Util) => {
  function esempi() {

      },
