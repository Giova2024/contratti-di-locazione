    const expectedUpdatedAt = c.updated_at || null;
    const formHtml = html`
      <form id="contratto-form" autocomplete="off">
        ${avvisi.length ? html`<div class="alert warn"><strong>Da verificare:</strong><ul style="margin:4px 0 0 18px;padding:0">${avvisi.map(a => html`<li>${a}</li>`)}</ul></div>` : ''}
        <div id="coerenza"></div>
        <h3>Parti</h3>
        <div id="parti"></div>
        <button type="button" class="btn small" id="add-party">+ Aggiungi parte</button>
        <datalist id="dl-soggetti">${Repo.listSoggetti().map(s => html`<option value="${s.denominazione}">${s.codice_fiscale || s.partita_iva || ''}</option>`)}</datalist>
        <h3>Immobile</h3>
        <div class="form-grid" data-section="immobile">
          ${field('indirizzo', 'Indirizzo', imm.indirizzo, { trovati, wide: true })}
          ${field('comune', 'Comune', imm.comune, { trovati })}
          ${field('provincia', 'Provincia', imm.provincia, { attrs: 'maxlength="2" style="text-transform:uppercase"' })}
          ${select('categoria_fiscale', 'Categoria fiscale', Dominio.CATEGORIE_FISCALI, imm.categoria_fiscale, { trovati, required: true })}
          ${field('categoria_catastale', 'Categoria catastale (es. A/2)', imm.categoria_catastale, { trovati })}
          ${field('foglio', 'Foglio', imm.foglio)}
          ${field('particella', 'Particella', imm.particella)}
          ${field('subalterno', 'Subalterno', imm.subalterno)}
          ${field('rendita', 'Rendita catastale €', imm.rendita, { type: 'number' })}
        </div>
        <h3>Contratto</h3>
        <div class="form-grid" data-section="contratto">
          ${field('codice', 'Codice interno', c.codice)}
          ${select('tipologia', 'Tipologia contratto', Dominio.TIPOLOGIE, c.tipologia, { trovati, required: true })}
          ${select('regime_fiscale', 'Regime fiscale', Dominio.REGIMI, c.regime_fiscale, { trovati, required: true })}
          <label class="field ${trovati.soggetto_iva ? 'auto' : ''}"><span>Soggetto IVA</span><select name="soggetto_iva">${options([{ v: 0, l: 'No' }, { v: 1, l: 'Sì' }], c.soggetto_iva ? 1 : 0)}</select></label>
          ${field('data_stipula', 'Data stipula', c.data_stipula, { type: 'date', trovati })}
          ${field('data_inizio', 'Data inizio (decorrenza)', c.data_inizio, { type: 'date', trovati, required: true })}
          ${field('durata_mesi', 'Durata primo periodo (mesi)', c.durata_mesi, { type: 'int', trovati })}
          <label class="field ${trovati.data_scadenza ? 'auto' : ''} ${c.data_scadenza ? '' : 'missing'}" title="${trovati.data_scadenza ? 'Dal testo: ' + trovati.data_scadenza : ''}"><span>Data scadenza attuale</span><div style="display:flex;gap:6px"><input name="data_scadenza" type="date" value="${c.data_scadenza || ''}"><button type="button" class="btn small" id="calc-scad" title="Calcola da inizio + durata">Calcola</button></div></label>
          ${field('durata_rinnovo_mesi', 'Durata rinnovo (mesi)', c.durata_rinnovo_mesi, { type: 'int' })}
          ${field('preavviso_mesi', 'Preavviso disdetta (mesi)', c.preavviso_mesi, { type: 'int' })}
          ${field('canone_annuo', 'Canone annuo €', c.canone_annuo, { type: 'number', trovati })}
          ${field('deposito_cauzionale', 'Deposito cauzionale €', c.deposito_cauzionale, { type: 'number', trovati })}
          <label class="field ${trovati.aggiornamento_istat ? 'auto' : ''}"><span>Aggiornamento ISTAT</span><select name="aggiornamento_istat">${options([{ v: 0, l: 'No' }, { v: 1, l: 'Sì' }], c.aggiornamento_istat ? 1 : 0)}</select></label>
          ${field('data_registrazione', 'Data registrazione', c.data_registrazione, { type: 'date', trovati })}
          ${field('estremi_registrazione', 'Estremi registrazione (serie, numero)', c.estremi_registrazione, { trovati })}
          ${select('stato', 'Stato', Dominio.STATI, c.stato || 'attivo')}
          ${field('data_cessazione', 'Data cessazione', c.data_cessazione, { type: 'date' })}
          <label class="field wide"><span>Note</span><textarea name="note">${c.note || ''}</textarea></label>
        </div>
      </form>`;
    const body = documento
      ? html`<div class="split"><div>${formHtml}</div><div><h3>Testo estratto – ${documento.nome_file}</h3>
          <div class="toolbar"><input type="search" id="txt-search" class="grow" placeholder="Cerca nel testo…"><button type="button" class="btn small" id="open-orig">Apri originale</button></div>
          <div class="textpanel" id="txt-panel"></div></div></div>`
      : formHtml;
    UI.openModal({
      title: c.id ? 'Contratto ' + (c.codice || '#' + c.id) : (documento ? 'Verifica documento importato' : 'Nuovo contratto'),
      body,
      footer: html`<span class="muted" style="margin-right:auto">${c.modificato_da ? 'Ultima modifica: ' + c.modificato_da + ' – ' + c.updated_at : ''}</span><button class="btn" data-close>Annulla</button><button class="btn primary" id="save-contratto">${documento ? 'Conferma e crea contratto' : 'Salva'}</button>`,
      onMount: (m) => {
        const form = m.querySelector('#contratto-form');
        const partiBox = m.querySelector('#parti');
        const syncParti = () => {
          parti = [...partiBox.querySelectorAll('[data-party]')].map(div => Object.fromEntries([...div.querySelectorAll('[data-p]')].map(el => [el.dataset.p, el.value.trim()])));
        };
        const renderParti = () => {
          partiBox.innerHTML = UI.str(parti.map(partyRow));
          partiBox.querySelectorAll('[data-party]').forEach(div => {
            const cfInput = div.querySelector('[data-p="codice_fiscale"]');
            const ivaInput = div.querySelector('[data-p="partita_iva"]');
            const check = () => {
              const cf = cfInput.value.trim().toUpperCase(); const iva = ivaInput.value.replace(/\D/g, '');
              const msgs = [];
              if (cf && cf.length === 16 && !Parser.cfValido(cf)) msgs.push('⚠ codice fiscale non valido');
              if (cf && cf.length !== 16 && !/^\d{11}$/.test(cf)) msgs.push('⚠ CF di lunghezza anomala');
              if (iva && !Parser.pivaValida(iva)) msgs.push('⚠ partita IVA non valida');
              div.querySelector('.cf-check').textContent = msgs.join(' · ');
            };
            cfInput.addEventListener('input', check); ivaInput.addEventListener('input', check); check();
            div.querySelector('[data-p="denominazione"]').addEventListener('change', (e) => {
              const s = Repo.listSoggetti().find(x => x.denominazione === e.target.value);
              if (s && !cfInput.value) {
                cfInput.value = s.codice_fiscale || ''; ivaInput.value = s.partita_iva || '';
                div.querySelector('[data-p="indirizzo"]').value = s.indirizzo || '';
                div.querySelector('[data-p="tipo"]').value = s.tipo; check();
              }
            });
            div.querySelector('[data-remove-party]').addEventListener('click', () => { syncParti(); parti.splice(Number(div.dataset.party), 1); renderParti(); });
          });
        };
        renderParti();
        m.querySelector('#add-party').addEventListener('click', () => { syncParti(); parti.push({ ruolo: 'conduttore' }); renderParti(); });

        const get = (n) => form.querySelector(`[name="${n}"]`);
        // Cambio tipologia: propone durata, rinnovo e preavviso standard.
        get('tipologia').addEventListener('change', () => {
          const t = Dominio.tipologia(get('tipologia').value);
          get('durata_mesi').value = t.durata; get('durata_rinnovo_mesi').value = t.rinnovo; get('preavviso_mesi').value = t.preavviso;
          if (get('data_inizio').value && !get('data_scadenza').value) get('data_scadenza').value = Dominio.calcolaScadenza(get('data_inizio').value, t.durata);
          coerenza();
        });
        get('categoria_catastale').addEventListener('change', () => { const cf = Dominio.categoriaDaCatastale(get('categoria_catastale').value); if (cf) get('categoria_fiscale').value = cf; coerenza(); });
        m.querySelector('#calc-scad').addEventListener('click', () => {
          const s = Dominio.calcolaScadenza(get('data_inizio').value, Util.parseNumber(get('durata_mesi').value));
          if (s) get('data_scadenza').value = s; else UI.toast('Indicare data di inizio e durata', 'warn');
        });
        get('regime_fiscale').addEventListener('change', () => {
          const r = get('regime_fiscale').value;
          if (r === 'iva_imponibile' || r === 'iva_esente') get('soggetto_iva').value = '1';
          if (Dominio.isCedolare(r)) { get('soggetto_iva').value = '0'; get('aggiornamento_istat').value = '0'; }
          coerenza();
        });
        const coerenza = () => {
          const cc = UI.readForm(form.querySelector('[data-section="contratto"]'));
          const avv = Dominio.verificaCoerenza(cc, get('categoria_fiscale').value);
          m.querySelector('#coerenza').innerHTML = avv.length ? UI.str(html`<div class="alert info"><strong>Controlli di coerenza:</strong><ul style="margin:4px 0 0 18px;padding:0">${avv.map(a => html`<li>${a}</li>`)}</ul></div>`) : '';
        };
        form.addEventListener('change', coerenza);
        coerenza();

        if (documento) {
          const panel = m.querySelector('#txt-panel');
          const testo = documento.testo_estratto || '(nessun testo estratto)';
          const show = (q) => {
            if (!q) { panel.textContent = testo; return; }
            panel.innerHTML = Util.esc(testo).replace(new RegExp(Util.esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), (x) => `<mark>${x}</mark>`);
            const first = panel.querySelector('mark'); if (first) first.scrollIntoView({ block: 'center' });
          };
          show('');
          m.querySelector('#txt-search').addEventListener('input', Util.debounce((e) => show(e.target.value.trim()), 200));
          // Clic su un campo rilevato: evidenzia nel testo il frammento da cui proviene.
          form.addEventListener('focusin', (e) => {
            const name = e.target.name; const snip = name && trovati[name];
            if (snip && typeof snip === 'string' && snip.length > 3) { const words = snip.split(/\s+/).slice(0, 4).join(' '); const s = m.querySelector('#txt-search'); s.value = words; show(words); }
          });
          m.querySelector('#open-orig').addEventListener('click', () => UI.guard('ContrattoForm', 'Apertura documento', async () => {
            const f = await FolderImport.getFile(documento.percorso);
            if (!f) throw new Error('File originale non disponibile: riselezionare la cartella in "Importa da cartella"');
            window.open(URL.createObjectURL(f), '_blank');
          }));
        }

        m.querySelector('#save-contratto').addEventListener('click', () => UI.guard('ContrattoForm', 'Salvataggio contratto', async () => {
          syncParti();
          const contratto = { ...UI.readForm(form.querySelector('[data-section="contratto"]')), id: c.id };
          contratto.soggetto_iva = Number(contratto.soggetto_iva); contratto.aggiornamento_istat = Number(contratto.aggiornamento_istat);
          const immobile = UI.readForm(form.querySelector('[data-section="immobile"]'));
          if (immobile.provincia) immobile.provincia = immobile.provincia.toUpperCase();
          const payload = { contratto, immobile, parti: parti.map(p => ({ ...p, codice_fiscale: (p.codice_fiscale || '').toUpperCase() || null })), expectedUpdatedAt };
          const errori = Repo.validaContratto(payload);
          if (errori.length) { UI.toast(errori.join(' · '), 'warn', 7000); return; }
          let id;
          try {
            id = documento ? await Repo.saveContrattoDaDocumento(payload, documento.id) : await Repo.saveContratto(payload);
          } catch (e) {
            if (e.name !== 'ConflictError') throw e;
            if (!window.confirm(e.message + '\n\nSovrascrivere comunque con i tuoi dati?')) return;
            payload.force = true;
            id = await Repo.saveContratto(payload);
          }
          Log.info('ContrattoForm', `Contratto ${contratto.codice || id} salvato`);
          UI.closeModal();
          UI.toast('Contratto salvato');
          onSaved && onSaved(id);
        }));
      }
    });
  }
  return { open };
});
</script>
<script>
'use strict';
/* ---------------------------------------------------------------------
   ScadenzeTable — tabella scadenze riusata da riepilogo, scadenzario e
   dettaglio contratto. bind() collega le azioni ai pulsanti.
   --------------------------------------------------------------------- */
Modules.define('ScadenzeTable', ['UI', 'Util', 'Dominio', 'Scadenzario'], (UI, Util, Dominio, Scadenzario) => {
  const { html } = UI;
  function render(rows, { showContratto = true, groupByMonth = false, emptyText = 'Nessuna scadenza' } = {}) {
    if (!rows.length) return html`<div class="empty">${emptyText}</div>`;
    const oggi = Util.todayISO();
    let lastMonth = '';
    const cols = showContratto ? 7 : 5;
    const body = rows.map(s => {
      const month = s.data.slice(0, 7);
      const header = groupByMonth && month !== lastMonth
        ? html`<tr><th colspan="${cols}" style="background:var(--bg)">${new Date(month + '-15').toLocaleDateString('it-IT', { month: 'long', year: 'numeric' })}</th></tr>` : '';
      lastMonth = month;
      const overdue = !s.completata && s.data < oggi;
      const giorni = Util.diffDays(oggi, s.data);
      return html`${header}<tr class="${s.completata ? 'done' : overdue ? 'overdue' : ''}">
        <td><input type="checkbox" data-complete="${s.id}" ${s.completata ? UI.raw('checked') : ''} title="Segna come completata" aria-label="Completata"></td>
        <td style="white-space:nowrap">${Util.fmtDate(s.data)}<div class="muted" style="font-size:11px">${s.completata ? 'fatto ' + Util.fmtDate(s.data_completamento) + (s.completata_da ? ' – ' + s.completata_da : '') : giorni === 0 ? 'oggi' : giorni > 0 ? 'tra ' + giorni + ' gg' : Math.abs(giorni) + ' gg fa'}</div></td>
        <td><span class="tag ${overdue ? 'error' : s.tipo === 'scadenza' || s.tipo === 'disdetta' ? 'warn' : 'info'}">${Dominio.label(Dominio.TIPI_SCADENZA, s.tipo)}</span>${s.automatica ? '' : html` <span class="tag" title="Inserita manualmente o da un rinnovo">manuale</span>`}</td>
        ${showContratto ? html`<td>${s.contratto_id ? html`<a href="#" data-open-contratto="${s.contratto_id}">${s.codice || '#' + s.contratto_id}</a>` : html`<span class="muted">—</span>`}</td>
        <td>${s.locatori || ''}${s.conduttori ? html`<div class="muted">${s.conduttori}</div>` : ''}</td>` : ''}
        <td>${s.descrizione || ''}${s.note ? html`<div class="muted" style="font-size:12px">${s.note}</div>` : ''}</td>
        <td class="num">${s.importo != null ? Util.fmtEuro(s.importo) : ''}${s.automatica ? '' : html` <button class="btn small" data-edit-scadenza="${s.id}" title="Modifica">✎</button> <button class="btn small danger" data-del-scadenza="${s.id}" title="Elimina">✕</button>`}</td>
      </tr>`;
    });
    return html`<div class="table-wrap"><table><thead><tr><th></th><th>Data</th><th>Adempimento</th>${showContratto ? html`<th>Contratto</th><th>Locatore / conduttore</th>` : ''}<th>Descrizione</th><th class="num">Importo</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }
  /** ctx: { refresh(), openContratto(id), editScadenza(row) } */
  function bind(el, rows, ctx) {
    el.querySelectorAll('[data-complete]').forEach(cb => cb.addEventListener('change', () => UI.guard('Scadenzario', 'Aggiornamento scadenza', async () => {
      await Scadenzario.setCompletata(Number(cb.dataset.complete), cb.checked);
      ctx.refresh();
    })));
    el.querySelectorAll('[data-open-contratto]').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); ctx.openContratto(Number(a.dataset.openContratto)); }));
    el.querySelectorAll('[data-edit-scadenza]').forEach(b => b.addEventListener('click', () => ctx.editScadenza(rows.find(r => r.id === Number(b.dataset.editScadenza)))));
    el.querySelectorAll('[data-del-scadenza]').forEach(b => b.addEventListener('click', () => UI.guard('Scadenzario', 'Eliminazione scadenza', async () => {
      if (!(await UI.confirmDialog('Eliminare questa scadenza?', { ok: 'Elimina', danger: true }))) return;
      await Scadenzario.elimina(Number(b.dataset.delScadenza));
      ctx.refresh();
    })));
  }
  return { render, bind };
});

/* ---------------------------------------------------------------------
   ScadenzaForm — inserimento/modifica di una scadenza manuale.
   --------------------------------------------------------------------- */
Modules.define('ScadenzaForm', ['UI', 'Repo', 'Scadenzario', 'Dominio', 'Util'], (UI, Repo, Scadenzario, Dominio, Util) => {
  const { html, options } = UI;
  function open(s, onSaved) {
    s = s || { tipo: 'altro', data: Util.todayISO() };
    const contratti = Repo.listContratti().map(c => ({ v: c.id, l: `${c.codice} – ${c.locatori || ''} / ${c.conduttori || ''}` }));
    UI.openModal({
      title: s.id ? 'Modifica scadenza' : 'Nuova scadenza',
      body: html`<form id="sc-form" class="form-grid">
        <label class="field wide"><span>Contratto</span><select name="contratto_id">${options(contratti, s.contratto_id, { empty: '— nessuno (adempimento generico) —' })}</select></label>
        <label class="field"><span>Tipo</span><select name="tipo">${options(Dominio.TIPI_SCADENZA, s.tipo)}</select></label>
        <label class="field"><span>Data</span><input type="date" name="data" value="${s.data || ''}" required></label>
        <label class="field"><span>Importo €</span><input name="importo" data-type="number" inputmode="decimal" value="${s.importo != null ? Util.fmtNumberIT(s.importo) : ''}"></label>
        <label class="field wide"><span>Descrizione</span><input name="descrizione" value="${s.descrizione || ''}"></label>
        <label class="field wide"><span>Note</span><textarea name="note">${s.note || ''}</textarea></label>
      </form>`,
      footer: html`<button class="btn" data-close>Annulla</button><button class="btn primary" id="sc-save">Salva</button>`,
      onMount: (m) => m.querySelector('#sc-save').addEventListener('click', () => UI.guard('ScadenzaForm', 'Salvataggio scadenza', async () => {
        const d = UI.readForm(m.querySelector('#sc-form'));
        if (!Util.isISODate(d.data)) { UI.toast('Indicare la data', 'warn'); return; }
        await Scadenzario.salvaManuale({ ...d, id: s.id, contratto_id: d.contratto_id ? Number(d.contratto_id) : null });
        UI.closeModal(); UI.toast('Scadenza salvata'); onSaved && onSaved();
      }))
    });
  }
  return { open };
});

/* ---------------------------------------------------------------------
   ContrattoDettaglio — scheda contratto con storico rinnovi, scadenze e
   azioni (modifica, rinnovo/proroga/disdetta, eliminazione).
   --------------------------------------------------------------------- */
Modules.define('ContrattoDettaglio', ['UI', 'Repo', 'Rinnovi', 'Dominio', 'Util', 'ContrattoForm', 'ScadenzeTable', 'ScadenzaForm', 'Log'],
  (UI, Repo, Rinnovi, Dominio, Util, ContrattoForm, ScadenzeTable, ScadenzaForm, Log) => {
  const { html, options } = UI;
  const item = (l, v) => html`<div><div class="muted" style="font-size:12px">${l}</div><div>${v == null || v === '' ? '—' : v}</div></div>`;

  function open(id, ctx) {
    const d = Repo.getContratto(id);
    if (!d) { UI.toast('Contratto non trovato', 'warn'); return; }
    const c = d.contratto, i = d.immobile || {};
    const avvisi = Dominio.verificaCoerenza(c, i.categoria_fiscale);
    const scadOggi = c.stato !== 'cessato' && c.data_scadenza < Util.todayISO();
    const reopen = () => { ctx.refresh(); open(id, ctx); };
    UI.openModal({
      title: `Contratto ${c.codice || '#' + c.id}`,
      body: html`
        ${scadOggi ? html`<div class="alert danger">Il periodo contrattuale è scaduto il ${Util.fmtDate(c.data_scadenza)}: registrare rinnovo, proroga o cessazione.</div>` : ''}
        ${avvisi.length ? html`<div class="alert info"><ul style="margin:0 0 0 18px;padding:0">${avvisi.map(a => html`<li>${a}</li>`)}</ul></div>` : ''}
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
          ${item('Stato', Dominio.label(Dominio.STATI, c.stato) + (c.data_cessazione ? ' (' + Util.fmtDate(c.data_cessazione) + ')' : ''))}
          ${item('Tipologia', Dominio.label(Dominio.TIPOLOGIE, c.tipologia))}
          ${item('Regime fiscale', Dominio.label(Dominio.REGIMI, c.regime_fiscale))}
          ${item('Soggetto IVA', c.soggetto_iva ? 'Sì' : 'No')}
          ${item('Stipula', Util.fmtDate(c.data_stipula))}
          ${item('Inizio', Util.fmtDate(c.data_inizio))}
          ${item('Scadenza attuale', Util.fmtDate(c.data_scadenza) + ' (periodo ' + c.periodo + ')')}
          ${item('Durata / rinnovo / preavviso', `${c.durata_mesi || '—'} / ${c.durata_rinnovo_mesi ?? '—'} / ${c.preavviso_mesi ?? '—'} mesi`)}
          ${item('Canone annuo', Util.fmtEuro(c.canone_annuo))}
          ${item('Deposito cauzionale', Util.fmtEuro(c.deposito_cauzionale))}
          ${item('ISTAT', c.aggiornamento_istat ? 'Sì' : 'No')}
          ${item('Registrazione', [Util.fmtDate(c.data_registrazione), c.estremi_registrazione].filter(Boolean).join(' – '))}
        </div>
        <h3>Immobile</h3>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
          ${item('Indirizzo', [i.indirizzo, i.comune, i.provincia && '(' + i.provincia + ')'].filter(Boolean).join(' '))}
          ${item('Categoria fiscale', Dominio.label(Dominio.CATEGORIE_FISCALI, i.categoria_fiscale))}
          ${item('Catasto', [i.categoria_catastale, i.foglio && 'fg. ' + i.foglio, i.particella && 'part. ' + i.particella, i.subalterno && 'sub. ' + i.subalterno].filter(Boolean).join(', '))}
          ${item('Rendita', Util.fmtEuro(i.rendita))}
        </div>
        <h3>Parti</h3>
        <div class="table-wrap"><table><thead><tr><th>Ruolo</th><th>Nome</th><th>CF / P.IVA</th><th>Indirizzo</th><th>Quota</th></tr></thead><tbody>
          ${d.parti.map(p => html`<tr><td>${p.ruolo === 'locatore' ? 'Locatore' : 'Conduttore'}</td><td>${p.denominazione}</td><td>${[p.codice_fiscale, p.partita_iva && p.partita_iva !== p.codice_fiscale ? 'P.IVA ' + p.partita_iva : ''].filter(Boolean).join(' – ')}</td><td>${p.indirizzo || ''}</td><td>${p.quota != null ? p.quota + '%' : ''}</td></tr>`)}
        </tbody></table></div>
        <h3>Rinnovi, proroghe e cessazioni</h3>
        ${d.rinnovi.length ? html`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Evento</th><th>Scadenza prec.</th><th>Nuova scadenza</th><th class="num">Canone</th><th>Note</th></tr></thead><tbody>
          ${d.rinnovi.map(r => html`<tr><td>${Util.fmtDate(r.data_evento)}</td><td>${Dominio.label(Dominio.TIPI_RINNOVO, r.tipo)}<div class="muted" style="font-size:11px">${r.registrato_da || ''}</div></td><td>${Util.fmtDate(r.scadenza_precedente)}</td><td>${Util.fmtDate(r.nuova_scadenza)}</td><td class="num">${r.nuovo_canone != null && r.nuovo_canone !== r.canone_precedente ? Util.fmtEuro(r.canone_precedente) + ' → ' + Util.fmtEuro(r.nuovo_canone) : Util.fmtEuro(r.canone_precedente)}</td><td>${r.note || ''}</td></tr>`)}
        </tbody></table></div>` : html`<p class="muted">Nessun evento registrato.</p>`}
        <h3>Scadenze <button class="btn small" id="add-scad" style="margin-left:8px">+ Scadenza manuale</button></h3>
        <div id="det-scad">${ScadenzeTable.render(d.scadenze, { showContratto: false })}</div>
        ${d.documenti.length ? html`<h3>Documenti</h3><ul>${d.documenti.map(doc => html`<li>${doc.percorso || doc.nome_file} <span class="muted">(${doc.metodo_estrazione || ''})</span></li>`)}</ul>` : ''}
        ${c.note ? html`<h3>Note</h3><p style="white-space:pre-wrap">${c.note}</p>` : ''}`,
      footer: html`<button class="btn danger" id="det-del" style="margin-right:auto">Elimina</button>
        ${d.rinnovi.length ? html`<button class="btn" id="det-undo">Annulla ultimo evento</button>` : ''}
        <button class="btn" id="det-rinnovo">Rinnovo / proroga / disdetta</button>
        <button class="btn primary" id="det-edit">Modifica</button>`,
      onMount: (m) => {
        ScadenzeTable.bind(m.querySelector('#det-scad'), d.scadenze, { refresh: reopen, openContratto: () => {}, editScadenza: (s) => ScadenzaForm.open(s, reopen) });
        m.querySelector('#add-scad').addEventListener('click', () => ScadenzaForm.open({ contratto_id: id, tipo: 'altro', data: Util.todayISO() }, reopen));
        m.querySelector('#det-edit').addEventListener('click', () => ContrattoForm.open({ data: { contratto: c, immobile: i, parti: d.parti }, onSaved: reopen }));
        m.querySelector('#det-rinnovo').addEventListener('click', () => openRinnovo(c, reopen));
        const undo = m.querySelector('#det-undo');
        if (undo) undo.addEventListener('click', () => UI.guard('Rinnovi', 'Annullamento evento', async () => {
          if (!window.confirm('Annullare l\'ultimo evento registrato? Scadenza, canone e stato torneranno ai valori precedenti.')) return;
          await Rinnovi.annullaUltimo(id); UI.toast('Evento annullato'); reopen();
        }));
        m.querySelector('#det-del').addEventListener('click', () => UI.guard('ContrattoDettaglio', 'Eliminazione contratto', async () => {
          if (!window.confirm(`Eliminare definitivamente il contratto ${c.codice} con scadenze e storico? L'operazione non è reversibile (salvo backup).`)) return;
          await Repo.deleteContratto(id);
          Log.info('ContrattoDettaglio', 'Eliminato contratto ' + c.codice);
          UI.closeModal(); UI.toast('Contratto eliminato'); ctx.refresh();
        }));
      }
    });
  }

  function openRinnovo(c, onDone) {
    let tipo = c.stato === 'disdettato' ? 'risoluzione' : 'rinnovo_tacito';
    const body = () => {
      const p = Rinnovi.proponi(c, tipo);
      const prolunga = Dominio.TIPI_RINNOVO.find(x => x.v === tipo).prolunga;
      return html`<p>Scadenza attuale: <strong>${Util.fmtDate(c.data_scadenza)}</strong> – ${Dominio.label(Dominio.TIPOLOGIE, c.tipologia)}</p>
        ${p.avviso ? html`<div class="alert warn">${p.avviso}</div>` : ''}
        <form id="rin-form" class="form-grid">
          <label class="field wide"><span>Evento</span><select name="tipo">${options(Dominio.TIPI_RINNOVO, tipo)}</select></label>
          <label class="field"><span>${tipo === 'risoluzione' ? 'Data di cessazione' : 'Data evento'}</span><input type="date" name="data_evento" value="${p.data_evento}"></label>
          ${prolunga ? html`
            <label class="field"><span>Durata (mesi)</span><input name="mesi" data-type="int" value="${p.mesi}"></label>
            <label class="field"><span>Nuova scadenza</span><input type="date" name="nuova_scadenza" value="${p.nuova_scadenza || ''}"></label>
            <label class="field"><span>Canone annuo € (vuoto = invariato)</span><input name="nuovo_canone" data-type="number" inputmode="decimal" value="${p.nuovo_canone != null ? Util.fmtNumberIT(p.nuovo_canone) : ''}"></label>` : ''}
          <label class="field wide"><span>Note</span><textarea name="note"></textarea></label>
        </form>
        <p class="muted">Verrà creata la scadenza di comunicazione all'Agenzia delle Entrate (RLI) entro 30 giorni e saranno ricalcolate le scadenze del nuovo periodo.</p>`;
    };
    const mount = (m) => {
      const form = m.querySelector('#rin-form');
      form.querySelector('[name="tipo"]').addEventListener('change', (e) => { tipo = e.target.value; m.querySelector('.modal-body').innerHTML = UI.str(body()); mount(m); });
      const mesi = form.querySelector('[name="mesi"]');
      if (mesi) mesi.addEventListener('input', () => { const n = Util.parseNumber(mesi.value); if (n) form.querySelector('[name="nuova_scadenza"]').value = Dominio.scadenzaDopoRinnovo(c.data_scadenza, n); });
    };
    UI.openModal({
      title: 'Rinnovo, proroga o cessazione – ' + c.codice, body: body(),
      footer: html`<button class="btn" data-close>Annulla</button><button class="btn primary" id="rin-save">Registra</button>`,
      onMount: (m) => {
        mount(m);
        m.querySelector('#rin-save').addEventListener('click', () => UI.guard('Rinnovi', 'Registrazione evento', async () => {
          const ev = UI.readForm(m.querySelector('#rin-form'));
          await Rinnovi.registra(c.id, ev);
          Log.info('Rinnovi', `${Dominio.label(Dominio.TIPI_RINNOVO, ev.tipo)} su contratto ${c.codice}`);
          UI.toast('Evento registrato'); onDone();
        }));
      }
    });
  }
  return { open, openRinnovo };
});

/* =====================================================================

Modules.define('DashboardView', ['UI', 'Repo', 'Scadenzario', 'ScadenzeTable', 'ScadenzaForm', 'ContrattoDettaglio', 'Util', 'Db', 'Prefs', 'Archivio'],
  (UI, Repo, Scadenzario, ScadenzeTable, ScadenzaForm, ContrattoDettaglio, Util, Db, Prefs, Archivio) => {
  const { html } = UI;
  function render(el, ctx) {
    const s = Repo.statistiche();
    const giorni = Number(Prefs.get('giorniAvviso')) || 60;
    const all = Scadenzario.list();
    const rows = [...Scadenzario.filtra(all, { periodo: 'scadute' }), ...Scadenzario.filtra(all, { periodo: String(giorni) }).filter(x => x.data >= Util.todayISO())].slice(0, 15);
    const st = Db.state();
    const kpi = (v, l, cls, href) => html`<a class="card" href="${href}" style="text-decoration:none;color:inherit"><div class="value" style="${cls ? 'color:var(--' + cls + ')' : ''}">${v}</div><div class="label">${l}</div></a>`;
    el.innerHTML = UI.str(html`
      <h1>Riepilogo</h1>
      ${st.mode === 'locale' ? html`<div class="card"><div class="alert warn">Stai lavorando sulla copia locale di questo browser: i colleghi non vedono questi dati. Per l'uso in ufficio scegli la cartella del server in cui tenere l'archivio.</div>${Archivio.azioniHtml({ completo: false })}</div>` : ''}
      ${st.mode === 'attesa' ? html`<div class="card"><div class="alert danger">Il browser chiede di riconfermare l'accesso all'archivio sul server. Finché non ricolleghi i dati sono in sola lettura.</div>${Archivio.azioniHtml({ completo: false })}</div>` : ''}
      ${st.mode === 'memoria' ? html`<div class="card">${Archivio.statoHtml()}<p class="muted">L'app gira all'interno del sito, dove il browser non le consente di salvare nelle cartelle: apri <strong>${Db.NOME_ARCHIVIO}</strong> dalla cartella del server e, dopo le modifiche, salvalo e rimettilo al suo posto.</p>${Archivio.azioniHtml({ completo: false })}</div>` : ''}
      ${!Prefs.get('utente') ? html`<div class="alert info">Indica il tuo nome in <a href="#/impostazioni">Impostazioni</a>: verrà registrato su modifiche e adempimenti completati.</div>` : ''}
      <div class="grid kpi">
        ${kpi(s.attivi, 'Contratti attivi', '', '#/contratti')}
        ${kpi(s.inScadenza, `Contratti in scadenza entro ${giorni} gg`, s.inScadenza ? 'warn' : '', '#/contratti')}
        ${kpi(s.scaduteAperte, 'Adempimenti scaduti non evasi', s.scaduteAperte ? 'danger' : 'ok', '#/scadenzario')}
        ${kpi(s.prossime, `Adempimenti nei prossimi ${giorni} gg`, '', '#/scadenzario')}
        ${kpi(s.daVerificare, 'Documenti importati da verificare', s.daVerificare ? 'info' : '', '#/importa')}
        ${kpi(Util.fmtEuro(s.canoneTotale), 'Canoni annui dei contratti attivi', '', '#/contratti')}
      </div>
      <h2>Adempimenti scaduti e in arrivo</h2>
      <div id="dash-scad">${ScadenzeTable.render(rows, { emptyText: 'Nessun adempimento scaduto o in arrivo' })}</div>`);
    ScadenzeTable.bind(el.querySelector('#dash-scad'), rows, { refresh: ctx.refresh, openContratto: (id) => ContrattoDettaglio.open(id, ctx), editScadenza: (r) => ScadenzaForm.open(r, ctx.refresh) });
    Archivio.bind(el, ctx);
  }
  return { title: 'Riepilogo', render };
});

Modules.define('ContrattiView', ['UI', 'Repo', 'Dominio', 'Util', 'ContrattoForm', 'ContrattoDettaglio', 'ImportExport'],
  (UI, Repo, Dominio, Util, ContrattoForm, ContrattoDettaglio, ImportExport) => {
  const { html, options } = UI;
  const filtri = { testo: '', tipologia: '', regime: '', stato: 'non_cessati', categoria: '' };
  function applica(rows) {
    const q = filtri.testo.toLowerCase();
    return rows.filter(c =>
      (!filtri.tipologia || c.tipologia === filtri.tipologia) &&
      (!filtri.regime || c.regime_fiscale === filtri.regime) &&
      (!filtri.categoria || c.categoria_fiscale === filtri.categoria) &&
      (filtri.stato === '' || (filtri.stato === 'non_cessati' ? c.stato !== 'cessato' : c.stato === filtri.stato)) &&
      (!q || [c.codice, c.locatori, c.conduttori, c.indirizzo, c.comune, c.note, c.estremi_registrazione].some(v => String(v || '').toLowerCase().includes(q))));
  }
  function render(el, ctx) {
    const all = Repo.listContratti();
    const oggi = Util.todayISO();
    const draw = () => {
      const rows = applica(all);
      el.querySelector('#ctr-count').textContent = `${rows.length} di ${all.length}`;
      el.querySelector('#ctr-table').innerHTML = UI.str(rows.length ? html`<div class="table-wrap"><table>
        <thead><tr><th>Codice</th><th>Immobile</th><th>Locatore</th><th>Conduttore</th><th>Tipologia</th><th>Regime</th><th>IVA</th><th>Inizio</th><th>Scadenza</th><th class="num">Canone annuo</th><th>Stato</th></tr></thead>
        <tbody>${rows.map(c => {
          const scaduto = c.stato !== 'cessato' && c.data_scadenza < oggi;
          return html`<tr class="clickable ${scaduto ? 'overdue' : ''}" data-id="${c.id}">
            <td><strong>${c.codice}</strong></td>
            <td>${c.indirizzo || ''}<div class="muted">${[c.comune, Dominio.label(Dominio.CATEGORIE_FISCALI, c.categoria_fiscale)].filter(Boolean).join(' · ')}</div></td>
            <td>${c.locatori || ''}</td><td>${c.conduttori || ''}</td>
            <td>${c.tipologia}</td><td>${Dominio.label(Dominio.REGIMI, c.regime_fiscale).replace(/ \(.*\)$/, '')}</td><td>${c.soggetto_iva ? 'Sì' : 'No'}</td>
            <td style="white-space:nowrap">${Util.fmtDate(c.data_inizio)}</td>
            <td style="white-space:nowrap">${Util.fmtDate(c.data_scadenza)}${scaduto ? html`<div class="tag error">scaduto</div>` : ''}</td>
            <td class="num">${Util.fmtEuro(c.canone_annuo)}</td>
            <td><span class="tag ${c.stato === 'attivo' ? 'ok' : c.stato === 'disdettato' ? 'warn' : ''}">${c.stato}</span></td>
          </tr>`;
        })}</tbody></table></div>` : html`<div class="empty">Nessun contratto corrisponde ai filtri.</div>`);
      el.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => ContrattoDettaglio.open(Number(tr.dataset.id), ctx)));
    };
    el.innerHTML = UI.str(html`
      <h1>Contratti <span class="muted" id="ctr-count" style="font-size:13px;font-weight:400"></span></h1>
      <div class="toolbar">
        <input type="search" class="grow" id="f-testo" placeholder="Cerca per codice, parti, indirizzo, note…" value="${filtri.testo}">
        <select id="f-tipologia">${options(Dominio.TIPOLOGIE.map(t => ({ v: t.v, l: t.v })), filtri.tipologia, { empty: 'Tutte le tipologie' })}</select>
        <select id="f-regime">${options(Dominio.REGIMI, filtri.regime, { empty: 'Tutti i regimi' })}</select>
        <select id="f-categoria">${options(Dominio.CATEGORIE_FISCALI, filtri.categoria, { empty: 'Tutte le categorie' })}</select>
        <select id="f-stato">${options([{ v: 'non_cessati', l: 'Attivi e disdettati' }, ...Dominio.STATI], filtri.stato, { empty: 'Tutti gli stati' })}</select>
        <button class="btn" id="ctr-csv">Esporta CSV</button>
        <button class="btn primary" id="ctr-new">+ Nuovo contratto</button>
      </div>
      <div id="ctr-table"></div>`);
    const bindFilter = (id, key, ev = 'change') => el.querySelector(id).addEventListener(ev, (e) => { filtri[key] = e.target.value; draw(); });
    bindFilter('#f-testo', 'testo', 'input'); bindFilter('#f-tipologia', 'tipologia'); bindFilter('#f-regime', 'regime'); bindFilter('#f-categoria', 'categoria'); bindFilter('#f-stato', 'stato');
    el.querySelector('#ctr-new').addEventListener('click', () => ContrattoForm.open({ data: { contratto: { stato: 'attivo' }, immobile: {}, parti: [] }, onSaved: (id) => { ctx.refresh(); ContrattoDettaglio.open(id, ctx); } }));
    el.querySelector('#ctr-csv').addEventListener('click', () => UI.guard('ContrattiView', 'Esportazione CSV', async () => Util.download(`contratti_${Util.todayISO()}.csv`, ImportExport.exportCSV('contratti'), 'text/csv;charset=utf-8')));
    draw();
  }
  return { title: 'Contratti', render };
});

Modules.define('ScadenzarioView', ['UI', 'Scadenzario', 'ScadenzeTable', 'ScadenzaForm', 'ContrattoDettaglio', 'Dominio', 'Util', 'ImportExport'],
  (UI, Scadenzario, ScadenzeTable, ScadenzaForm, ContrattoDettaglio, Dominio, Util, ImportExport) => {
  const { html, options } = UI;
  const filtri = { periodo: '90', tipo: '', stato: 'aperte', testo: '' };
  const PERIODI = [{ v: 'scadute', l: 'Scadute non evase' }, { v: '30', l: 'Prossimi 30 giorni' }, { v: '60', l: 'Prossimi 60 giorni' }, { v: '90', l: 'Prossimi 90 giorni' }, { v: '180', l: 'Prossimi 6 mesi' }, { v: '365', l: 'Prossimi 12 mesi' }, { v: 'tutte', l: 'Tutte le date' }];
  function render(el, ctx) {

    const draw = () => {
      rows = Scadenzario.filtra(all, filtri);
      el.querySelector('#sc-count').textContent = `${rows.length} adempimenti`;
      const box = el.querySelector('#sc-table');
      box.innerHTML = UI.str(ScadenzeTable.render(rows, { groupByMonth: true, emptyText: 'Nessun adempimento nel periodo selezionato' }));
      ScadenzeTable.bind(box, rows, { refresh: ctx.refresh, openContratto: (id) => ContrattoDettaglio.open(id, ctx), editScadenza: (r) => ScadenzaForm.open(r, ctx.refresh) });
    };
    el.innerHTML = UI.str(html`
      <h1>Scadenzario <span class="muted" id="sc-count" style="font-size:13px;font-weight:400"></span></h1>
      <div class="toolbar">
        <select id="s-periodo">${options(PERIODI, filtri.periodo)}</select>
        <select id="s-tipo">${options(Dominio.TIPI_SCADENZA, filtri.tipo, { empty: 'Tutti gli adempimenti' })}</select>
        <select id="s-stato">${options([{ v: 'aperte', l: 'Da fare' }, { v: 'completate', l: 'Completate' }, { v: 'tutte', l: 'Tutte' }], filtri.stato)}</select>
        <input type="search" class="grow" id="s-testo" placeholder="Cerca…" value="${filtri.testo}">
        <button class="btn" id="sc-csv">Esporta CSV</button>
        <button class="btn" id="sc-ics" title="Importabile in Outlook / Google Calendar">Esporta calendario (.ics)</button>
        <button class="btn primary" id="sc-new">+ Scadenza</button>
      </div>
      <div id="sc-table"></div>`);
    const bindF = (id, key, ev = 'change') => el.querySelector(id).addEventListener(ev, (e) => { filtri[key] = e.target.value; draw(); });
    bindF('#s-periodo', 'periodo'); bindF('#s-tipo', 'tipo'); bindF('#s-stato', 'stato'); bindF('#s-testo', 'testo', 'input');
    el.querySelector('#sc-new').addEventListener('click', () => ScadenzaForm.open(null, ctx.refresh));
    el.querySelector('#sc-csv').addEventListener('click', () => UI.guard('ScadenzarioView', 'Esportazione CSV', async () => Util.download(`scadenze_${Util.todayISO()}.csv`, ImportExport.exportCSV('scadenze'), 'text/csv;charset=utf-8')));
    el.querySelector('#sc-ics').addEventListener('click', () => UI.guard('ScadenzarioView', 'Esportazione calendario', async () => {
      const aperte = all.filter(s => !s.completata);
      Util.download(`scadenze_${Util.todayISO()}.ics`, Scadenzario.toICS(aperte), 'text/calendar;charset=utf-8');
      UI.toast(`${aperte.length} adempimenti da fare esportati nel calendario`);
    }));
    draw();
  }
  return { title: 'Scadenzario', render };
});

Modules.define('ImportaView', ['UI', 'FolderImport', 'Repo', 'ContrattoForm', 'Prefs', 'Util', 'Log', 'Extract'],
  (UI, FolderImport, Repo, ContrattoForm, Prefs, Util, Log, Extract) => {
  const { html, options } = UI;
  const state = { running: false, progress: null, risultati: [], cartella: '', filtro: 'da_verificare', summary: null };
  const ESITI = { nuovo: ['info', 'da verificare'], gia_presente: ['', 'già presente'], errore: ['error', 'errore'] };

  function progressHtml() {
    if (!state.running && !state.summary) return '';
    const p = state.progress || { frac: 0, msg: 'Avvio…', file: '' };
    return html`<div class="card">
      ${state.running ? html`<div class="toolbar"><strong>Elaborazione ${p.index != null ? (p.index + 1) + '/' + p.total : ''}</strong><span class="muted grow" id="imp-msg">${p.file} – ${p.msg}</span><button class="btn danger small" id="imp-cancel">Interrompi</button></div>
        <div class="progress"><div id="imp-bar" style="width:${Math.round(p.frac * 100)}%"></div></div>`
        : html`<div class="alert ${state.summary.errori ? 'warn' : 'ok'}" style="margin:0">Cartella <strong>${state.cartella}</strong>: ${state.summary.nuovi} nuovi documenti da verificare, ${state.summary.giaPresenti} già presenti, ${state.summary.errori} errori${state.summary.annullato ? ' (interrotto)' : ''}.</div>`}
      ${state.risultati.length ? html`<details style="margin-top:10px"${state.running ? UI.raw(' open') : ''}><summary>Dettaglio file (${state.risultati.length})</summary><ul style="max-height:200px;overflow:auto">${state.risultati.map(r => html`<li><span class="tag ${ESITI[r.esito][0]}">${ESITI[r.esito][1]}</span> ${r.path} ${r.metodo ? html`<span class="muted">(${r.metodo}${r.avvisi ? ', ' + r.avvisi + ' avvisi' : ''})</span>` : ''}${r.messaggio ? html` <span class="muted">${r.messaggio}</span>` : ''}</li>`)}</ul></details>` : ''}
    </div>`;
  }

  function render(el, ctx) {
    const docs = Repo.listDocumenti();
    const conta = (s) => docs.filter(d => d.stato === s).length;
    const visibili = docs.filter(d => !state.filtro || d.stato === state.filtro);
    el.innerHTML = UI.str(html`
      <h1>Importa contratti da cartella</h1>
      <div class="card">
        <p style="margin-top:0">Seleziona la cartella (anche di rete) in cui sono salvati i contratti: vengono letti PDF, DOCX, TXT e immagini, incluse le sottocartelle. I PDF scansionati e le foto vengono letti con l'OCR in italiano. <strong>I file non lasciano il computer</strong>: l'elaborazione avviene nel browser.</p>
        <p class="muted">Ogni file è riconosciuto dalla sua impronta: ricontrollando la cartella vengono elaborati solo i documenti nuovi. I dati rilevati vanno sempre verificati prima di creare il contratto.</p>
        <div class="toolbar" style="margin:0">
          <button class="btn primary" id="imp-pick" ${state.running ? UI.raw('disabled') : ''}>Seleziona cartella…</button>
          <button class="btn" id="imp-rescan" hidden ${state.running ? UI.raw('disabled') : ''}>Ricontrolla cartella memorizzata</button>
          <label class="check"><input type="checkbox" id="imp-ocr" ${Prefs.get('ocrAttivo') ? UI.raw('checked') : ''}> OCR per scansioni e immagini</label>
          <label class="check">pagine OCR max <input id="imp-maxp" style="width:60px" value="${Prefs.get('ocrMaxPagine')}" inputmode="numeric"></label>
        </div>
        ${!FolderImport.supportsPicker() ? html`<p class="muted" style="margin-bottom:0">Su questo browser la cartella va riselezionata a ogni sessione (Chrome ed Edge la ricordano).</p>` : ''}
      </div>
      <div id="imp-progress">${progressHtml()}</div>
      <h2>Documenti importati</h2>
      <div class="toolbar">
        <select id="imp-filtro">${options([{ v: 'da_verificare', l: `Da verificare (${conta('da_verificare')})` }, { v: 'errore', l: `Con errori (${conta('errore')})` }, { v: 'importato', l: `Importati (${conta('importato')})` }, { v: 'ignorato', l: `Ignorati (${conta('ignorato')})` }], state.filtro, { empty: `Tutti (${docs.length})` })}</select>
      </div>
      ${visibili.length ? html`<div class="table-wrap"><table><thead><tr><th>File</th><th>Estrazione</th><th>Stato</th><th>Note</th><th></th></tr></thead><tbody>
        ${visibili.map(d => html`<tr>
          <td>${d.nome_file}<div class="muted" style="font-size:11px">${d.percorso || ''}</div></td>
          <td>${d.metodo_estrazione || ''}</td>
          <td><span class="tag ${d.stato === 'importato' ? 'ok' : d.stato === 'errore' ? 'error' : d.stato === 'da_verificare' ? 'info' : ''}">${d.stato.replace('_', ' ')}</span>${d.codice ? html` <span class="muted">${d.codice}</span>` : ''}</td>
          <td>${d.messaggio || ''}</td>
          <td style="white-space:nowrap;text-align:right">
            ${d.stato === 'da_verificare' ? html`<button class="btn small primary" data-verify="${d.id}">Verifica e importa</button> <button class="btn small" data-ignore="${d.id}">Ignora</button>` : ''}
            ${d.stato === 'ignorato' ? html`<button class="btn small" data-restore="${d.id}">Ripristina</button>` : ''}
            ${d.stato === 'errore' ? html`<button class="btn small" data-retry="${d.id}">Riprova</button> <button class="btn small" data-manual="${d.id}">Inserisci a mano</button>` : ''}
            <button class="btn small danger" data-del-doc="${d.id}" title="Elimina il record (il file originale non viene toccato)">✕</button>
          </td></tr>`)}
      </tbody></table></div>` : html`<div class="empty">Nessun documento in questo stato.</div>`}`);

    FolderImport.savedFolder().then(h => { const b = el.querySelector('#imp-rescan'); if (h && b) { b.hidden = false; b.textContent = `Ricontrolla "${h.name}"`; } }).catch(e => Log.fromError('ImportaView', e, 'Lettura cartella memorizzata'));
    el.querySelector('#imp-ocr').addEventListener('change', (e) => Prefs.set('ocrAttivo', e.target.checked));
    el.querySelector('#imp-maxp').addEventListener('change', (e) => Prefs.set('ocrMaxPagine', Math.max(1, Math.min(50, Number(e.target.value) || 8))));
    el.querySelector('#imp-filtro').addEventListener('change', (e) => { state.filtro = e.target.value; ctx.refresh(); });
    const cancel = el.querySelector('#imp-cancel');
    if (cancel) cancel.addEventListener('click', () => FolderImport.cancel());

    const run = (getter) => UI.guard('ImportaView', 'Importazione cartella', async () => {
      const sel = await getter();
      if (!sel) return;
      if (!sel.entries.length) { UI.toast('Nessun file supportato nella cartella selezionata', 'warn'); return; }
      Object.assign(state, { running: true, risultati: [], cartella: sel.name, summary: null, progress: null });
      ctx.refresh();
      try {
        state.summary = await FolderImport.process(sel.entries, {
          onProgress: (p) => {
            state.progress = p;
            const bar = document.getElementById('imp-bar'), msg = document.getElementById('imp-msg');
            if (bar) bar.style.width = Math.round(p.frac * 100) + '%';
            if (msg) msg.textContent = `${p.file} – ${p.msg}`;
            else { const box = document.getElementById('imp-progress'); if (box) box.innerHTML = UI.str(progressHtml()); }
          },
          onItem: (r) => state.risultati.push(r)
        });
        Log.info('ImportaView', `Import "${sel.name}": ${state.summary.nuovi} nuovi, ${state.summary.giaPresenti} già presenti, ${state.summary.errori} errori`);
      } finally {
        state.running = false;
        state.filtro = 'da_verificare';
        ctx.refresh();
      }
    });
    el.querySelector('#imp-pick').addEventListener('click', () => run(() => FolderImport.pickFolder()));
    el.querySelector('#imp-rescan').addEventListener('click', () => run(() => FolderImport.rescan()));

    el.querySelectorAll('[data-verify]').forEach(b => b.addEventListener('click', () => UI.guard('ImportaView', 'Apertura revisione', async () => {
      const doc = Repo.getDocumento(Number(b.dataset.verify));
      const dati = doc.dati_estratti ? JSON.parse(doc.dati_estratti) : { contratto: {}, immobile: {}, parti: [], trovati: {}, avvisi: [] };
      ContrattoForm.open({ data: dati, trovati: dati.trovati, avvisi: dati.avvisi, documento: doc, onSaved: ctx.refresh });
    })));
    el.querySelectorAll('[data-manual]').forEach(b => b.addEventListener('click', () => {
      const doc = Repo.getDocumento(Number(b.dataset.manual));
      ContrattoForm.open({ data: { contratto: { codice: doc.nome_file.replace(/\.[^.]+$/, '') }, immobile: {}, parti: [] }, avvisi: ['Testo non estraibile automaticamente (' + (doc.messaggio || 'errore') + '): inserire i dati consultando l\'originale.'], documento: doc, onSaved: ctx.refresh });
    }));
    const setStato = (attr, stato) => el.querySelectorAll(`[${attr}]`).forEach(b => b.addEventListener('click', () => UI.guard('ImportaView', 'Aggiornamento documento', async () => { await Repo.setStatoDocumento(Number(b.getAttribute(attr)), stato); ctx.refresh(); })));
    setStato('data-ignore', 'ignorato'); setStato('data-restore', 'da_verificare');
    el.querySelectorAll('[data-del-doc]').forEach(b => b.addEventListener('click', () => UI.guard('ImportaView', 'Eliminazione documento', async () => {
      if (!(await UI.confirmDialog('Eliminare il record del documento? Il file originale non viene toccato; al prossimo controllo della cartella verrà rielaborato.', { ok: 'Elimina', danger: true }))) return;
      await Repo.eliminaDocumento(Number(b.dataset.delDoc)); ctx.refresh();
    })));
    el.querySelectorAll('[data-retry]').forEach(b => b.addEventListener('click', () => run(async () => {
      const doc = Repo.getDocumento(Number(b.dataset.retry));
      const f = await FolderImport.getFile(doc.percorso);
      if (!f) throw new Error('File non disponibile: riselezionare la cartella');
      if (!Extract.isSupported(f.name)) throw new Error('Formato non supportato');
      return { name: doc.percorso, entries: [{ path: doc.percorso, file: f }] };
    })));
  }
  return { title: 'Importa', render, isBusy: () => state.running };
});

Modules.define('DatiView', ['UI', 'ImportExport', 'Db', 'Util', 'Log'], (UI, ImportExport, Db, Util, Log) => {
  const { html } = UI;
  function render(el, ctx) {
    el.innerHTML = UI.str(html`
      <h1>Importazione ed esportazione dati</h1>
      <div class="card">
        <h2 style="margin-top:0">JSON – copia completa</h2>
        <p class="muted">Contiene tutte le tabelle (contratti, parti, immobili, scadenze, rinnovi, documenti). Utile come backup leggibile o per trasferire i dati.</p>
        <div class="toolbar"><button class="btn primary" id="x-json">Esporta JSON</button><label class="check"><input type="checkbox" id="x-json-testi" checked> includi il testo estratto dai documenti</label></div>
        <div class="toolbar"><button class="btn" id="i-json-merge">Importa JSON (aggiungi ai dati esistenti)</button><button class="btn danger" id="i-json-replace">Importa JSON (sostituisci tutto)</button></div>
      </div>
      <div class="card">
        <h2 style="margin-top:0">CSV – per Excel</h2>
        <p class="muted">Separatore punto e virgola, date GG/MM/AAAA, decimali con la virgola. Le parti sono nel formato <code>Nome [codice fiscale] | Nome [codice fiscale]</code>.</p>
        <div class="toolbar"><button class="btn" data-csv="contratti">Esporta contratti</button><button class="btn" data-csv="scadenze">Esporta scadenze</button><button class="btn" data-csv="soggetti">Esporta anagrafiche</button><button class="btn" id="x-csv-tpl">Scarica modello vuoto</button></div>
        <div class="toolbar"><button class="btn primary" id="i-csv">Importa contratti da CSV</button><span class="muted">Se la colonna <code>id</code> corrisponde a un contratto esistente lo aggiorna, altrimenti lo crea.</span></div>
        <div id="csv-esito"></div>
      </div>
      <div class="card">
        <h2 style="margin-top:0">Database SQLite</h2>
        <p class="muted">Copia binaria del database (apribile con DB Browser for SQLite). Caricare un file sostituisce i dati correnti.</p>
        <div class="toolbar"><button class="btn" id="x-sqlite">${Db.supportsFileAccess() ? 'Salva copia .sqlite (scegli cartella e nome)…' : 'Scarica copia .sqlite'}</button><button class="btn danger" id="i-sqlite">Carica da file .sqlite</button></div>
      </div>`);

    el.querySelector('#x-json').addEventListener('click', () => UI.guard('DatiView', 'Esportazione JSON', async () => {
      const data = ImportExport.exportJSON({ includiTesti: el.querySelector('#x-json-testi').checked });
      Util.download(`contratti-locazione_${Util.todayISO()}.json`, JSON.stringify(data, null, 2), 'application/json');
    }));
    const importJson = (mode) => UI.guard('DatiView', 'Importazione JSON', async () => {
      const f = await UI.pickFile('.json,application/json');
      if (!f) return;
      const obj = JSON.parse(await f.text());
      if (mode === 'sostituisci' && !(await UI.confirmDialog(`Sostituire TUTTI i dati attuali con il contenuto di ${f.name}?\nSi consiglia di esportare prima un backup.`, { ok: 'Sostituisci', danger: true }))) return;
      const counts = await ImportExport.importJSON(obj, mode);
      Log.info('DatiView', `Import JSON (${mode}) da ${f.name}: ` + JSON.stringify(counts));
      UI.toast(`Importati ${counts.contratti || 0} contratti e ${counts.scadenze || 0} scadenze`);
      ctx.refresh();
    });
    el.querySelector('#i-json-merge').addEventListener('click', () => importJson('unisci'));
    el.querySelector('#i-json-replace').addEventListener('click', () => importJson('sostituisci'));
    el.querySelectorAll('[data-csv]').forEach(b => b.addEventListener('click', () => UI.guard('DatiView', 'Esportazione CSV', async () => Util.download(`${b.dataset.csv}_${Util.todayISO()}.csv`, ImportExport.exportCSV(b.dataset.csv), 'text/csv;charset=utf-8'))));
    el.querySelector('#x-csv-tpl').addEventListener('click', () => Util.download('modello_contratti.csv', ImportExport.exportCSV('contratti').split('\r\n')[0], 'text/csv;charset=utf-8'));
    el.querySelector('#i-csv').addEventListener('click', () => UI.guard('DatiView', 'Importazione CSV', async () => {
      const f = await UI.pickFile('.csv,text/csv');
      if (!f) return;
      const esito = await ImportExport.importCSVContratti(await f.text());
      Log.info('DatiView', `Import CSV ${f.name}: ${esito.creati} creati, ${esito.aggiornati} aggiornati, ${esito.errori.length} errori`);
      esito.errori.forEach(e => Log.warn('DatiView', 'CSV ' + f.name + ' – ' + e));
      el.querySelector('#csv-esito').innerHTML = UI.str(html`<div class="alert ${esito.errori.length ? 'warn' : 'ok'}">${esito.creati} contratti creati, ${esito.aggiornati} aggiornati.${esito.errori.length ? html`<ul>${esito.errori.map(e => html`<li>${e}</li>`)}</ul>` : ''}</div>`);
      UI.toast('Importazione CSV completata');
    }));
    el.querySelector('#x-sqlite').addEventListener('click', () => UI.guard('DatiView', 'Salvataggio copia', async () => {
      const r = await Db.saveCopy({ suggestedName: `contratti-locazione_${Util.todayISO()}.sqlite` });
      UI.toast(r.sceltoPercorso ? `Copia salvata: ${r.name}` : `Copia scaricata nella cartella Download: ${r.name}`);
    }));
    el.querySelector('#i-sqlite').addEventListener('click', () => UI.guard('DatiView', 'Caricamento database', async () => {
      const f = await UI.pickFile('.sqlite,.db,.sqlite3');
      if (!f) return;
      if (!(await UI.confirmDialog(`Sostituire il database corrente con ${f.name}?` + (Db.state().mode === 'condiviso' ? '\nATTENZIONE: verrà sovrascritto anche il file condiviso usato dai colleghi.' : ''), { ok: 'Sostituisci', danger: true }))) return;
      await Db.replaceWithBytes(await f.arrayBuffer());
      Log.info('DatiView', 'Database sostituito con ' + f.name);
      UI.toast('Database caricato'); ctx.refresh();
    }));
  }
  return { title: 'Import / Export', render };
});

/* ---------------------------------------------------------------------
   Archivio — stato e azioni sull'archivio (scelta della cartella del
   server, ricollegamento, apertura/salvataggio come file nella modalità
   memoria). Usato da Impostazioni e dal Riepilogo.
   --------------------------------------------------------------------- */
Modules.define('Archivio', ['UI', 'Db', 'Ambiente', 'Config'], (UI, Db, Ambiente, Config) => {
  const { html } = UI;
  const MODI = {
    condiviso: ['ok', 'Archivio condiviso collegato'],
    locale: ['warn', 'Copia locale del browser (solo questa postazione)'],
    attesa: ['danger', 'Archivio condiviso in attesa di permesso'],
    memoria: ['info', 'Archivio aperto in memoria: va salvato come file']
  };
  function statoHtml() {
    const st = Db.state();
    const m = MODI[st.mode];
    return html`<p><span class="pill ${m[0]}">${m[1]}</span>
      ${st.folderName ? html` cartella <strong>${st.folderName}</strong>,` : ''} ${st.fileName ? html` file <strong>${st.fileName}</strong>` : ''}
      ${st.mode === 'memoria' && st.dirty ? html` <span class="tag warn">modifiche non salvate</span>` : ''}
      ${st.lastSync ? html`<span class="muted">– ultima sincronizzazione ${st.lastSync.toLocaleTimeString('it-IT')}</span>` : ''}</p>`;
  }
  /** completo=true mostra anche spiegazioni e azioni secondarie (pagina Impostazioni). */
  function azioniHtml({ completo }) {
    const st = Db.state();
    if (st.mode === 'memoria') {
      const spiegazione = Ambiente.sandboxed
        ? `L'app è aperta all'interno del sito: per sicurezza il browser non le permette di scrivere nelle cartelle del server né di conservare dati. Apri il file ${Db.NOME_ARCHIVIO} dalla cartella del server, lavora e poi salvalo: il browser lo scarica e va rimesso nella cartella, sostituendo il precedente. Per salvare direttamente sul server usa la versione autonoma dell'app (vedi README).`
        : `Questo browser non permette di conservare i dati della pagina (es. navigazione privata): apri l'archivio da file e salvalo prima di chiudere.`;
      return html`${completo ? html`<p class="muted">${spiegazione}</p>` : ''}
        <div class="toolbar" style="margin-bottom:0">
          <button class="btn primary" data-arch="apri-file">Apri archivio .sqlite…</button>
          <button class="btn ${st.dirty ? 'primary' : ''}" data-arch="salva">${Db.supportsFileAccess() ? 'Salva archivio (scegli cartella e nome)…' : `Salva archivio (scarica ${st.fileName || Db.NOME_ARCHIVIO})`}</button>
        </div>`;
    }
    if (!Db.supportsFolder()) {
      return html`<div class="alert warn" style="margin-bottom:0">Questo browser non consente di scrivere direttamente nelle cartelle (funzione disponibile in Chrome ed Edge). Puoi lavorare su una copia locale, caricarla da <a href="#/dati">Import / Export</a> → "Carica da file .sqlite" e riscaricarla. Per l'uso condiviso in ufficio usa Chrome o Edge.</div>`;
    }
    return html`${completo ? html`<p class="muted">Scegli la cartella del server in cui tenere l'archivio (es. l'unità di rete <code>Z:\\Contratti</code>). Se la cartella contiene già <code>${Db.NOME_ARCHIVIO}</code> viene aperto, altrimenti viene creato con i dati attuali. Ogni postazione sceglie la stessa cartella una volta; l'app ricarica il file prima di ogni salvataggio, controlla le modifiche dei colleghi ogni ${Config.POLL_MS / 1000} secondi e ogni giorno salva una copia nella sottocartella <code>backup</code> (ultime 30).</p>` : ''}
      <div class="toolbar" style="margin-bottom:0">
        ${st.mode === 'attesa' ? html`<button class="btn primary" data-arch="ricollega">Ricollega ${st.folderName || st.fileName}</button>` : ''}
        <button class="btn ${st.mode === 'condiviso' || st.mode === 'attesa' ? '' : 'primary'}" data-arch="cartella">${st.mode === 'condiviso' ? "Cambia cartella dell'archivio…" : 'Scegli la cartella del server…'}</button>
        ${completo ? html`<button class="btn" data-arch="crea" title="Scegli cartella e nome del file; senza cartella collegata non si fanno i backup giornalieri">Crea archivio con nome e percorso a scelta…</button>
          <button class="btn" data-arch="file">Apri un file .sqlite specifico…</button>` : ''}
        ${completo && st.mode !== 'locale' ? html`<button class="btn danger" data-arch="scollega">Scollega (lavora in locale)</button>` : ''}
      </div>`;
  }
  const AZIONI = {
    'apri-file': async () => {
      if (Db.state().dirty && !(await UI.confirmDialog('Ci sono modifiche non salvate: aprendo un altro archivio andranno perse. Continuare?', { ok: 'Apri comunque', danger: true }))) return;
      const f = await UI.pickFile('.sqlite,.db,.sqlite3');
      if (!f) return;
      await Db.replaceWithBytes(await f.arrayBuffer(), f.name);
      UI.toast('Archivio ' + f.name + ' aperto');
    },
    salva: async () => {
      const r = await Db.saveCopy();
      UI.toast(r.sceltoPercorso
        ? `Archivio salvato come ${r.name}`
        : `Archivio scaricato come ${r.name} nella cartella Download: rimettilo nella cartella del server sostituendo il precedente`, 'ok', 9000);
    },
    crea: async () => {
      const n = (Db.one('SELECT COUNT(*) AS n FROM contratti') || { n: 0 }).n;
      if (!(await UI.confirmDialog(`Verrà creato un nuovo archivio con i dati attuali (${n} contratti): nella finestra successiva scegli la cartella e il nome del file.\nLe altre postazioni dovranno collegarlo con "Apri un file .sqlite specifico…". Con un nome scelto liberamente non vengono fatti i backup giornalieri: per averli usa "Scegli la cartella del server…".\n\nProcedere?`, { ok: 'Scegli percorso' }))) return;
      const nome = await Db.createAt();
      UI.toast('Archivio creato: ' + nome);
    },
    ricollega: async () => { await Db.reconnect(); UI.toast('Archivio ricollegato'); },
    cartella: async () => {
      const scelta = await Db.pickFolder();
      const locale = Db.state().mode === 'locale';
      const n = (Db.one('SELECT COUNT(*) AS n FROM contratti') || { n: 0 }).n;
      const msg = scelta.esiste
        ? `La cartella "${scelta.dirHandle.name}" contiene già ${scelta.nomeFile}: verrà aperto e i dati visualizzati ora in questo browser saranno sostituiti da quelli del file.` + (locale ? '\nSe qui hai dati da conservare, esportali prima in JSON e poi importali con "aggiungi".' : '') + '\n\nProcedere?'
        : `Nella cartella "${scelta.dirHandle.name}" verrà creato ${scelta.nomeFile} con i dati attuali (${n} contratti). Procedere?`;
      if (!(await UI.confirmDialog(msg, { ok: scelta.esiste ? 'Apri archivio' : 'Crea archivio' }))) return;
      await Db.useFolder(scelta.dirHandle);
      UI.toast(scelta.esiste ? 'Archivio del server aperto' : 'Archivio creato nella cartella del server');
    },
    file: async () => {
      if (!(await UI.confirmDialog('Aprendo un file, i dati visualizzati in questo browser saranno sostituiti da quelli del file. Senza cartella non vengono creati i backup giornalieri.\n\nProcedere?', { ok: 'Scegli file' }))) return;
      await Db.connectShared();
      UI.toast('Archivio condiviso collegato');
    },
    scollega: async () => {
      if (!(await UI.confirmDialog("Scollegare l'archivio condiviso? Continuerai a lavorare su una copia locale che i colleghi non vedranno.", { ok: 'Scollega', danger: true }))) return;
      await Db.disconnect();
    }
  };
  function bind(el, ctx) {
    el.querySelectorAll('[data-arch]').forEach(b => b.addEventListener('click', () => UI.guard('Archivio', b.textContent.trim(), async () => {
      await AZIONI[b.dataset.arch]();
      ctx.refresh();
    })));
  }
  return { statoHtml, azioniHtml, bind };
});

Modules.define('ImpostazioniView', ['UI', 'Db', 'Prefs', 'Seed', 'Migrations', 'Config', 'Util', 'Log', 'Archivio'], (UI, Db, Prefs, Seed, Migrations, Config, Util, Log, Archivio) => {

    el.querySelector('#set-giorni').addEventListener('change', (e) => Prefs.set('giorniAvviso', Math.max(1, Number(e.target.value) || 60)));
    el.querySelector('#set-ocrpag').addEventListener('change', (e) => Prefs.set('ocrMaxPagine', Math.max(1, Math.min(50, Number(e.target.value) || 8))));
    el.querySelector('#set-tema').addEventListener('change', (e) => { Prefs.set('tema', e.target.value); ctx.applyTheme(); });
    const act = (id, label, fn) => { const b = el.querySelector(id); if (b) b.addEventListener('click', () => UI.guard('Impostazioni', label, async () => { await fn(); ctx.refresh(); })); };
    Archivio.bind(el, ctx);
    act('#seed-load', 'Caricamento dati di esempio', async () => { await Seed.carica(); UI.toast('Dati di esempio caricati'); });
    act('#seed-del', 'Eliminazione dati di esempio', async () => { await Seed.rimuovi(); UI.toast('Dati di esempio eliminati'); });
    act('#db-reset', 'Svuotamento database', async () => {
