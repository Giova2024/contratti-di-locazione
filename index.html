<script>
'use strict';
/* ---------------------------------------------------------------------
   Extract — estrazione del testo dai documenti, tutta nel browser:
     PDF con testo → pdf.js; PDF scansionati e immagini → OCR Tesseract
     (lingua italiana); DOCX → mammoth; TXT → lettura diretta.
   Nessun file viene inviato a server: dal CDN si scaricano solo le
   librerie e il modello linguistico dell'OCR.
   --------------------------------------------------------------------- */
Modules.define('Extract', ['Config', 'Log'], (Config, Log) => {
  const scripts = new Map();
  function loadScript(url) {
    if (!scripts.has(url)) {
      scripts.set(url, new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url; s.async = true;
        s.onload = resolve;
        s.onerror = () => { scripts.delete(url); reject(new Error('Impossibile caricare la libreria ' + url + ' (connessione assente?)')); };
        document.head.appendChild(s);
      }));
    }
    return scripts.get(url);
  }
  async function pdfLib() {
    await loadScript(Config.CDN.pdfjs);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = Config.CDN.pdfWorker;
    return window.pdfjsLib;
  }
  let ocrWorker = null;
  let ocrProgress = () => {};
  async function ocr() {
    if (!ocrWorker) {
      await loadScript(Config.CDN.tesseract);
      ocrWorker = await window.Tesseract.createWorker('ita', 1, {
        logger: (m) => { if (m.status === 'recognizing text') ocrProgress(m.progress); }
      });
    }
    return ocrWorker;
  }
  /** Libera la memoria del motore OCR (alcune centinaia di MB) a fine importazione. */
  async function release() {
    if (ocrWorker) { try { await ocrWorker.terminate(); } catch (e) { Log.fromError('Extract', e, 'Chiusura OCR'); } ocrWorker = null; }
  }
  async function ocrImage(source, onProgress) {
    const w = await ocr();
    ocrProgress = onProgress || (() => {});
    const { data } = await w.recognize(source);
    return data.text || '';
  }
  const ext = (name) => (String(name).split('.').pop() || '').toLowerCase();
  /** Testo "utile": se una pagina PDF ha pochissime lettere è quasi certamente una scansione. */
  const letterCount = (s) => (s.match(/[a-zà-ÿ]/gi) || []).length;

  async function extractPdf(buffer, opts) {
    const lib = await pdfLib();
    const doc = await lib.getDocument({ data: new Uint8Array(buffer) }).promise;
    let text = '';
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str + (it.hasEOL ? '\n' : ' ')).join('') + '\n\n';
    }
    if (letterCount(text) / doc.numPages >= 150 || !opts.ocr) {
      return { text, method: letterCount(text) ? 'pdf-testo' : 'pdf-senza-testo', pages: doc.numPages };
    }
    // PDF scansionato: rasterizzo le pagine e applico l'OCR.
    const max = Math.min(doc.numPages, Number(opts.maxPages) || 8);
    let ocrText = '';
    for (let i = 1; i <= max; i++) {
      opts.onProgress && opts.onProgress(`OCR pagina ${i}/${max}`, (i - 1) / max);
      const page = await doc.getPage(i);
      const viewport = page.getViewport({ scale: 2 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      ocrText += await ocrImage(canvas, (p) => opts.onProgress && opts.onProgress(`OCR pagina ${i}/${max}`, (i - 1 + p) / max)) + '\n\n';
      canvas.width = canvas.height = 0;
    }
    const note = doc.numPages > max ? ` (prime ${max} di ${doc.numPages} pagine)` : '';
    return { text: ocrText, method: 'pdf-ocr' + note, pages: doc.numPages };
  }

  /**
   * @param {File} file
   * @param {{ocr:boolean, maxPages:number, onProgress:(msg:string, frac:number)=>void}} opts
   * @returns {Promise<{text:string, method:string}>}
   */
  async function extract(file, opts = {}) {
    const e = ext(file.name);
    const buffer = await file.arrayBuffer();
    if (e === 'pdf') return extractPdf(buffer, opts);
    if (e === 'docx') {
      await loadScript(Config.CDN.mammoth);
      const r = await window.mammoth.extractRawText({ arrayBuffer: buffer });
      return { text: r.value, method: 'docx' };
    }
    if (e === 'txt') return { text: new TextDecoder('utf-8').decode(buffer), method: 'testo' };
    if (['jpg', 'jpeg', 'png', 'bmp', 'webp', 'gif'].includes(e)) {
      if (!opts.ocr) throw new Error('Immagine: attivare l\'OCR nelle impostazioni per leggerla');
      const text = await ocrImage(file, (p) => opts.onProgress && opts.onProgress('OCR immagine', p));
      return { text, method: 'immagine-ocr' };
    }
    if (e === 'doc') throw new Error('Formato .doc (Word 97-2003) non leggibile nel browser: salvarlo come .docx o PDF');
    throw new Error('Formato non supportato: .' + e);
  }
  const isSupported = (name) => Config.FILE_SUPPORTATI.includes(ext(name)) || ext(name) === 'doc';
  return { extract, release, isSupported, ext };
});

/* ---------------------------------------------------------------------
   Parser — riconoscimento euristico dei dati nel testo del contratto.
   Non pretende di essere infallibile: ogni campo trovato riporta il
   frammento di testo da cui proviene, così l'operatore può verificarlo
   e correggerlo nella maschera di revisione.
   --------------------------------------------------------------------- */
Modules.define('Parser', ['Util', 'Dominio'], (Util, Dominio) => {
  const MESI = { gennaio: 1, febbraio: 2, marzo: 3, aprile: 4, maggio: 5, giugno: 6, luglio: 7, agosto: 8, settembre: 9, ottobre: 10, novembre: 11, dicembre: 12 };
  const NUMERI = { un: 1, uno: 1, una: 1, due: 2, tre: 3, quattro: 4, cinque: 5, sei: 6, sette: 7, otto: 8, nove: 9, dieci: 10, undici: 11, dodici: 12, diciotto: 18, ventiquattro: 24, trentasei: 36 };
  const DATE_RE = new RegExp(String.raw`\b(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4}|\d{2})\b|\b(\d{1,2})\s*(?:°|º)?\s+(` + Object.keys(MESI).join('|') + String.raw`)\s+(\d{4})\b`, 'gi');

  /* --- codice fiscale e partita IVA, con verifica del carattere di controllo --- */
  const CF_ODD = { 0: 1, 1: 0, 2: 5, 3: 7, 4: 9, 5: 13, 6: 15, 7: 17, 8: 19, 9: 21, A: 1, B: 0, C: 5, D: 7, E: 9, F: 13, G: 15, H: 17, I: 19, J: 21, K: 2, L: 4, M: 18, N: 20, O: 11, P: 3, Q: 6, R: 8, S: 12, T: 14, U: 16, V: 10, W: 22, X: 25, Y: 24, Z: 23 };
  function cfValido(cf) {
    cf = String(cf || '').toUpperCase();
    if (!/^[A-Z0-9]{16}$/.test(cf)) return false;
    let sum = 0;
    for (let i = 0; i < 15; i++) {
      const c = cf[i];
      sum += i % 2 === 0 ? CF_ODD[c] : (/\d/.test(c) ? Number(c) : c.charCodeAt(0) - 65);
    }
    return String.fromCharCode(65 + (sum % 26)) === cf[15];
  }
  function pivaValida(p) {
    p = String(p || '');
    if (!/^\d{11}$/.test(p)) return false;
    let sum = 0;
    for (let i = 0; i < 11; i++) {
      let d = Number(p[i]);
      if (i % 2 === 1) { d *= 2; if (d > 9) d -= 9; }
      sum += d;
    }
    return sum % 10 === 0;
  }
  // Le cifre del CF possono essere sostituite da lettere (omocodia): L M N P Q R S T U V.
  const CF_RE = /\b([A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z])\b/gi;
  const PIVA_RE = /(?:p\.?\s?\.?\s?i(?:va|\.)|partita\s+i\.?v\.?a\.?|c\.?\s?f\.?\s*(?:e|\/)\s*p\.?\s?iva|codice\s+fiscale(?:\s+e\s+partita\s+iva)?|c\.f\.)\s*[:n.°]*\s*(?:IT)?\s*(\d{11})\b/gi;

  function findDates(text) {
    const out = []; let m;
    DATE_RE.lastIndex = 0;
    while ((m = DATE_RE.exec(text))) {
      let iso = null;
      if (m[1]) iso = Util.parseDate(`${m[1]}/${m[2]}/${m[3]}`);
      else iso = Util.parseDate(`${m[4]}/${MESI[m[5].toLowerCase()]}/${m[6]}`);
      if (iso) out.push({ iso, index: m.index, end: m.index + m[0].length, raw: m[0] });
    }
    return out;
  }
  /** Prima data che compare entro maxDist caratteri dopo una delle parole chiave. */
  function dateAfter(text, dates, keyRe, maxDist) {
    keyRe.lastIndex = 0; let m;
    while ((m = keyRe.exec(text))) {
      const from = m.index + m[0].length;
      const d = dates.find(x => x.index >= from && x.index - from <= maxDist);
      if (d) return { ...d, snippet: snippet(text, m.index, d.end) };
    }
    return null;
  }
  function snippet(text, a, b) { return text.slice(Math.max(0, a - 20), Math.min(text.length, b + 20)).replace(/\s+/g, ' ').trim(); }
  function wordNumber(s) { s = String(s).toLowerCase(); return /^\d+$/.test(s) ? Number(s) : (NUMERI[s] || null); }

  /* --- parti del contratto --- */
  const ROLE_RE = /\b(parte\s+locatrice|parte\s+conduttrice|locat(?:ore|rice|ori|rici)|conduttor[ei]|conduttrice|conduttrici|locatari[oae]|inquilin[oiae])\b/gi;
  const ruoloDa = (w) => /^(parte\s+locatrice|locat(?:ore|rice|ori|rici))$/i.test(w.replace(/\s+/g, ' ')) ? 'locatore' : 'conduttore';
  const STOP_NOMI = /^(contratto|locazione|tra|il|la|lo|i|le|sig|signor|signora|codice|fiscale|nato|nata|residente|via|piazza|corso|premesso|uso|abitativo|scrittura|privata|immobile|art|articolo)$/i;

  function pulisciNome(n) {
    n = String(n || '').replace(/\s+/g, ' ').trim()
      .replace(/\s*[,;(].*$/, '')
      .replace(/\s+(nat[oa]|resident[ei]|domiciliat[oa]|con\s+sede|c\.?\s?f\.?|codice|in\s+persona|p\.?\s?iva|cod\.?).*$/i, '')
      .replace(/^(la\s+)?(societ[aà]|ditta|impresa)\s+/i, '')
      .replace(/^(il|la|lo|i|le|e|ed|tra|fra)\s+/i, '')
      .trim();
    if (n.length < 3) return '';
    const isCompany = /(s\.?\s?r\.?\s?l|s\.?\s?p\.?\s?a|s\.?\s?n\.?\s?c|s\.?\s?a\.?\s?s|s\.?\s?s\.?$|coop)/i.test(n);
    if (!isCompany && n === n.toUpperCase()) n = Util.titleCase(n);
    return n;
  }
  function estraiNome(win) {
    const w = win.replace(/\s+/g, ' ');
    const lastMatch = (re) => { let m, last = null; re.lastIndex = 0; while ((m = re.exec(w))) last = m; return last; };
    const NOME = String.raw`([A-ZÀ-Ý][A-Za-zÀ-ÿ'’]+(?:\s+[A-ZÀ-Ý][A-Za-zÀ-ÿ'’]+){1,3})`;
    const company = lastMatch(/([A-Z0-9][A-Za-z0-9À-ÿ&.'’\- ]{1,60}?\s(?:s\.\s?r\.\s?l\.(?:\s?s\.)?|s\.?r\.?l\.?s?|s\.?p\.?a\.?|s\.?n\.?c\.?|s\.?a\.?s\.?|s\.s\.|soc(?:ietà)?\.?\s+coop(?:erativa)?\.?(?:\s+a\s+r\.?l\.?)?))(?![A-Za-z])/gi);
    if (company) return pulisciNome(company[1]);
    const TITOLO = String.raw`\b(?:[Ss]ig(?:\.ra|\.na|nor[ae]?|\.)?|SIG(?:\.RA|\.NA|NOR[AE]?|\.)?|[Dd]ott(?:\.ssa|oressa|ore|\.)?|DOTT(?:\.SSA|\.)?|[Aa]vv\.?|AVV\.?|[Ii]ng\.?|ING\.|[Gg]eom\.?|GEOM\.|[Rr]ag\.?|RAG\.|[Aa]rch\.?|ARCH\.)`;
    const titled = lastMatch(new RegExp(TITOLO + String.raw`\s+` + NOME, 'g'));
    if (titled) return pulisciNome(titled[1]);
    const label = lastMatch(/(?:locat\w+|conduttr?\w+|locatari\w)\s*[:\-–]\s*([^,;\n]{3,60})/gi);
    if (label) return pulisciNome(label[1]);
    const born = lastMatch(new RegExp(NOME + String.raw`\s*,?\s*nat[oa]\b`, 'g'));
    if (born) return pulisciNome(born[1]);
    const upper = lastMatch(/\b([A-ZÀ-Ý]{2,}(?:\s+[A-ZÀ-Ý'’]{2,}){1,3})\b/g);
    if (upper && !upper[1].split(/\s+/).some(t => STOP_NOMI.test(t))) return pulisciNome(upper[1]);
    return '';
  }

  function trovaParti(text, avvisi) {
    const head = text.slice(0, 8000);
    const ids = [];
    let m;
    CF_RE.lastIndex = 0;
    while ((m = CF_RE.exec(head))) ids.push({ value: m[1].toUpperCase(), kind: 'cf', index: m.index, end: m.index + m[0].length });
    PIVA_RE.lastIndex = 0;
    while ((m = PIVA_RE.exec(head))) {
      const idx = m.index + m[0].lastIndexOf(m[1]);
      ids.push({ value: m[1], kind: 'piva', index: idx, end: idx + 11 });
    }
    ids.sort((a, b) => a.index - b.index);
    // Più identificativi ravvicinati (C.F. e P.IVA della stessa società) diventano un solo soggetto.
    const gruppi = [];
    for (const id of ids) {
      const prev = gruppi[gruppi.length - 1];
      const gap = prev ? head.slice(prev.end, id.index) : '';
      const soloEtichette = gap.length < 60 && gap.replace(/c\.?\s?f\.?|p\.?\s?\.?\s?iva|partita\s+iva|codice\s+fiscale|\be\b|[\/:\s,.\-n°]/gi, '') === '';
      const near = prev && soloEtichette && !(prev.cf && id.kind === 'cf');
      if (near && !(prev.cf === id.value || prev.piva === id.value)) {
        if (id.kind === 'cf') prev.cf = id.value; else prev.piva = id.value;
        prev.end = id.end;
      } else if (!(near && (prev.cf === id.value || prev.piva === id.value))) {
        gruppi.push({ cf: id.kind === 'cf' ? id.value : null, piva: id.kind === 'piva' ? id.value : null, index: id.index, end: id.end });
      }
    }
    const markers = [];
    ROLE_RE.lastIndex = 0;
    while ((m = ROLE_RE.exec(head))) {
      const after = head.slice(m.index + m[0].length, m.index + m[0].length + 4);
      markers.push({ index: m.index, end: m.index + m[0].length, ruolo: ruoloDa(m[1]), label: /^\s*[:\-–]/.test(after) });
    }
    const parti = []; const visti = new Set();
    gruppi.forEach((g, i) => {
      const key = g.cf || g.piva;
      if (visti.has(key)) return;
      const prevEnd = i > 0 ? gruppi[i - 1].end : 0;
      const nextStart = i < gruppi.length - 1 ? gruppi[i + 1].index : head.length;
      const before = head.slice(Math.max(prevEnd, g.index - 120), g.index);
      // Il legale rappresentante di una società non è una parte autonoma.
      if (/(legale\s+rappresentante|in\s+persona\s+d|amministrator\w+|procurator\w+|rappresentata\s+da)/i.test(before) && parti.length) {
        const last = parti[parti.length - 1];
        last.note = 'Rappresentante: ' + (estraiNome(head.slice(Math.max(prevEnd, g.index - 200), g.index)) || '') + ' (' + key + ')';
        visti.add(key);
        return;
      }
      visti.add(key);
      let ruolo = null, fonte = '';
      const label = markers.filter(x => x.label && x.index >= Math.max(prevEnd, g.index - 300) && x.index < g.index).pop();
      const dopo = markers.find(x => !x.label && x.index > g.end && x.index < Math.min(nextStart, g.end + 400));
      const prima = markers.filter(x => x.index < g.index && x.index >= g.index - 300).pop();
      if (label) { ruolo = label.ruolo; fonte = 'etichetta'; }
      else if (dopo) { ruolo = dopo.ruolo; fonte = 'denominazione successiva'; }
      else if (prima) { ruolo = prima.ruolo; fonte = 'riferimento precedente'; }
      const nomeWin = head.slice(Math.max(prevEnd, g.index - 260), g.index);
      const denominazione = estraiNome(nomeWin);
      parti.push({
        ruolo, fonte, denominazione,
        tipo: g.cf && !/^\d{11}$/.test(g.cf) ? 'PF' : 'PG',
        codice_fiscale: g.cf || g.piva, partita_iva: g.piva || (g.cf && /^\d{11}$/.test(g.cf) ? g.cf : null),
        snippet: snippet(head, Math.max(prevEnd, g.index - 120), g.end)
      });
    });
    // Ruolo non determinato: nei contratti la prima parte citata è di norma il locatore.
    parti.forEach((p, i) => {
      if (!p.ruolo) {
        p.ruolo = parti.some(x => x.ruolo === 'locatore') ? 'conduttore' : (i === 0 ? 'locatore' : 'conduttore');
        p.fonte = 'ordine di comparizione';
        avvisi.push(`Ruolo di ${p.denominazione || p.codice_fiscale} dedotto dall'ordine nel testo: verificare.`);
      }
      if (p.codice_fiscale && p.codice_fiscale.length === 16 && !cfValido(p.codice_fiscale)) avvisi.push(`Codice fiscale ${p.codice_fiscale}: carattere di controllo non valido (possibile errore OCR).`);
      if (p.partita_iva && !pivaValida(p.partita_iva)) avvisi.push(`Partita IVA ${p.partita_iva} non valida (possibile errore OCR).`);
      if (!p.denominazione) avvisi.push(`Nome non riconosciuto per ${p.codice_fiscale}.`);
    });
    return parti;
  }

  /* --- campi contrattuali --- */
  function trovaTipologia(t) {
    const low = t.toLowerCase();
    const has = (re) => re.test(low);
    if (has(/transitori[ao]/) && !has(/non\s+(?:ha\s+)?(?:natura\s+)?transitori/)) return { v: 'transitorio', why: 'cita la natura transitoria' };
    if (has(/student[ie]\s+universitar/)) return { v: 'studenti', why: 'studenti universitari' };
    if (has(/\b3\s*\+\s*2\b|tre\s*\+\s*due|canone\s+concordato|art(?:icolo)?\.?\s*2,?\s*(?:comma|c\.)\s*3\b|accordo\s+territoriale/)) return { v: '3+2', why: '3+2 / canone concordato' };
    if (has(/\b4\s*\+\s*4\b|quattro\s*\+\s*quattro|art(?:icolo)?\.?\s*2,?\s*(?:comma|c\.)\s*1\b/)) return { v: '4+4', why: '4+4' };
    if (has(/\b9\s*\+\s*9\b|alberghier/)) return { v: '9+9', why: '9+9 / alberghiero' };
    if (has(/\b6\s*\+\s*6\b|sei\s*\+\s*sei|legge\s*(?:n\.\s*)?392|l\.\s*392|uso\s+(?:diverso|commerciale|non\s+abitativo)/)) return { v: '6+6', why: 'uso diverso / L. 392/78' };
    const d = low.match(/durata\s+(?:di\s+)?(?:anni\s+(\d+|uno|due|tre|quattro|cinque|sei|nove)|(\d+|uno|due|tre|quattro|cinque|sei|nove)\s*(?:\(\w+\)\s*)?anni)/);
    if (d) {
      const n = wordNumber(d[1] || d[2]);
      if (n === 4) return { v: '4+4', why: 'durata 4 anni' };
      if (n === 3) return { v: '3+2', why: 'durata 3 anni' };
      if (n === 6) return { v: '6+6', why: 'durata 6 anni' };
      if (n === 9) return { v: '9+9', why: 'durata 9 anni' };
    }
    if (has(/affitto\s+di\s+fondo|fondo\s+rustico|terreno\s+agricolo/)) return { v: 'libero', why: 'affitto di fondo rustico' };
    return null;
  }
  function trovaCategoria(t) {
    const m = t.match(/(?:categoria|cat\.)\s*(?:catastale\s*)?[:\s]*([A-F])\s*\/?\s*(\d{1,2})\b/i);
    if (m) {
      const cat = `${m[1].toUpperCase()}/${Number(m[2])}`;
      return { catastale: cat, fiscale: Dominio.categoriaDaCatastale(cat), snippet: m[0] };
    }
    const low = t.toLowerCase();
    if (/terreno\s+agricolo|fondo\s+rustico|uso\s+agricolo/.test(low)) return { fiscale: 'terreno_agricolo', snippet: 'terreno agricolo' };
    if (/terreno|area\s+edificabile/.test(low) && !/fabbricato|appartamento/.test(low)) return { fiscale: 'terreno_non_agricolo', snippet: 'terreno' };
    if (/uso\s+(?:diverso|commerciale|ufficio|non\s+abitativo)|negozio|capannone|laboratorio/.test(low)) return { fiscale: 'non_abitativo', snippet: 'uso non abitativo' };
    if (/uso\s+abitativo|ad\s+uso\s+di\s+abitazione|abitazione|appartamento/.test(low)) return { fiscale: 'abitativo', snippet: 'uso abitativo' };
    return null;
  }
  function trovaRegime(t, tipologia) {
    const low = t.toLowerCase().replace(/\s+/g, ' ');
    const idx = low.search(/cedolare\s+secca/);
    if (idx >= 0) {
      const ctx = low.slice(Math.max(0, idx - 80), idx);
      const negata = /\bnon\s+(?:intende\s+)?(?:opta|optare|esercita|esercitare|aderisce|aderire|si\s+avvale)\b/.test(ctx);
      if (!negata) {
        const dieci = /10\s*%|dieci\s+per\s+cento|aliquota\s+(?:ridotta|agevolata)/.test(low.slice(idx, idx + 200));
        return { v: dieci || tipologia === '3+2' ? 'cedolare_10' : 'cedolare_21', snippet: snippet(t.replace(/\s+/g, ' '), idx, idx + 40) };
      }
    }
    if (/esente\s+(?:da\s+)?iva|esenzione\s+iva|art\.?\s*10.{0,30}633/.test(low)) return { v: 'iva_esente', iva: true, snippet: 'esente IVA' };
    if (/oltre\s+(?:l')?iva|\+\s*iva|iva\s+(?:di\s+legge|al\s+22|22\s*%)|imponibile\s+(?:ai\s+fini\s+)?iva|assoggettat\w+\s+ad?\s+iva|opzione\s+per\s+l'imponibilit/.test(low)) return { v: 'iva_imponibile', iva: true, snippet: 'IVA applicata al canone' };
    return { v: 'ordinaria', snippet: 'nessuna opzione per cedolare o IVA rilevata', debole: true };
  }
  function trovaCanone(t) {
    const flat = t.replace(/\s+/g, ' ');
    const res = [
      /canone[^€\d]{0,140}?(?:€|euro|eur\.?)\s*([\d.]+(?:,\d{1,2})?)/i,
      /canone[^.€]{0,140}?([\d.]+,\d{2})\s*(?:€|euro)/i
    ];
    for (const re of res) {
      const m = flat.match(re);
      if (m) {
        const val = Util.parseNumber(m[1]);
        if (!val) continue;
        const ctx = flat.slice(m.index, m.index + m[0].length + 80).toLowerCase();
        const mensile = /mensil|al\s+mese|per\s+mese|mese/.test(ctx) && !/annu/.test(ctx.slice(0, m[0].length + 20));
        const annuo = /annu|all'anno|per\s+anno/.test(ctx);
        let annuale = val, nota = '';
        if (mensile && !annuo) { annuale = val * 12; nota = 'mensile × 12'; }
        else if (!annuo && val < 3000) { annuale = val * 12; nota = 'periodicità non indicata: interpretato come mensile'; }
        return { value: Math.round(annuale * 100) / 100, snippet: snippet(flat, m.index, m.index + m[0].length), nota };
      }
    }
    return null;
  }
  function trovaImporto(t, re) {
    const m = t.replace(/\s+/g, ' ').match(re);
    return m ? Util.parseNumber(m[1]) : null;
  }
  function trovaImmobile(t) {
    const flat = t.replace(/\s+/g, ' ');
    const out = {};
    const m = flat.match(/(?:sit[oa]|ubicat[oa]|post[oa]|situat[oa])\s+(?:nel\s+comune\s+di\s+|in\s+)((?:[^;()]|\([A-Z]{2}\)){5,140}?)(?=,?\s*(?:piano|identificat|censit|distint|compost|al\s+catasto|n\.c\.e\.u|foglio|fg\.|scala|interno|int\.|costituit|categoria|cat\.|e\s+precisamente)|[;)]|\((?![A-Z]{2}\))|\.\s+[A-Z])/i);
    if (m) {
      const raw = m[1].trim().replace(/,$/, '');
      const parts = raw.match(/^(?:comune\s+di\s+)?([A-ZÀ-Ý][A-Za-zÀ-ÿ'’ ]{1,40}?)\s*(?:\(([A-Z]{2})\))?\s*,\s*((?:via|viale|piazza|piazzale|corso|largo|vicolo|strada|contrada|località|loc\.|frazione|fraz\.|borgo|calle|campo|riviera|salita|lungomare|lungo)\b.+)$/i);
      if (parts) { out.comune = Util.titleCase(parts[1].trim()); if (parts[2]) out.provincia = parts[2].toUpperCase(); out.indirizzo = parts[3].trim(); }
      else {
        const inv = raw.match(/^((?:via|viale|piazza|piazzale|corso|largo|vicolo|strada|contrada|località|loc\.)\b[^,]+(?:,\s*n\.?\s*\d+\w*)?)\s*,?\s*(?:a|in|nel\s+comune\s+di)?\s*([A-ZÀ-Ý][A-Za-zÀ-ÿ'’ ]{1,40}?)?\s*(?:\(([A-Z]{2})\))?$/i);
        if (inv) { out.indirizzo = inv[1].trim(); if (inv[2]) out.comune = Util.titleCase(inv[2].trim()); if (inv[3]) out.provincia = inv[3].toUpperCase(); }
        else out.indirizzo = raw;
      }
      out.snippet = m[0].slice(0, 160);
    }
    const fg = flat.match(/\b(?:foglio|fg\.?)\s*(?:n\.?\s*)?(\d+)/i); if (fg) out.foglio = fg[1];
    const pa = flat.match(/\b(?:particella|part\.|mappale|mapp\.|map\.|num\.)\s*(?:n\.?\s*)?(\d+)/i); if (pa) out.particella = pa[1];
    const sub = flat.match(/\b(?:subalterno|sub\.?)\s*(?:n\.?\s*)?(\d+)/i); if (sub) out.subalterno = sub[1];
    const ren = flat.match(/rendita\s+(?:catastale\s+)?(?:di\s+)?(?:€|euro)?\s*([\d.]+,\d{2})/i); if (ren) out.rendita = Util.parseNumber(ren[1]);
    return out;
  }

  /**
   * Analizza il testo e restituisce i dati proposti per la maschera.
   * @returns {{contratto:object, immobile:object, parti:object[], trovati:Object<string,string>, avvisi:string[]}}
   */
  function parse(text) {
    const avvisi = []; const trovati = {};
    const t = String(text || '');
    const dates = findDates(t);
    const contratto = {}; const immobile = {};

    const tip = trovaTipologia(t);
    if (tip) { contratto.tipologia = tip.v; trovati.tipologia = tip.why; }
    const cat = trovaCategoria(t);
    if (cat) { immobile.categoria_fiscale = cat.fiscale; if (cat.catastale) immobile.categoria_catastale = cat.catastale; trovati.categoria_fiscale = cat.snippet; }
    if (!contratto.tipologia && cat && ['non_abitativo', 'strumentale'].includes(cat.fiscale)) { contratto.tipologia = '6+6'; trovati.tipologia = 'dedotta dall\'uso non abitativo'; }
    const reg = trovaRegime(t, contratto.tipologia);
    contratto.regime_fiscale = reg.v; trovati.regime_fiscale = reg.snippet;
    if (reg.debole) avvisi.push('Regime fiscale non indicato nel testo: impostato "tassazione ordinaria", verificare.');
    contratto.soggetto_iva = reg.iva ? 1 : 0;
    if (reg.iva) trovati.soggetto_iva = reg.snippet;

    // Date: prima il costrutto "dal ... al ...", poi le parole chiave.
    const range = t.replace(/\s+/g, ' ').match(new RegExp(String.raw`dal\s+(?:giorno\s+)?(` + DATE_RE.source + String.raw`)\s*(?:e\s+)?(?:al|fino\s+al|sino\s+al|e\s+terminer[àa]\s+il)\s+(?:giorno\s+)?(` + DATE_RE.source + ')', 'i'));
    if (range) {
      const ds = findDates(range[0]);
      if (ds.length >= 2) { contratto.data_inizio = ds[0].iso; contratto.data_scadenza = ds[1].iso; trovati.data_inizio = trovati.data_scadenza = range[0]; }
    }
    if (!contratto.data_inizio) {
      const d = dateAfter(t, dates, /(decorr\w*|con\s+inizio|a\s+partire\s+da[l]?|avr[àa]\s+inizio|ha\s+inizio|inizio\s+(?:della\s+)?locazione|con\s+effetto\s+da[l]?)/gi, 80)
        || dateAfter(t, dates, /\bdal\b/gi, 15);
      if (d) { contratto.data_inizio = d.iso; trovati.data_inizio = d.snippet; }
    }
    if (!contratto.data_scadenza) {
      const d = dateAfter(t, dates, /(scadenz\w*|scadr[àa]|terminer[àa]|fino\s+al|sino\s+al|termine\s+(?:il|del|al))/gi, 60);
      if (d && (!contratto.data_inizio || d.iso > contratto.data_inizio)) { contratto.data_scadenza = d.iso; trovati.data_scadenza = d.snippet; }
    }
    const stip = dateAfter(t, dates, /(letto,?\s+confermato|fatto,?\s+letto|sottoscritt\w*|addì|\blì(?![a-z])|\bli,)/gi, 60)
      || dateAfter(t, dates, /(stipulat\w*\s+(?:in\s+data|il)|in\s+data)/gi, 30);
    if (stip) { contratto.data_stipula = stip.iso; trovati.data_stipula = stip.snippet; }

    // Durata
    const NUM = '(\d+|uno|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|undici|dodici|diciotto|ventiquattro|trentasei)';
    const dmRaw = t.match(new RegExp(String.raw`durata\s+(?:di\s+)?(?:(mesi|anni)\s+` + NUM + String.raw`|` + NUM + String.raw`\s*(?:\(\w+\)\s*)?(mesi|anni))`, 'i'));
    const dm = dmRaw ? [dmRaw[0], dmRaw[2] || dmRaw[3], dmRaw[1] || dmRaw[4]] : null;
    const tdef = Dominio.tipologia(contratto.tipologia);
    if (dm) {
      const n = wordNumber(dm[1]);
      if (n) { contratto.durata_mesi = /anni/i.test(dm[2]) ? n * 12 : n; trovati.durata_mesi = dm[0]; }
    }
    if (contratto.tipologia && !['transitorio', 'studenti', 'libero'].includes(contratto.tipologia)) contratto.durata_mesi = tdef.durata;
    if (!contratto.durata_mesi && contratto.data_inizio && contratto.data_scadenza) {
      contratto.durata_mesi = Math.max(1, Math.round(Util.diffDays(contratto.data_inizio, Util.addDays(contratto.data_scadenza, 1)) / 30.44));
    }
    if (!contratto.durata_mesi && contratto.tipologia) contratto.durata_mesi = tdef.durata;
    contratto.durata_rinnovo_mesi = contratto.tipologia ? (contratto.tipologia === 'studenti' || contratto.tipologia === 'libero' ? contratto.durata_mesi : tdef.rinnovo) : null;
    contratto.preavviso_mesi = contratto.tipologia ? tdef.preavviso : null;
    if (contratto.data_inizio && !contratto.data_scadenza && contratto.durata_mesi) {
      contratto.data_scadenza = Dominio.calcolaScadenza(contratto.data_inizio, contratto.durata_mesi);
      trovati.data_scadenza = 'calcolata da inizio + durata';
      avvisi.push('Data di scadenza non trovata nel testo: calcolata da inizio e durata.');
    }

    const can = trovaCanone(t);
    if (can) { contratto.canone_annuo = can.value; trovati.canone_annuo = can.snippet + (can.nota ? ' (' + can.nota + ')' : ''); if (can.nota.startsWith('periodicità')) avvisi.push('Canone: periodicità non indicata, interpretato come mensile.'); }
    const dep = trovaImporto(t, /deposito\s+cauzionale[^€\d]{0,100}?(?:€|euro)\s*([\d.]+(?:,\d{1,2})?)/i);
    if (dep) { contratto.deposito_cauzionale = dep; trovati.deposito_cauzionale = 'deposito cauzionale'; }
    if (!Dominio.isCedolare(contratto.regime_fiscale) && /istat|indice\s+dei\s+prezzi|variazion\w+\s+.{0,40}prezzi\s+al\s+consumo/i.test(t)) { contratto.aggiornamento_istat = 1; trovati.aggiornamento_istat = 'clausola ISTAT'; }

    const reg2 = t.replace(/\s+/g, ' ').match(/registrat\w+\s+(?:presso\s+)?[^.]{0,80}?(?:il|in\s+data)\s+(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})[^.]{0,60}?(?:al\s+)?n(?:\.|umero)\s*°?\s*(\w+)(?:[^.]{0,20}?serie\s*(\w+))?/i);
    if (reg2) { contratto.data_registrazione = Util.parseDate(reg2[1]); contratto.estremi_registrazione = `n. ${reg2[2]}${reg2[3] ? ' serie ' + reg2[3] : ''}`; trovati.data_registrazione = reg2[0].slice(0, 120); }

    Object.assign(immobile, trovaImmobile(t));
    if (immobile.snippet) { trovati.indirizzo = immobile.snippet; delete immobile.snippet; }
    const parti = trovaParti(t, avvisi);
    if (!parti.some(p => p.ruolo === 'locatore')) avvisi.push('Locatore non riconosciuto.');
    if (!parti.some(p => p.ruolo === 'conduttore')) avvisi.push('Conduttore non riconosciuto.');
    if (!contratto.tipologia) avvisi.push('Tipologia contrattuale non riconosciuta.');
    if (!contratto.data_inizio) avvisi.push('Data di inizio non trovata.');
    if (t.trim().length < 200) avvisi.push('Testo estratto molto breve: documento illeggibile o scansione di bassa qualità.');
    return { contratto, immobile, parti, trovati, avvisi };
  }
  return { parse, findDates, cfValido, pivaValida, estraiNome };
});

/* ---------------------------------------------------------------------
   FolderImport — selezione cartella, scansione dei file, estrazione e
   analisi. I risultati finiscono nella tabella documenti con stato
   'da_verificare': il contratto viene creato solo dopo la revisione.
   - Chrome/Edge: showDirectoryPicker, la cartella resta memorizzata e si
     può "ricontrollare" per trovare i nuovi file.
   - Firefox/Safari: input con attributo webkitdirectory (sola lettura).
   --------------------------------------------------------------------- */
Modules.define('FolderImport', ['Extract', 'Parser', 'Repo', 'Store', 'Prefs', 'Util', 'Log', 'Ambiente'], (Extract, Parser, Repo, Store, Prefs, Util, Log, Ambiente) => {
  const sessionFiles = new Map(); // percorso → File, per riaprire l'originale durante la sessione
  let cancelled = false;
  const supportsPicker = () => Ambiente.dirAccess;

  async function walk(dirHandle, prefix, out) {
    for await (const [name, handle] of dirHandle.entries()) {
      const path = prefix ? prefix + '/' + name : name;
      if (handle.kind === 'directory') await walk(handle, path, out);
      else if (Extract.isSupported(name)) out.push({ path, file: await handle.getFile() });
    }
    return out;
  }
  async function scanHandle(handle) {
    const entries = await walk(handle, handle.name, []);
    entries.forEach(e => sessionFiles.set(e.path, e.file));
    return entries;
  }
  /** Va chiamata da un click (i browser richiedono un gesto dell'utente). */
  async function pickFolder() {
    if (supportsPicker()) {
      const handle = await window.showDirectoryPicker({ id: 'contratti', mode: 'read' });
      await Store.set('import.dirHandle', handle);
      return { name: handle.name, entries: await scanHandle(handle) };
    }
    const input = document.getElementById('hidden-dir-input');
    return new Promise((resolve) => {
      input.value = '';
      input.onchange = () => {
        const entries = [...input.files].filter(f => Extract.isSupported(f.name)).map(f => ({ path: f.webkitRelativePath || f.name, file: f }));
        entries.forEach(e => sessionFiles.set(e.path, e.file));
        resolve({ name: entries.length ? entries[0].path.split('/')[0] : '', entries });
      };
      input.click();
    });
  }
  async function savedFolder() { return supportsPicker() ? Store.get('import.dirHandle') : null; }
  async function rescan() {
    const handle = await savedFolder();
    if (!handle) throw new Error('Nessuna cartella memorizzata');
    if ((await handle.requestPermission({ mode: 'read' })) !== 'granted') throw new Error('Permesso di lettura negato');
    return { name: handle.name, entries: await scanHandle(handle) };
  }
  /** Recupera il file originale (sessione corrente o cartella memorizzata). */
  async function getFile(percorso) {
    if (sessionFiles.has(percorso)) return sessionFiles.get(percorso);
    const handle = await savedFolder();
    if (!handle) return null;
    if ((await handle.queryPermission({ mode: 'read' })) !== 'granted' && (await handle.requestPermission({ mode: 'read' })) !== 'granted') return null;
    const segs = percorso.split('/');
    if (segs[0] !== handle.name) return null;
    let dir = handle;
    try {
      for (const s of segs.slice(1, -1)) dir = await dir.getDirectoryHandle(s);
      return await (await dir.getFileHandle(segs[segs.length - 1])).getFile();
    } catch (e) { return null; }
  }

  /**
   * Elabora i file: salta quelli già presenti (stessa impronta), estrae e
   * analizza gli altri. onItem(entry, esito) viene chiamata per ogni file.
   */
  async function process(entries, { onProgress, onItem } = {}) {
    cancelled = false;
    const opts = { ocr: Prefs.get('ocrAttivo'), maxPages: Prefs.get('ocrMaxPagine') };
    const summary = { nuovi: 0, giaPresenti: 0, errori: 0 };
    try {
      for (let i = 0; i < entries.length; i++) {
        if (cancelled) break;
        const { path, file } = entries[i];
        const report = (msg, frac) => onProgress && onProgress({ index: i, total: entries.length, file: path, msg, frac: (i + (frac || 0)) / entries.length });
        report('Calcolo impronta', 0);
        let impronta;
        try { impronta = await Util.sha256Hex(await file.arrayBuffer()); }
        catch (e) { Log.fromError('FolderImport', e, 'Lettura ' + path); summary.errori++; onItem && onItem({ path, esito: 'errore', messaggio: e.message }); continue; }
        const existing = Repo.documentoByImpronta(impronta);
        if (existing && existing.stato !== 'errore') { summary.giaPresenti++; onItem && onItem({ path, esito: 'gia_presente', stato: existing.stato, id: existing.id }); continue; }
        const base = { nome_file: file.name, percorso: path, dimensione: file.size, ultima_modifica: file.lastModified ? new Date(file.lastModified).toISOString() : null, impronta };
        try {
          report('Estrazione testo', 0.05);
          const ex = await Extract.extract(file, { ...opts, onProgress: (msg, f) => report(msg, 0.05 + f * 0.9) });
          report('Analisi', 0.95);
          const dati = Parser.parse(ex.text);
          if (!dati.contratto.codice) dati.contratto.codice = file.name.replace(/\.[^.]+$/, '').slice(0, 40);
          const id = await Repo.salvaDocumento({ ...base, testo_estratto: ex.text, metodo_estrazione: ex.method, dati_estratti: JSON.stringify(dati), stato: 'da_verificare', messaggio: dati.avvisi.length ? dati.avvisi.length + ' avvisi' : null });
          summary.nuovi++;
          onItem && onItem({ path, esito: 'nuovo', id, metodo: ex.method, avvisi: dati.avvisi.length });
        } catch (e) {
          Log.fromError('FolderImport', e, 'Elaborazione ' + path);
          summary.errori++;
          await Repo.salvaDocumento({ ...base, testo_estratto: null, metodo_estrazione: null, dati_estratti: null, stato: 'errore', messaggio: e.message });
          onItem && onItem({ path, esito: 'errore', messaggio: e.message });
        }
      }
    } finally {
      await Extract.release();
    }
    summary.annullato = cancelled;
    return summary;
  }
  return { pickFolder, rescan, savedFolder, process, getFile, cancel: () => { cancelled = true; }, supportsPicker };
});
</script>
<script>
'use strict';
/* ---------------------------------------------------------------------
   ImportExport — esportazione/importazione completa (JSON) e tabellare
   (CSV, separatore ';', date GG/MM/AAAA per Excel italiano).
   --------------------------------------------------------------------- */
Modules.define('ImportExport', ['Db', 'Repo', 'Util', 'Dominio', 'Migrations', 'Config'], (Db, Repo, Util, Dominio, Migrations, Config) => {
  const TABELLE = ['soggetti', 'immobili', 'contratti', 'contratto_parti', 'scadenze', 'rinnovi', 'documenti', 'impostazioni'];

  function exportJSON({ includiTesti = true } = {}) {
    const tabelle = {};
    for (const t of TABELLE) {
      tabelle[t] = Db.all(`SELECT * FROM ${t}`);
      if (t === 'documenti' && !includiTesti) tabelle[t].forEach(d => { d.testo_estratto = null; });
    }
    return { formato: 'contratti-locazione', versione_app: Config.APP_VERSION, versione_schema: Migrations.latest(), esportato_il: new Date().toISOString(), tabelle };
  }

  /**
   * mode 'sostituisci': svuota e reinserisce mantenendo gli id.
   * mode 'unisci': aggiunge i record con nuovi id, rimappando i riferimenti;
   * i soggetti con lo stesso CF/P.IVA e i documenti con la stessa impronta non vengono duplicati.
   */
  function importJSON(obj, mode) {
    if (!obj || obj.formato !== 'contratti-locazione' || !obj.tabelle) throw new Error('File JSON non riconosciuto: manca il formato "contratti-locazione"');
    if (obj.versione_schema > Migrations.latest()) throw new Error(`Il file proviene da una versione più recente (schema ${obj.versione_schema}): aggiornare l'app`);
    return Db.write(() => {
      const cols = Object.fromEntries(TABELLE.map(t => [t, Db.tableColumns(t)]));
      const insert = (t, row, skipId) => {
        const keys = Object.keys(row).filter(k => cols[t].includes(k) && !(skipId && k === 'id'));
        return Db.run(`INSERT INTO ${t} (${keys.join(', ')}) VALUES (${keys.map(() => '?').join(', ')})`, keys.map(k => row[k])).lastId;
      };
      const T = obj.tabelle;
      const counts = {};
      if (mode === 'sostituisci') {
        [...TABELLE].reverse().forEach(t => Db.run(`DELETE FROM ${t}`));
        for (const t of TABELLE) { (T[t] || []).forEach(r => insert(t, r, false)); counts[t] = (T[t] || []).length; }
        return counts;
      }
      const map = { soggetti: {}, immobili: {}, contratti: {} };
      for (const s of T.soggetti || []) {
        const ex = (s.codice_fiscale && Db.one('SELECT id FROM soggetti WHERE upper(codice_fiscale) = upper(?)', [s.codice_fiscale])) || (s.partita_iva && Db.one('SELECT id FROM soggetti WHERE partita_iva = ?', [s.partita_iva]));
        map.soggetti[s.id] = ex ? ex.id : insert('soggetti', s, true);
      }
      for (const i of T.immobili || []) map.immobili[i.id] = insert('immobili', i, true);
      for (const c of T.contratti || []) map.contratti[c.id] = insert('contratti', { ...c, immobile_id: map.immobili[c.immobile_id] || null }, true);
      for (const p of T.contratto_parti || []) {
        if (map.contratti[p.contratto_id] && map.soggetti[p.soggetto_id]) Db.run('INSERT OR IGNORE INTO contratto_parti (contratto_id, soggetto_id, ruolo, quota) VALUES (?,?,?,?)', [map.contratti[p.contratto_id], map.soggetti[p.soggetto_id], p.ruolo, p.quota]);
      }
      for (const s of T.scadenze || []) insert('scadenze', { ...s, contratto_id: s.contratto_id ? (map.contratti[s.contratto_id] || null) : null }, true);
      for (const r of T.rinnovi || []) if (map.contratti[r.contratto_id]) insert('rinnovi', { ...r, contratto_id: map.contratti[r.contratto_id] }, true);
      for (const d of T.documenti || []) {
        if (d.impronta && Db.one('SELECT id FROM documenti WHERE impronta = ?', [d.impronta])) continue;
        insert('documenti', { ...d, contratto_id: d.contratto_id ? (map.contratti[d.contratto_id] || null) : null }, true);
      }
      TABELLE.forEach(t => { counts[t] = (T[t] || []).length; });
      return counts;
    });
  }

  /* --- CSV --- */
  const partiToText = (parti, ruolo) => parti.filter(p => p.ruolo === ruolo).map(p => p.denominazione + (p.codice_fiscale ? ` [${p.codice_fiscale}]` : '')).join(' | ');
  function textToParti(text, ruolo) {
    return String(text || '').split('|').map(s => s.trim()).filter(Boolean).map(s => {
      const m = s.match(/^(.*?)\s*\[([^\]]+)\]\s*$/);
      const nome = m ? m[1].trim() : s;
      const code = m ? m[2].trim().toUpperCase() : '';
      return { ruolo, denominazione: nome, codice_fiscale: code || null, partita_iva: /^\d{11}$/.test(code) ? code : null, tipo: /^\d{11}$/.test(code) ? 'PG' : 'PF' };
    });
  }
  const COL_CONTRATTI = [
    { key: 'id' }, { key: 'codice' }, { key: 'stato' }, { key: 'tipologia' }, { key: 'regime_fiscale' },
    { key: 'soggetto_iva', get: r => r.soggetto_iva ? 'si' : 'no' },
    { key: 'data_stipula', get: r => Util.fmtDate(r.data_stipula) }, { key: 'data_inizio', get: r => Util.fmtDate(r.data_inizio) }, { key: 'data_scadenza', get: r => Util.fmtDate(r.data_scadenza) },
    { key: 'durata_mesi' }, { key: 'durata_rinnovo_mesi' }, { key: 'preavviso_mesi' },
    { key: 'canone_annuo', get: r => Util.fmtNumberIT(r.canone_annuo) }, { key: 'deposito_cauzionale', get: r => Util.fmtNumberIT(r.deposito_cauzionale) },
    { key: 'aggiornamento_istat', get: r => r.aggiornamento_istat ? 'si' : 'no' },
    { key: 'data_registrazione', get: r => Util.fmtDate(r.data_registrazione) }, { key: 'estremi_registrazione' },
    { key: 'immobile_indirizzo', get: r => r.imm.indirizzo }, { key: 'immobile_comune', get: r => r.imm.comune }, { key: 'immobile_provincia', get: r => r.imm.provincia },
    { key: 'categoria_fiscale', get: r => r.imm.categoria_fiscale }, { key: 'categoria_catastale', get: r => r.imm.categoria_catastale },
    { key: 'foglio', get: r => r.imm.foglio }, { key: 'particella', get: r => r.imm.particella }, { key: 'subalterno', get: r => r.imm.subalterno },
    { key: 'rendita', get: r => Util.fmtNumberIT(r.imm.rendita) },
    { key: 'locatori', get: r => partiToText(r.parti, 'locatore') }, { key: 'conduttori', get: r => partiToText(r.parti, 'conduttore') },
    { key: 'note' }
  ];
  function exportCSV(kind) {
    if (kind === 'contratti') {
      const rows = Db.all('SELECT * FROM contratti ORDER BY id').map(c => ({
        ...c,
        imm: (c.immobile_id && Db.one('SELECT * FROM immobili WHERE id = ?', [c.immobile_id])) || {},
        parti: Db.all('SELECT p.ruolo, s.denominazione, s.codice_fiscale FROM contratto_parti p JOIN soggetti s ON s.id = p.soggetto_id WHERE p.contratto_id = ?', [c.id])
      }));
      return Util.toCSV(rows, COL_CONTRATTI);
    }
    if (kind === 'scadenze') {
      const rows = Db.all('SELECT s.*, c.codice FROM scadenze s LEFT JOIN contratti c ON c.id = s.contratto_id ORDER BY s.data');
      return Util.toCSV(rows, [
        { key: 'id' }, { key: 'codice', header: 'contratto' }, { key: 'data', get: r => Util.fmtDate(r.data) },
        { key: 'tipo', get: r => Dominio.label(Dominio.TIPI_SCADENZA, r.tipo) }, { key: 'descrizione' },
        { key: 'importo', get: r => Util.fmtNumberIT(r.importo) }, { key: 'completata', get: r => r.completata ? 'si' : 'no' },
        { key: 'data_completamento', get: r => Util.fmtDate(r.data_completamento) }, { key: 'completata_da' }, { key: 'note' }
      ]);
    }
    if (kind === 'soggetti') {
      return Util.toCSV(Db.all('SELECT * FROM soggetti ORDER BY denominazione'), ['id', 'tipo', 'denominazione', 'codice_fiscale', 'partita_iva', 'indirizzo', 'email', 'telefono', 'note'].map(key => ({ key })));
    }
    throw new Error('Tipo di esportazione sconosciuto: ' + kind);
  }
  /**
   * Importa contratti da CSV con le stesse colonne dell'esportazione.
   * Se la colonna id corrisponde a un contratto esistente, questo viene aggiornato; altrimenti viene creato.
   */
  function importCSVContratti(text) {
    const rows = Util.parseCSV(text);
    if (!rows.length) throw new Error('Il file CSV non contiene righe');
    const sino = (v) => /^(s[iì]|yes|1|true|x)$/i.test(String(v || '').trim()) ? 1 : 0;
    const int = (v) => { const n = Util.parseNumber(v); return n == null ? null : Math.round(n); };
    return Db.write(() => {
      const esito = { creati: 0, aggiornati: 0, errori: [] };
      rows.forEach((r, i) => {
        try {
          const tipologia = Dominio.normalizza(Dominio.TIPOLOGIE, r.tipologia);
          const regime = Dominio.normalizza(Dominio.REGIMI, r.regime_fiscale);
          if (!tipologia) throw new Error(`tipologia "${r.tipologia}" non riconosciuta`);
          if (!regime) throw new Error(`regime fiscale "${r.regime_fiscale}" non riconosciuto`);
          const id = r.id && Db.one('SELECT id, updated_at FROM contratti WHERE id = ?', [Number(r.id)]);
          const t = Dominio.tipologia(tipologia);
          const inizio = Util.parseDate(r.data_inizio);
          const durata = int(r.durata_mesi) || t.durata;
          const data = {
            contratto: {
              id: id ? id.id : undefined, codice: r.codice || null, stato: Dominio.normalizza(Dominio.STATI, r.stato) || 'attivo', tipologia, regime_fiscale: regime,
              soggetto_iva: sino(r.soggetto_iva), data_stipula: Util.parseDate(r.data_stipula), data_inizio: inizio,
              data_scadenza: Util.parseDate(r.data_scadenza) || Dominio.calcolaScadenza(inizio, durata),
              durata_mesi: durata, durata_rinnovo_mesi: int(r.durata_rinnovo_mesi) ?? t.rinnovo, preavviso_mesi: int(r.preavviso_mesi) ?? t.preavviso,
              canone_annuo: Util.parseNumber(r.canone_annuo), deposito_cauzionale: Util.parseNumber(r.deposito_cauzionale),
              aggiornamento_istat: sino(r.aggiornamento_istat), data_registrazione: Util.parseDate(r.data_registrazione), estremi_registrazione: r.estremi_registrazione || null, note: r.note || null
            },
            immobile: {
              indirizzo: r.immobile_indirizzo || null, comune: r.immobile_comune || null, provincia: r.immobile_provincia || null,
              categoria_fiscale: Dominio.normalizza(Dominio.CATEGORIE_FISCALI, r.categoria_fiscale) || Dominio.categoriaDaCatastale(r.categoria_catastale) || 'abitativo',
              categoria_catastale: r.categoria_catastale || null, foglio: r.foglio || null, particella: r.particella || null, subalterno: r.subalterno || null, rendita: Util.parseNumber(r.rendita)
            },
            parti: [...textToParti(r.locatori, 'locatore'), ...textToParti(r.conduttori, 'conduttore')],
            force: true
          };
          Repo.saveContrattoTx(data);
          if (id) esito.aggiornati++; else esito.creati++;
        } catch (e) {
          esito.errori.push(`Riga ${i + 2}: ${e.message}`);
        }
      });
      return esito;
    });
  }
  return { exportJSON, importJSON, exportCSV, importCSVContratti, TABELLE };
});

/* ---------------------------------------------------------------------
   UI — utilità di interfaccia: template con escape automatico, toast,
   finestre modali, conferme. Nessuna logica di dominio.
   --------------------------------------------------------------------- */
Modules.define('UI', ['Util', 'Log'], (Util, Log) => {
  const RAW = Symbol('raw');
  const raw = (s) => ({ [RAW]: String(s) });
  const fmt = (v) => v == null || v === false ? '' : Array.isArray(v) ? v.map(fmt).join('') : (typeof v === 'object' && RAW in v) ? v[RAW] : Util.esc(v);
  /** Template HTML: i valori interpolati sono sempre "escapati", salvo raw(). */
  function html(strings, ...vals) { return raw(strings.reduce((acc, s, i) => acc + s + (i < vals.length ? fmt(vals[i]) : ''), '')); }
  const str = (h) => fmt(h);
  function options(list, selected, { empty } = {}) {
    return raw((empty != null ? `<option value="">${Util.esc(empty)}</option>` : '') + list.map(o => `<option value="${Util.esc(o.v)}"${String(o.v) === String(selected ?? '') ? ' selected' : ''}>${Util.esc(o.l)}</option>`).join(''));
  }
  function toast(msg, type = 'ok', ms = 4000) {
    const box = document.getElementById('toast');
    const t = document.createElement('div');
    t.className = 't ' + type; t.textContent = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), ms);
  }
  const modalEl = () => document.getElementById('modal');
  let onModalClose = null;
  const closedListeners = new Set();
  /** Chiusura della finestra: callback della finestra corrente + ascoltatori globali. Chiamata sia da closeModal
      sia dall'evento nativo (tasto Esc), perché l'evento "close" non arriva sempre (es. scheda in background). */
  function runClose() {
    const cb = onModalClose; onModalClose = null;
    if (cb) cb();
    closedListeners.forEach(fn => fn());
  }
  function openModal({ title, body, footer, onMount, onClose }) {
    const m = modalEl();
    m.innerHTML = str(html`<div class="modal-head"><h2>${title}</h2><button class="btn small" data-close aria-label="Chiudi">✕</button></div><div class="modal-body">${body}</div>${footer ? html`<div class="modal-foot">${footer}</div>` : ''}`);
    m.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal()));
    onModalClose = onClose || null;
    m.onclose = () => { if (onModalClose || closedListeners.size) runClose(); };
    if (!m.open) m.showModal();
    m.scrollTop = 0;
    if (onMount) { try { onMount(m); } catch (e) { Log.fromError('UI', e, 'Apertura finestra'); toast(e.message, 'danger'); } }
    return m;
  }
  function closeModal() { const m = modalEl(); if (!m.open) return; m.close(); runClose(); }
  const isModalOpen = () => modalEl().open;
  /** Conferma asincrona; se una modale è già aperta usa window.confirm per non perderne il contenuto. */
  function confirmDialog(message, { ok = 'Conferma', danger = false } = {}) {
    if (isModalOpen()) return Promise.resolve(window.confirm(message));
    return new Promise((resolve) => {
      let result = false;
      openModal({
        title: 'Conferma', body: html`<p style="white-space:pre-wrap">${message}</p>`,
        footer: html`<button class="btn" data-close>Annulla</button><button class="btn ${danger ? 'danger' : 'primary'}" id="confirm-ok">${ok}</button>`,
        onMount: (m) => m.querySelector('#confirm-ok').addEventListener('click', () => { result = true; closeModal(); }),
        onClose: () => resolve(result)
      });
    });
  }
  /** Esegue un'azione asincrona mostrando l'errore all'utente e registrandolo nel log. */
  async function guard(module, context, fn) {
    try { return await fn(); }
    catch (e) {
      if (e && e.name === 'AbortError') return undefined; // l'utente ha chiuso un selettore file
      Log.fromError(module, e, context);
      toast(context + ': ' + e.message, 'danger', 7000);
      return undefined;
    }
  }
  /** Legge i campi [name] di un contenitore in un oggetto (checkbox → 0/1, data-type="number"). */
  function readForm(root, selector = '[name]') {
    const out = {};
    root.querySelectorAll(selector).forEach(el => {
      if (el.type === 'checkbox') out[el.name] = el.checked ? 1 : 0;
      else if (el.dataset.type === 'number') out[el.name] = Util.parseNumber(el.value);
      else if (el.dataset.type === 'int') { const n = Util.parseNumber(el.value); out[el.name] = n == null ? null : Math.round(n); }
      else out[el.name] = el.value.trim() === '' ? null : el.value.trim();
    });
    return out;
  }
  function pickFile(accept) {
    const input = document.getElementById('hidden-file-input');
    return new Promise((resolve) => {
      input.value = ''; input.accept = accept || '';
      input.onchange = () => resolve(input.files[0] || null);
      input.click();
    });
  }
  return { html, raw, str, options, toast, openModal, closeModal, isModalOpen, confirmDialog, guard, readForm, pickFile, onModalClosed: (fn) => closedListeners.add(fn) };
});

/* ---------------------------------------------------------------------
   ContrattoForm — maschera di inserimento/modifica/revisione import.
   Usata sia da "Contratti" sia da "Importa da cartella" (con il testo
   estratto affiancato per la verifica).
   --------------------------------------------------------------------- */
Modules.define('ContrattoForm', ['UI', 'Repo', 'Dominio', 'Util', 'Parser', 'FolderImport', 'Log'], (UI, Repo, Dominio, Util, Parser, FolderImport, Log) => {
  const { html, raw, options } = UI;

  function partyRow(p, i) {
    return html`<div class="party" data-party="${i}">
      <div class="form-grid">
        <label class="field"><span>Ruolo</span><select data-p="ruolo">${options([{ v: 'locatore', l: 'Locatore' }, { v: 'conduttore', l: 'Conduttore' }], p.ruolo)}</select></label>
        <label class="field"><span>Tipo</span><select data-p="tipo">${options([{ v: 'PF', l: 'Persona fisica' }, { v: 'PG', l: 'Società / ente' }], p.tipo || 'PF')}</select></label>
        <label class="field ${p.denominazione ? '' : 'missing'}" style="grid-column: span 2"><span>Nome / denominazione</span><input data-p="denominazione" value="${p.denominazione || ''}" list="dl-soggetti"></label>
        <label class="field"><span>Codice fiscale</span><input data-p="codice_fiscale" value="${p.codice_fiscale || ''}" maxlength="16" style="text-transform:uppercase"></label>
        <label class="field"><span>Partita IVA</span><input data-p="partita_iva" value="${p.partita_iva || ''}" maxlength="13"></label>
        <label class="field" style="grid-column: span 2"><span>Indirizzo / sede</span><input data-p="indirizzo" value="${p.indirizzo || ''}"></label>
        <label class="field"><span>Quota %</span><input data-p="quota" value="${p.quota ?? ''}" inputmode="decimal"></label>
      </div>
      <div class="toolbar" style="margin:8px 0 0"><span class="muted cf-check"></span><span class="grow"></span>${p.fonte ? html`<span class="tag info">rilevato: ${p.fonte}</span>` : ''}<button type="button" class="btn small danger" data-remove-party>Rimuovi</button></div>
    </div>`;
  }

  function field(name, labelText, value, { type = 'text', trovati, required, attrs = '', wide } = {}) {
    const cls = ['field', trovati && trovati[name] ? 'auto' : '', required && (value == null || value === '') ? 'missing' : '', wide ? 'wide' : ''].join(' ');
    const dt = type === 'number' ? 'number' : type === 'int' ? 'int' : '';
    const inputType = type === 'number' || type === 'int' ? 'text' : type;
    const v = type === 'number' && value != null && value !== '' ? Util.fmtNumberIT(value) : (value ?? '');
    return html`<label class="${cls}" title="${trovati && trovati[name] ? 'Dal testo: ' + trovati[name] : ''}"><span>${labelText}</span><input name="${name}" type="${inputType}" value="${v}" ${dt ? raw(`data-type="${dt}" inputmode="decimal"`) : ''} ${raw(attrs)}></label>`;
  }
  function select(name, labelText, list, value, { trovati, required } = {}) {
    const cls = ['field', trovati && trovati[name] ? 'auto' : '', required && !value ? 'missing' : ''].join(' ');
    return html`<label class="${cls}" title="${trovati && trovati[name] ? 'Dal testo: ' + trovati[name] : ''}"><span>${labelText}</span><select name="${name}">${options(list, value, { empty: '— seleziona —' })}</select></label>`;
  }

  /**
   * @param {object} p
   * @param {object} p.data      {contratto, immobile, parti}
   * @param {object} [p.trovati] campi rilevati automaticamente (con frammento)
   * @param {string[]} [p.avvisi]
   * @param {object} [p.documento] {id, nome_file, testo_estratto}
   * @param {function} p.onSaved (id) => void
   */
  function open({ data, trovati = {}, avvisi = [], documento = null, onSaved }) {
